<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Builder - EduPulse LMS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Top Navigation Bar -->
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-teal-600 to-emerald-500 flex items-center justify-center text-white font-bold text-xl shadow-md">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold">Course Builder & Materials</h1>
                    <p class="text-xs text-slate-400">Manage lessons, lecture slides, and resources</p>
                </div>
            </div>
            <a href="/teacher" class="px-4 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-xl text-xs font-semibold transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <!-- Success / Error Alerts -->
        <div th:if="${success}" class="p-4 mb-6 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 text-xs font-semibold border border-emerald-200 dark:border-emerald-800" th:text="${success}"></div>
        <div th:if="${error}" class="p-4 mb-6 rounded-xl bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 text-xs font-semibold border border-rose-200 dark:border-rose-800" th:text="${error}"></div>

        <!-- Upload Form Card -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-8">
            <h3 class="font-bold text-base mb-4 flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up text-teal-600"></i> Upload New Lesson Material
            </h3>
            
            <!-- Form targeting the lesson upload controller endpoint -->
            <form th:action="@{/teacher/lessons/{lessonId}/materials/upload(lessonId=${activeLessonId})}" method="post" enctype="multipart/form-data" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Material Title</label>
                    <input type="text" name="title" required placeholder="e.g., Week 1 Presentation Slides" 
                        class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 text-sm bg-slate-50 dark:bg-slate-900 focus:outline-none focus:border-teal-500"/>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Select File (PDF, PPT, TXT, etc.)</label>
                    <input type="file" name="file" required 
                        class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 dark:file:bg-teal-950/50 dark:file:text-teal-400 hover:file:bg-teal-100 cursor-pointer"/>
                </div>
                <div class="flex justify-end pt-2">
                    <button type="submit" class="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold transition shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-upload"></i> Upload Resource
                    </button>
                </div>
            </form>
        </div>

        <!-- Uploaded Materials List & Preview Links -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6">
            <h3 class="font-bold text-base mb-4 flex items-center gap-2">
                <i class="fa-solid fa-folder-open text-teal-600"></i> Uploaded Resources
            </h3>
            
            <div class="space-y-3">
                <div th:each="m : ${materials}" class="p-4 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-between bg-slate-50 dark:bg-slate-700/30">
                    <div>
                        <div class="font-bold text-sm text-slate-900 dark:text-white" th:text="${m.title}">Resource Title</div>
                        <div class="text-xs text-slate-400 mt-0.5" th:text="${m.file_type + ' · ' + m.file_size_kb + ' KB · Uploaded: ' + m.created_at}">PDF · 1024 KB</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <!-- Opens file inline inside browser for direct preview -->
                        <a th:href="@{/teacher/materials/preview/{fileName}(fileName=${m.file_path})}" target="_blank" 
                           class="px-3.5 py-1.5 bg-teal-50 text-teal-700 hover:bg-teal-100 dark:bg-teal-950/50 dark:text-teal-400 dark:hover:bg-teal-900/50 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
                            <i class="fa-solid fa-eye"></i> Preview
                        </a>
                    </div>
                </div>
                <div th:if="${materials == null or materials.empty}" class="text-center text-slate-400 text-xs py-10">
                    <i class="fa-regular fa-folder-open text-3xl mb-2 block opacity-40"></i>
                    No materials uploaded for this lesson yet.
                </div>
            </div>
        </div>
    </div>

</body>
</html>
