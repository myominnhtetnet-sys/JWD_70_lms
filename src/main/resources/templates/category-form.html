<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{head :: head}">
    <meta charset="UTF-8">
    <title>Category Form</title>
</head>
<body class="bg-slate-50 dark:bg-slate-900 p-6 min-h-screen">

<div th:fragment="category-form" class="space-y-6 max-w-3xl mx-auto">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <!-- FIX: Checked category_id for null instead of id == 0 -->
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white" 
                th:text="${category.category_id == null || category.category_id == 0 ? 'Create New Category' : 'Edit Category'}">
                Create New Category
            </h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">Fill in the details below to configure course categorization.</p>
        </div>
        <div class="flex items-center gap-3">
            <a th:href="@{/admin/category-list}" class="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition flex items-center gap-2 text-slate-700 dark:text-slate-200">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Categories
            </a>
        </div>
    </div>

    <!-- Form Container -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm p-6">
        <form th:action="@{/admin/categories/save}" th:object="${category}" method="post" class="space-y-5">
            
            <!-- FIX: Changed id to category_id -->
            <input type="hidden" th:field="*{category_id}" />

            <!-- Category Name -->
            <div>
                <label for="name" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Category Name</label>
                <input type="text" id="name" th:field="*{name}" required placeholder="e.g. Data Science" class="w-full text-xs px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Slug -->
            <div>
                <label for="slug" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Slug</label>
                <input type="text" id="slug" th:field="*{slug}" placeholder="e.g. data-science" class="w-full text-xs px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Parent Category ID -->
            <div>
                <label for="parent_id" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Parent Category ID (Optional)</label>
                <input type="number" id="parent_id" th:field="*{parent_id}" placeholder="Leave empty or 0 for top-level category" class="w-full text-xs px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
                <!-- Parent Category Dropdown -->

            </div>

            <!-- Description -->
            <div>
                <label for="description" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Description</label>
                <textarea id="description" th:field="*{description}" rows="4" placeholder="Brief details about this category..." class="w-full text-xs px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500"></textarea>
            </div>

            <!-- Active Checkbox -->
            <div class="flex items-center gap-2 pt-1">
               <!-- Example Select Option -->
<select th:field="*{is_active}" class="w-full border rounded-lg p-2">
    <option value="1">Active</option>
    <option value="0">Inactive</option>
</select>
            </div>

            <!-- Submit Button -->
            <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-100 dark:border-slate-700">
                <a th:href="@{/admin/category-list}" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg text-xs font-semibold text-slate-700 dark:text-slate-200 transition">
                    Cancel
                </a>
                <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition shadow-sm">
                    Save Category
                </button>
            </div>

        </form>
    </div>

</div>

</body>
</html>
