```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{head :: head}"></head>

<body class="h-full font-sans text-slate-800 bg-slate-50 dark:bg-slate-900">

    <div id="app" class="min-h-screen flex flex-col">

        <!-- HEADER -->
        <div th:replace="~{header :: header}"></div>

        <div class="flex-1 flex overflow-hidden">

            <!-- SIDEBAR -->
            <div th:replace="~{nav :: nav}"></div>

            <!-- BACKGROUND PAGE -->
            <main class="flex-1 overflow-y-auto p-8 bg-slate-100 dark:bg-slate-900">

                <div class="max-w-7xl mx-auto">

                    <div class="flex justify-between items-center mb-8">
                        <div>
                            <h1 class="text-3xl font-bold text-slate-900 dark:text-white">
                                Categories
                            </h1>
                            <p class="text-sm text-slate-500 mt-2">
                                Manage your course categories.
                            </p>
                        </div>

                        <a th:href="@{/admin/categories/add}"
                           class="px-5 py-3 bg-indigo-600 text-white rounded-xl font-semibold">
                            <i class="fa-solid fa-plus mr-2"></i>
                            Add Category
                        </a>
                    </div>

                    <!-- BACKGROUND CATEGORY TABLE -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">

                        <h2 class="font-bold text-lg mb-5">Category List</h2>

                        <table class="w-full text-sm text-left">

                            <thead class="bg-slate-50 text-slate-500">
                                <tr>
                                    <th class="p-4">Category Name</th>
                                    <th class="p-4">Slug</th>
                                    <th class="p-4">Description</th>
                                    <th class="p-4">Status</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="item : ${categories}"
                                    class="border-t border-slate-100">

                                    <td class="p-4 font-semibold"
                                        th:text="${item.name}"></td>

                                    <td class="p-4"
                                        th:text="${item.slug}"></td>

                                    <td class="p-4"
                                        th:text="${item.description}"></td>

                                    <td class="p-4">
                                        <span th:if="${item.is_active == 1}"
                                              class="text-green-600 font-semibold">
                                            Active
                                        </span>

                                        <span th:if="${item.is_active == 0}"
                                              class="text-red-500 font-semibold">
                                            Inactive
                                        </span>
                                    </td>
                                </tr>
                            </tbody>

                        </table>
                    </div>

                </div>
            </main>
        </div>

    </div>


    <!-- ================================= -->
    <!-- CATEGORY MODAL BACKGROUND OVERLAY -->
    <!-- ================================= -->

    <div id="categoryModal"
         class="fixed inset-0 z-50 flex items-center justify-center
                bg-slate-900/50 backdrop-blur-sm p-3 sm:p-5">

        <!-- MODAL CONTAINER -->
        <div class="relative bg-white w-full max-w-2xl
                    rounded-2xl shadow-2xl border border-slate-200
                    overflow-hidden max-h-[95vh] flex flex-col">

            <!-- MODAL HEADER -->
            <div class="px-7 py-6 border-b border-slate-100
                        bg-white flex items-center justify-between shrink-0">

                <div>
                    <h2 class="text-2xl font-bold text-slate-900"
                        th:text="${category.category_id != null and category.category_id > 0}
                        ? 'Edit Category' : 'Add Category'">
                        Category Form
                    </h2>

                    <p class="text-sm text-slate-500 mt-1">
                        Configure your course category details.
                    </p>
                </div>

                <a th:href="@{/admin/categories/list}"
                   class="text-slate-400 hover:text-slate-700
                          transition text-2xl"
                   aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </a>

            </div>


            <!-- ERROR MESSAGE -->
            <div th:if="${errorMessage}"
                 class="mx-7 mt-4 p-3 rounded-lg bg-red-50
                        text-red-700 border border-red-200 text-sm">

                <i class="fa-solid fa-circle-exclamation mr-2"></i>

                <span th:text="${errorMessage}">
                    Category error
                </span>
            </div>


            <!-- SCROLLABLE FORM BODY -->
            <form th:action="@{/admin/categories/save}"
                  th:object="${category}"
                  method="post"
                  class="flex flex-col min-h-0">

                <div class="px-7 py-6 space-y-5 overflow-y-auto">

                    <!-- HIDDEN ID -->
                    <input type="hidden" th:field="*{category_id}">


                    <!-- CATEGORY NAME -->
                    <div>
                        <label for="name"
                               class="block text-sm font-semibold
                                      text-slate-700 mb-2">
                            Category Name <span class="text-red-500">*</span>
                        </label>

                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               placeholder="e.g. Web Development"
                               required
                               class="w-full px-4 py-3 rounded-xl
                                      border border-slate-300
                                      focus:ring-2 focus:ring-indigo-500
                                      focus:border-indigo-500
                                      outline-none text-sm">
                    </div>


                    <!-- SLUG -->
                    <div>
                        <label for="slug"
                               class="block text-sm font-semibold
                                      text-slate-700 mb-2">
                            URL Slug <span class="text-red-500">*</span>
                        </label>

                        <input type="text"
                               id="slug"
                               th:field="*{slug}"
                               placeholder="e.g. web-development"
                               required
                               class="w-full px-4 py-3 rounded-xl
                                      border border-slate-300
                                      focus:ring-2 focus:ring-indigo-500
                                      focus:border-indigo-500
                                      outline-none text-sm">
                    </div>


                    <!-- PARENT CATEGORY -->
                    <div>
                        <label for="parent_id"
                               class="block text-sm font-semibold
                                      text-slate-700 mb-2">
                            Parent Category ID
                            <span class="text-slate-400 font-normal">
                                (Optional)
                            </span>
                        </label>

                        <input type="number"
                               id="parent_id"
                               th:field="*{parent_id}"
                               min="1"
                               placeholder="Leave empty for root category"
                               class="w-full px-4 py-3 rounded-xl
                                      border border-slate-300
                                      focus:ring-2 focus:ring-indigo-500
                                      focus:border-indigo-500
                                      outline-none text-sm">
                    </div>


                    <!-- DESCRIPTION -->
                    <div>
                        <label for="description"
                               class="block text-sm font-semibold
                                      text-slate-700 mb-2">
                            Description
                        </label>

                        <textarea id="description"
                                  th:field="*{description}"
                                  rows="3"
                                  placeholder="Write a brief overview of this category..."
                                  class="w-full px-4 py-3 rounded-xl
                                         border border-slate-300
                                         focus:ring-2 focus:ring-indigo-500
                                         focus:border-indigo-500
                                         outline-none text-sm resize-none"></textarea>
                    </div>


                    <!-- STATUS -->
                    <div>
                        <label for="is_active"
                               class="block text-sm font-semibold
                                      text-slate-700 mb-2">
                            Status
                        </label>

                        <select id="is_active"
                                th:field="*{is_active}"
                                class="w-full px-4 py-3 rounded-xl
                                       border border-slate-300 bg-white
                                       focus:ring-2 focus:ring-indigo-500
                                       focus:border-indigo-500
                                       outline-none text-sm">

                            <option value="1">Active</option>
                            <option value="0">Inactive</option>

                        </select>
                    </div>


                    <!-- ERROR VALIDATION -->
                    <div class="text-sm text-red-600"
                         th:if="${#fields.hasErrors('*')}">

                        <p th:each="err : ${#fields.errors('*')}"
                           th:text="${err}">
                            Validation error
                        </p>

                    </div>

                </div>


                <!-- MODAL FOOTER -->
                <div class="px-7 py-5 border-t border-slate-100
                            bg-white flex justify-end items-center
                            gap-3 shrink-0">

                    <a th:href="@{/admin/categories/list}"
                       class="px-6 py-3 rounded-xl
                              border border-slate-300
                              text-slate-700 text-sm font-semibold
                              hover:bg-slate-50 transition">

                        Cancel
                    </a>

                    <button type="submit"
                            class="px-7 py-3 rounded-xl
                                   bg-indigo-600 hover:bg-indigo-700
                                   text-white text-sm font-bold
                                   shadow-sm transition">

                        <i class="fa-solid fa-check mr-2"></i>

                        <span th:text="${category.category_id != null and category.category_id > 0}
                        ? 'Update Category' : 'Save Category'">
                            Save Category
                        </span>

                    </button>

                </div>

            </form>

        </div>

    </div>


</body>
</html>
