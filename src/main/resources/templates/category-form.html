<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${category.category_id != null and category.category_id > 0} ? 'Edit Category' : 'Add Category'">Category Form</title>
    
    <!-- FIXED: Replaced Bootstrap with Tailwind CSS script to match your dashboard styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-8">

    <div class="max-w-xl mx-auto">
        
        <!-- Error Alert for Duplicate Entries -->
        <div th:if="${errorMessage}" class="mb-5 p-4 rounded-xl bg-red-100 text-red-800 border border-red-200 text-sm font-medium flex justify-between items-center shadow-sm">
            <span th:text="${errorMessage}">A category with this name already exists.</span>
            <button type="button" onclick="this.parentElement.remove()" class="text-red-600 hover:text-red-800">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-900" 
                    th:text="${category.category_id != null and category.category_id > 0} ? 'Edit Category' : 'Add New Category'">
                    Category Form
                </h2>
                <a th:href="@{/admin/categories/list}" class="text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </a>
            </div>

            <form th:action="@{/admin/categories/save}" th:object="${category}" method="post" class="p-6 space-y-5">
                
                <!-- Hidden Primary Key ID Field -->
                <input type="hidden" th:field="*{category_id}" />

                <!-- Category Name -->
                <div>
                    <label for="name" class="block text-sm font-semibold text-slate-700 mb-1">Category Name</label>
                    <input type="text" id="name" th:field="*{name}" required 
                           placeholder="e.g. Web Development"
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                </div>

                <!-- Slug -->
                <div>
                    <label for="slug" class="block text-sm font-semibold text-slate-700 mb-1">URL Slug</label>
                    <input type="text" id="slug" th:field="*{slug}" required
                           placeholder="e.g. web-development"
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                </div>

                <!-- Parent Category ID (Optional) -->
                <div>
                    <label for="parent_id" class="block text-sm font-semibold text-slate-700 mb-1">Parent Category ID (Optional)</label>
                    <input type="number" id="parent_id" th:field="*{parent_id}" 
                           placeholder="Leave empty for root category"
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                </div>

                <!-- Description -->
                <div>
                    <label for="description" class="block text-sm font-semibold text-slate-700 mb-1">Description</label>
                    <textarea id="description" th:field="*{description}" rows="3"
                              placeholder="Write a brief overview of this category..."
                              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm resize-none"></textarea>
                </div>

                <!-- Status -->
                <div>
                    <label for="is_active" class="block text-sm font-semibold text-slate-700 mb-1">Status</label>
                    <select id="is_active" th:field="*{is_active}" 
                            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm bg-white">
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>
                </div>

                <!-- Actions -->
                <div class="pt-4 flex items-center justify-end space-x-3 border-t border-slate-100">
                    <a th:href="@{/admin/categories/list}" class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-700 text-sm font-medium hover:bg-slate-50 transition">
                        Cancel
                    </a>
                    <button type="submit" class="px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition shadow-sm">
                        Save Category
                    </button>
                </div>

            </form>
        </div>

    </div>

</body>
</html>
