<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Question Bank</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font Awesome -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-slate-100">

	<div class="p-6">

		<!-- =========================
             Header
        ========================== -->
		<div class="flex justify-between items-center mb-6">

			<div>
				<h1 class="text-2xl font-bold text-slate-800">Question Bank</h1>

				<p class="text-slate-500 mt-1">Create and manage questions for
					your courses</p>
			</div>

			<button onclick="openQuestionForm()"
				class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-lg">

				<i class="fa-solid fa-plus mr-2"></i> Add Question

			</button>

		</div>


		<!-- =========================
             Search & Filter
        ========================== -->
		<div class="bg-white p-5 rounded-xl shadow-sm mb-6">

			<div class="grid grid-cols-1 md:grid-cols-3 gap-4">

				<!-- Search -->
				<input id="searchInput" type="text"
					placeholder="Search questions..."
					class="border border-slate-300 rounded-lg px-4 py-3
                           focus:outline-none focus:ring-2 focus:ring-indigo-500">

				<!-- Course Filter -->
				<select id="courseFilter"
					class="border border-slate-300 rounded-lg px-4 py-3
                           focus:outline-none focus:ring-2 focus:ring-indigo-500">

					<option value="">All Courses</option>

				</select>

				<!-- Type Filter -->
				<select id="typeFilter"
					class="border border-slate-300 rounded-lg px-4 py-3
                           focus:outline-none focus:ring-2 focus:ring-indigo-500">

					<option value="">All Types</option>

					<option value="MCQ">MCQ</option>

					<option value="TRUE_FALSE">True / False</option>

					<option value="SHORT_ANSWER">Short Answer</option>

				</select>

			</div>

		</div>


		<!-- =========================
             Question Table
        ========================== -->
		<div class="bg-white rounded-xl shadow-sm overflow-hidden">

			<div class="overflow-x-auto">

				<table class="w-full">

					<thead class="bg-slate-50 border-b">

						<tr>

							<th
								class="px-6 py-4 text-left text-sm font-semibold text-slate-600">
								#</th>

							<th
								class="px-6 py-4 text-left text-sm font-semibold text-slate-600">
								Question</th>

							<th
								class="px-6 py-4 text-left text-sm font-semibold text-slate-600">
								Type</th>

							<th
								class="px-6 py-4 text-left text-sm font-semibold text-slate-600">
								Mark</th>

							<th
								class="px-6 py-4 text-left text-sm font-semibold text-slate-600">
								Status</th>

							<th
								class="px-6 py-4 text-center text-sm font-semibold text-slate-600">
								Action</th>

						</tr>

					</thead>


					<tbody id="questionTableBody">

						<!-- JavaScript will insert questions here -->

					</tbody>

				</table>

			</div>

		</div>

	</div>
	<!-- =========================
     Add Question Modal
========================== -->
<div id="questionModal"
     class="fixed inset-0 bg-black bg-opacity-50 hidden
            items-center justify-center z-50">

    <div class="bg-white rounded-xl shadow-xl
                w-full max-w-3xl max-h-[90vh]
                overflow-y-auto p-6">

        <!-- Modal Header -->
        <div class="flex justify-between items-center mb-6">

            <div>
                <h2 class="text-xl font-bold text-slate-800">
                    Add Question
                </h2>

                <p class="text-sm text-slate-500 mt-1">
                    Create a new question for your course
                </p>
            </div>

            <button
                onclick="closeQuestionForm()"
                class="text-slate-400 hover:text-slate-700 text-xl">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>


        <!-- =========================
             Question Form
        ========================== -->
        <form id="questionForm">


            <!-- Course -->
            <div class="mb-5">

                <label class="block text-sm font-medium
                              text-slate-700 mb-2">

                    Course

                </label>

                <select
                    id="questionCourse"
                    class="w-full border border-slate-300
                           rounded-lg px-4 py-3"
                    required>

                    <option value="">
                        Select Course
                    </option>

                    <option value="1">
                        HTML & CSS
                    </option>

                    <option value="2">
                        Java Programming
                    </option>

                    <option value="3">
                        Spring Boot
                    </option>

                </select>

            </div>


            <!-- Question Text -->
            <div class="mb-5">

                <label class="block text-sm font-medium
                              text-slate-700 mb-2">

                    Question

                </label>

                <textarea
                    id="questionText"
                    rows="4"
                    placeholder="Enter your question..."
                    class="w-full border border-slate-300
                           rounded-lg px-4 py-3"
                    required></textarea>

            </div>


            <!-- Question Type -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">

                <div>

                    <label class="block text-sm font-medium
                                  text-slate-700 mb-2">

                        Question Type

                    </label>

                    <select
                        id="questionType"
                        class="w-full border border-slate-300
                               rounded-lg px-4 py-3"
                        onchange="changeQuestionType()"
                        required>

                        <option value="">
                            Select Type
                        </option>

                        <option value="MCQ">
                            MCQ
                        </option>

                        <option value="TRUE_FALSE">
                            True / False
                        </option>

                        <option value="SHORT_ANSWER">
                            Short Answer
                        </option>

                    </select>

                </div>


                <!-- Mark -->
                <div>

                    <label class="block text-sm font-medium
                                  text-slate-700 mb-2">

                        Default Mark

                    </label>

                    <input
                        id="defaultMark"
                        type="number"
                        min="0"
                        step="0.5"
                        value="1"
                        class="w-full border border-slate-300
                               rounded-lg px-4 py-3"
                        required>

                </div>

            </div>


            <!-- Explanation -->
            <div class="mb-5">

                <label class="block text-sm font-medium
                              text-slate-700 mb-2">

                    Explanation

                </label>

                <textarea
                    id="explanation"
                    rows="3"
                    placeholder="Explanation shown after grading..."
                    class="w-full border border-slate-300
                           rounded-lg px-4 py-3"></textarea>

            </div>


            <!-- =========================
                 Options Area
            ========================== -->
            <div id="optionsSection"
                 class="hidden mb-5">

                <div class="flex justify-between items-center mb-3">

                    <div>

                        <h3 class="font-semibold text-slate-800">
                            Answer Options
                        </h3>

                        <p class="text-sm text-slate-500">
                            Select the correct answer
                        </p>

                    </div>

                </div>


                <div id="optionsContainer">

                    <!-- Options will be generated here -->

                </div>

            </div>


            <!-- Buttons -->
            <div class="flex justify-end gap-3 mt-6">

                <button
                    type="button"
                    onclick="closeQuestionForm()"
                    class="px-5 py-3 border border-slate-300
                           rounded-lg text-slate-700
                           hover:bg-slate-50">

                    Cancel

                </button>


                <button
                    type="submit"
                    class="px-5 py-3 bg-indigo-600
                           hover:bg-indigo-700
                           text-white rounded-lg">

                    <i class="fa-solid fa-save mr-2"></i>

                    Save Question

                </button>

            </div>

        </form>

    </div>

</div>


	<!-- =========================
         JavaScript
    ========================== -->
	<script>

        /*
         * =========================
         * Load Questions
         * =========================
         */
        function loadQuestions() {

            fetch('/api/questions')

                .then(response => {

                    if (!response.ok) {
                        throw new Error('Failed to load questions');
                    }

                    return response.json();

                })

                .then(data => {

                    console.log("Questions:", data);

                    renderQuestions(data);

                })

                .catch(error => {

                    console.error("Error loading questions:", error);

                    const tableBody =
                        document.getElementById('questionTableBody');

                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="6"
                                class="text-center text-red-500 py-8">

                                Failed to load questions.

                            </td>
                        </tr>
                    `;

                });
        }


        /*
         * =========================
         * Render Questions
         * =========================
         */
        function renderQuestions(questions) {

            const tableBody =
                document.getElementById('questionTableBody');

            tableBody.innerHTML = '';


            /*
             * If no questions
             */
            if (questions.length === 0) {

                tableBody.innerHTML = `
                    <tr>

                        <td colspan="6"
                            class="text-center text-slate-500 py-8">

                            No questions found.

                        </td>

                    </tr>
                `;

                return;
            }


            /*
             * Loop questions
             */
            questions.forEach((question, index) => {

                const row = document.createElement('tr');

                row.className =
                    'border-t hover:bg-slate-50';


                /*
                 * Question Type Badge
                 */
                let typeClass = '';

                if (question.questionType === 'MCQ') {

                    typeClass =
                        'bg-blue-100 text-blue-700';

                } else if (question.questionType === 'TRUE_FALSE') {

                    typeClass =
                        'bg-purple-100 text-purple-700';

                } else if (question.questionType === 'SHORT_ANSWER') {

                    typeClass =
                        'bg-orange-100 text-orange-700';

                } else {

                    typeClass =
                        'bg-slate-100 text-slate-700';

                }


                /*
                 * Status
                 */
                let statusHtml = '';

                if (question.isActive) {

                    statusHtml = `
                        <span class="text-green-600 font-medium">
                            <i class="fa-solid fa-circle-check mr-1"></i>
                            Active
                        </span>
                    `;

                } else {

                    statusHtml = `
                        <span class="text-red-600 font-medium">
                            <i class="fa-solid fa-circle-xmark mr-1"></i>
                            Inactive
                        </span>
                    `;

                }


                /*
                 * Create Row
                 */
                row.innerHTML = `

                    <!-- Number -->
                    <td class="px-6 py-4">
                        ${index + 1}
                    </td>


                    <!-- Question -->
                    <td class="px-6 py-4">

                        <div class="font-medium text-slate-800">

                            ${question.questionText}

                        </div>

                    </td>


                    <!-- Type -->
                    <td class="px-6 py-4">

                        <span
                            class="px-3 py-1 rounded-full text-xs font-medium
                                   ${typeClass}">

                            ${question.questionType}

                        </span>

                    </td>


                    <!-- Mark -->
                    <td class="px-6 py-4">

                        ${question.defaultMark}

                    </td>


                    <!-- Status -->
                    <td class="px-6 py-4">

                        ${statusHtml}

                    </td>


                    <!-- Actions -->
                    <td class="px-6 py-4 text-center">

                        <!-- View -->
                        <button
                            onclick="viewQuestion(${question.questionId})"
                            class="text-blue-600 hover:text-blue-800 mr-4"
                            title="View">

                            <i class="fa-solid fa-eye"></i>

                        </button>


                        <!-- Edit -->
                        <button
                            onclick="editQuestion(${question.questionId})"
                            class="text-yellow-600 hover:text-yellow-800 mr-4"
                            title="Edit">

                            <i class="fa-solid fa-pen"></i>

                        </button>


                        <!-- Delete -->
                        <button
                            onclick="deleteQuestion(${question.questionId})"
                            class="text-red-600 hover:text-red-800"
                            title="Delete">

                            <i class="fa-solid fa-trash"></i>

                        </button>

                    </td>

                `;


                tableBody.appendChild(row);

            });

        }


        /*
         * =========================
         * Open Question Form
         * =========================
         */
        function openQuestionForm() {

            const modal =
                document.getElementById('questionModal');

            modal.classList.remove('hidden');
            modal.classList.add('flex');

        }


        /*
         * =========================
         * Close Question Form
         * =========================
         */
        function closeQuestionForm() {

            const modal =
                document.getElementById('questionModal');

            modal.classList.add('hidden');
            modal.classList.remove('flex');


            /*
             * Reset form
             */
            document
                .getElementById('questionForm')
                .reset();


            /*
             * Hide options
             */
            document
                .getElementById('optionsSection')
                .classList.add('hidden');


            /*
             * Clear options
             */
            document
                .getElementById('optionsContainer')
                .innerHTML = '';

        }
        /*
         * =========================
         * Change Question Type
         * =========================
         */
        function changeQuestionType() {

            const type =
                document.getElementById('questionType').value;

            const optionsSection =
                document.getElementById('optionsSection');

            const optionsContainer =
                document.getElementById('optionsContainer');


            /*
             * Clear old options
             */
            optionsContainer.innerHTML = '';


            /*
             * No type selected
             */
            if (!type) {

                optionsSection.classList.add('hidden');

                return;
            }


            /*
             * MCQ
             */
            if (type === 'MCQ') {

                optionsSection.classList.remove('hidden');

                createOption('A');
                createOption('B');
                createOption('C');
                createOption('D');

            }


            /*
             * TRUE / FALSE
             */
            else if (type === 'TRUE_FALSE') {

                optionsSection.classList.remove('hidden');

                createOption('A', 'True');
                createOption('B', 'False');

            }


            /*
             * SHORT ANSWER
             */
            else if (type === 'SHORT_ANSWER') {

                optionsSection.classList.add('hidden');

            }

        }

        /*
         * =========================
         * Create Option
         * =========================
         */
        function createOption(label, defaultText = '') {

            const optionsContainer =
                document.getElementById('optionsContainer');


            const optionDiv =
                document.createElement('div');


            optionDiv.className =
                'flex items-center gap-3 mb-3';


            optionDiv.innerHTML = `

                <!-- Correct Answer -->
                <input
                    type="radio"
                    name="correctOption"
                    value="${label}"
                    class="w-4 h-4 text-indigo-600"
                    required>


                <!-- Label -->
                <div
                    class="w-10 h-10 flex items-center
                           justify-center bg-slate-100
                           rounded-lg font-semibold">

                    ${label}

                </div>


                <!-- Option Text -->
                <input
                    type="text"
                    id="option_${label}"
                    value="${defaultText}"
                    placeholder="Option ${label}"
                    class="flex-1 border border-slate-300
                           rounded-lg px-4 py-3"
                    required>

            `;


            optionsContainer.appendChild(optionDiv);

        }
        /*
         * =========================
         * Submit Question Form
         * =========================
         */
        document
            .getElementById('questionForm')
            .addEventListener('submit', function (event) {

                event.preventDefault();


                /*
                 * Get form values
                 */
                const courseId =
                    document.getElementById('questionCourse').value;

                const questionText =
                    document.getElementById('questionText').value;

                const questionType =
                    document.getElementById('questionType').value;

                const defaultMark =
                    document.getElementById('defaultMark').value;

                const explanation =
                    document.getElementById('explanation').value;


                /*
                 * Create Question Object
                 */
                const question = {

                    courseId: Number(courseId),

                    questionText: questionText,

                    questionType: questionType,

                    defaultMark: Number(defaultMark),

                    explanation: explanation,

                    isActive: true,

                    createdBy: 1

                };


                console.log("Question:", question);


                /*
                 * Save Question
                 */
                fetch('/api/questions', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify(question)

                })

                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            'Failed to save question'
                        );

                    }

                    return response.json();

                })

                .then(questionId => {

                    console.log(
                        "Created Question ID:",
                        questionId
                    );


                    /*
                     * If MCQ or TRUE_FALSE,
                     * save options
                     */
                    if (
                        questionType === 'MCQ' ||
                        questionType === 'TRUE_FALSE'
                    ) {

                        return saveOptions(questionId);

                    }


                    /*
                     * SHORT_ANSWER
                     */
                    return null;

                })

                .then(() => {

                    alert(
                        'Question saved successfully!'
                    );


                    closeQuestionForm();


                    /*
                     * Reload question list
                     */
                    loadQuestions();

                })

                .catch(error => {

                    console.error(
                        'Error saving question:',
                        error
                    );

                    alert(
                        'Failed to save question.'
                    );

                });

            });
        
        /*
         * =========================
         * Save Options
         * =========================
         */
        function saveOptions(questionId) {

            const questionType =
                document.getElementById('questionType').value;


            let labels = [];


            if (questionType === 'MCQ') {

                labels = ['A', 'B', 'C', 'D'];

            }

            else if (questionType === 'TRUE_FALSE') {

                labels = ['A', 'B'];

            }


            /*
             * Get correct answer
             */
            const correctOption =
                document.querySelector(
                    'input[name="correctOption"]:checked'
                ).value;


            /*
             * Create save requests
             */
            const requests = labels.map(label => {

                const optionText =
                    document.getElementById(
                        `option_${label}`
                    ).value;


                const option = {

                    optionLabel: label,

                    optionText: optionText,

                    isCorrect:
                        label === correctOption

                };


                console.log(
                    "Saving option:",
                    option
                );


                return fetch(
                    `/api/questions/${questionId}/options`,
                    {

                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify(option)

                    }

                )
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            `Failed to save option ${label}`
                        );

                    }

                    return response.json();

                });

            });


            /*
             * Wait until all options are saved
             */
            return Promise.all(requests);

        }

        /*
         * =========================
         * View Question
         * =========================
         */
        function viewQuestion(questionId) {

            console.log("View Question ID:", questionId);

            alert("View Question ID: " + questionId);

        }


        /*
         * =========================
         * Edit Question
         * =========================
         */
        function editQuestion(questionId) {

            console.log("Edit Question ID:", questionId);

            alert("Edit Question ID: " + questionId);

        }


        /*
         * =========================
         * Delete Question
         * =========================
         */
        function deleteQuestion(questionId) {

            const confirmDelete =
                confirm("Are you sure you want to delete this question?");


            if (!confirmDelete) {
                return;
            }


            fetch(`/api/questions/${questionId}`, {

                method: 'DELETE'

            })

                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            'Failed to delete question'
                        );

                    }

                    return response.text();

                })

                .then(data => {

                    console.log("Delete result:", data);

                    alert("Question deleted successfully!");

                    loadQuestions();

                })

                .catch(error => {

                    console.error(
                        "Error deleting question:",
                        error
                    );

                    alert("Failed to delete question.");

                });

        }


        /*
         * =========================
         * Search
         * =========================
         */
        document
            .getElementById('searchInput')
            .addEventListener('input', function () {

                const searchText =
                    this.value.toLowerCase();

                const rows =
                    document.querySelectorAll(
                        '#questionTableBody tr'
                    );


                rows.forEach(row => {

                    const questionText =
                        row.innerText.toLowerCase();

                    if (questionText.includes(searchText)) {

                        row.style.display = '';

                    } else {

                        row.style.display = 'none';

                    }

                });

            });


        /*
         * =========================
         * Type Filter
         * =========================
         */
        document
            .getElementById('typeFilter')
            .addEventListener('change', function () {

                const selectedType = this.value;

                const rows =
                    document.querySelectorAll(
                        '#questionTableBody tr'
                    );


                rows.forEach(row => {

                    if (!selectedType) {

                        row.style.display = '';

                        return;

                    }


                    const rowText =
                        row.innerText;


                    if (rowText.includes(selectedType)) {

                        row.style.display = '';

                    } else {

                        row.style.display = 'none';

                    }

                });

            });


        /*
         * =========================
         * Page Load
         * =========================
         */
        document.addEventListener('DOMContentLoaded', function () {

            loadQuestions();

        });

    </script>

</body>

</html>
