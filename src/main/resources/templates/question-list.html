<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Bank</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="text/javascript" th:src="@{/js/main.js}"></script>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-slate-100 text-slate-800">

	<div th:replace="~{header :: header}"></div>

	<main class="max-w-7xl mx-auto px-4 sm:px-6 py-5">

		<div class="flex flex-col sm:flex-row sm:items-center
                sm:justify-between gap-3 mb-5">

			<div>
				<h1 class="text-xl font-bold text-slate-800">Question Bank</h1>
				<p class="text-xs text-slate-500 mt-1">Create and manage
					questions for your courses.</p>
			</div>

			<a href="/questions/new"
				class="inline-flex items-center justify-center
          		gap-2 bg-indigo-600 hover:bg-indigo-700
          		text-white text-sm font-medium
          		px-4 py-2 rounded-lg shadow-sm">
				<i class="fa-solid fa-plus text-xs"></i> Add Question
			</a>
			
		</div>

		<div class="bg-white border border-slate-200 rounded-lg p-3 mb-4 shadow-sm">

			<div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
				<div class="relative">
					<i class="fa-solid fa-magnifying-glass
                          absolute left-3 top-1/2 -translate-y-1/2
                          text-slate-400 text-xs"></i>

					<input id="searchInput" type="text"
						placeholder="Search questions..."
						class="w-full border border-slate-300
                           rounded-lg pl-9 pr-3 py-2
                           text-sm focus:outline-none
                           focus:ring-2 focus:ring-indigo-500/30
                           focus:border-indigo-500">
				</div>
				
				<select id="courseFilter" class="w-full border border-slate-300
                       rounded-lg px-3 py-2 text-sm focus:outline-none
                       focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500">
					<option value="">All Courses</option>
				</select>

				<select id="typeFilter" class="w-full border border-slate-300
                       rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2
                       focus:ring-indigo-500/30 focus:border-indigo-500">
					<option value="">All Types</option>
					<option value="MCQ">MCQ</option>
					<option value="TRUE_FALSE">True / False</option>
					<option value="SHORT_ANSWER">Short Answer</option>
				</select>

			</div>
		</div>

		<div class="bg-white  border border-slate-200 rounded-lg shadow-sm overflow-hidden">

			<div class="overflow-x-auto">
				<table class="w-full">
					<thead class="bg-slate-50 border-b border-slate-200">
						<tr>
							<th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">#</th>
							<th class="px-4 py-3 text-left text-xs font-semiboldtext-slate-500">Question</th>
							<th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">Type</th>
							<th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">Mark</th>
							<th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">Status</th>
							<th class="px-4 py-3 text-center text-xs font-semibold text-slate-500">Action</th>
						</tr>
					</thead>

					<tbody id="questionTableBody"></tbody>
				</table>
			</div>
		</div>
	</main>

	<div id="viewQuestionModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm
            hidden items-center justify-center z-50 p-4">
            
		<div class="bg-white rounded-xl shadow-xl w-full max-w-xl max-h-[90vh] overflow-y-auto">

			<div class="flex items-center justify-between px-5 py-4 border-b">
				<div>
					<h2 class="text-base font-bold">Question Details</h2>
					<p class="text-xs text-slate-500">View question and options.</p>
				</div>
				<button type="button" onclick="closeViewQuestion()"
					class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100">
					<i class="fa-solid fa-xmark"></i>
				</button>
			</div>

			<div class="p-5">

				<div class="mb-4">
					<label class="block text-xs font-semibold text-slate-500 mb-1">
						Question </label>
					<div id="viewQuestionText" 
						class="bg-slate-50 border rounded-lg p-3 text-sm">
					</div>
				</div>

				<div class="grid grid-cols-2 gap-3 mb-4">
					<div class="bg-slate-50 rounded-lg p-3">
						<p class="text-[11px] text-slate-500">Question Type</p>
						<p id="viewQuestionType" class="text-sm font-semibold mt-1"></p>
					</div>
					<div class="bg-slate-50 rounded-lg p-3">
						<p class="text-[11px] text-slate-500">Mark</p>
						<p id="viewQuestionMark" class="text-sm font-semibold mt-1"></p>
					</div>
				</div>

				<div id="viewOptionsSection" class="mb-4">
					<h3 class="text-sm font-semibold mb-2">Answer Options</h3>
					<div id="viewOptionsContainer"></div>
				</div>

				<div>
					<label class="block text-xs font-semibold text-slate-500 mb-1">
						Explanation </label>
					<div id="viewExplanation" class="bg-slate-50 border
                           rounded-lg p-3 text-sm text-slate-700">
					</div>
				</div>

			</div>

			<div class="px-5 py-3 border-t flex justify-end">
				<button type="button" onclick="closeViewQuestion()"
					class="px-4 py-2 text-sm bg-slate-700 hover:bg-slate-800 text-white rounded-lg">
					Close</button>
			</div>

		</div>

	</div>

	<div id="editQuestionModal" class="fixed inset-0 bg-black/50 hidden backdrop-blur-sm items-center justify-center z-50 p-4">
		<div class="bg-white rounded-xl shadow-xl w-full max-w-lg max-h-[92vh] overflow-y-auto">

        <div class="flex items-center justify-between px-4 py-3 border-b">

            <div>
                <h2 class="text-base font-bold">
                    Edit Question
                </h2>

                <p class="text-xs text-slate-500">
                    Update question and options.
                </p>
            </div>

            <button type="button"
                    onclick="closeEditQuestion()"
                    class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form id="editQuestionForm" class="p-4">

            <div class="mb-3">
                <label class="block text-xs font-semibold text-slate-600 mb-1">
                    Course
                </label>
                 <select id="editQuestionCourse" required
						class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
						<option value="">---Select Course---</option>
				</select>

			</div>

            <div class="mb-3">
                <label class="block text-xs font-semibold text-slate-600 mb-1">
                    Question
                </label>
                <textarea id="editQuestionText"  rows="2" required
                          class="w-full border border-slate-300 
                          rounded-lg px-3 py-2 text-sm resize-none"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-3">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">
                        Question Type
                    </label>
                    <select id="editQuestionType"
                            onchange="changeEditQuestionType()" required
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                        <option value="">Select Type</option>
                        <option value="MCQ">MCQ</option>
                        <option value="TRUE_FALSE">True / False</option>
                        <option value="SHORT_ANSWER">Short Answer</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">
                        Default Mark
                    </label>
                    <input id="editDefaultMark" type="number"
                           min="0" step="0.5" required
                           class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>

            </div>

            <div class="mb-3">
                <label class="block text-xs font-semibold text-slate-600 mb-1">
                    Explanation
                </label>
                <textarea id="editExplanation" rows="2"
                          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm resize-none"></textarea>
            </div>

            <div id="editOptionsSection" class="hidden mb-3">
                <h3 class="text-sm font-semibold mb-1">
                    Answer Options
                </h3>
                <p class="text-xs text-slate-500 mb-2">
                    Select the correct answer.
                </p>
                <div id="editOptionsContainer"></div>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t">
                <button type="button" onclick="closeEditQuestion()"
                        class="px-4 py-2 text-sm border border-slate-300 rounded-lg hover:bg-slate-50">
                    Cancel
                </button>
                <button type="submit"
                        class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">
                    <i class="fa-solid fa-save mr-1"></i>
                    Update
                </button>
            </div>

        </form>

    </div>
</div>


<script>
function loadQuestions() {
    fetch('/api/questions').then(response => {
            if (!response.ok) {
                throw new Error('Failed to load questions');
            }
            return response.json();
        }).then(data => {
            console.log("Questions:", data);
            renderQuestions(data);
        }).catch(error => {
            console.error(error);
            document.getElementById('questionTableBody').innerHTML = `
                <tr>
                    <td colspan="6" class="text-center text-red-500 py-8 text-sm">
                        Failed to load questions.
                    </td>
                </tr>
            `;
        });
}
function loadCourses() {

    fetch('/api/questions/courses')
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to load courses');
            }
            return response.json();
        })

        .then(courses => {
            console.log("Courses:", courses);

            const courseFilter =  document.getElementById('courseFilter');
            courseFilter.innerHTML = '<option value="">All Courses</option>';
            const editCourse = document.getElementById('editQuestionCourse');
            editCourse.innerHTML ='<option value="">Select Course</option>';

            courses.forEach(course => {

                const filterOption = document.createElement('option');

                filterOption.value = course.course_id;
                filterOption.textContent = course.title;

                courseFilter.appendChild(filterOption);

                const editOption = document.createElement('option');
                editOption.value = course.course_id;
                editOption.textContent = course.title;
                editCourse.appendChild(editOption);

            });

        })

        .catch(error => {
            console.error( 'Failed to load courses:', error );

        });
}

function renderQuestions(questions) {

    const tableBody = document.getElementById('questionTableBody');
    tableBody.innerHTML = '';

    if (!questions || questions.length === 0) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="6"
                    class="text-center text-slate-400 py-8 text-sm">
                    No questions found.
                </td>
            </tr>
        `;
        return;
    }

    const now = new Date();
    const questionList = questions.map(question => {

        const createdAt = question.createdAt ? new Date(question.createdAt) : null;
        const createdDiffHours = createdAt ? (now - createdAt) / (1000 * 60 * 60) : 999;
        const isNew = createdAt && createdDiffHours >= 0 && createdDiffHours <= 24;

        const editedTime = localStorage.getItem( `question_edited_${question.questionId}` );
        const editedAt = editedTime ? new Date(editedTime) : null;
        const editedDiffHours = editedAt ? (now - editedAt) / (1000 * 60 * 60) : 999;

        const isEdited = editedAt &&
            editedDiffHours >= 0 &&
            editedDiffHours <= 24;

        let status = 'normal';

        if (isEdited) {
            status = 'edited';
        } else if (isNew) {
            status = 'new';
        }

        let sortTime = 0;

        if (status === 'edited') {
            sortTime = editedAt.getTime();
        } else if (status === 'new') {
            sortTime = createdAt.getTime();
        }

        return {
            ...question, status: status, sortTime: sortTime
        };
    });

    questionList.sort((a, b) => {

        if (a.status !== 'normal' && b.status === 'normal') {
            return -1;
        }

        if (a.status === 'normal' && b.status !== 'normal') {
            return 1;
        }

        if (a.status !== 'normal' && b.status !== 'normal') {
            return b.sortTime - a.sortTime;
        }

        return b.questionId - a.questionId;
    });

    questionList.forEach((question, index) => {

        const row = document.createElement('tr');

        if (question.status === 'new') {
            row.className = 'border-t border-green-200 ' +
                'bg-green-50/50 hover:bg-green-50 transition';

        } else if (question.status === 'edited') {
            row.className = 'border-t border-amber-200 ' +
                'bg-amber-50/50 hover:bg-amber-50 transition';

        } else {
            row.className = 'border-t border-slate-100 ' + 'hover:bg-slate-50 transition';
        }

        row.dataset.courseId = question.courseId;
        let typeClass = 'bg-slate-100 text-slate-600';

        if (question.questionType === 'MCQ') {
            typeClass = 'bg-blue-50 text-blue-600';

        } else if (question.questionType === 'TRUE_FALSE') {
            typeClass = 'bg-purple-50 text-purple-600';

        } else if (question.questionType === 'SHORT_ANSWER') {
            typeClass = 'bg-orange-50 text-orange-600';
        }


        let statusHtml = '';

        if (question.isActive) {

            statusHtml = `
                <span class="inline-flex items-center gap-1 text-xs text-green-600 font-medium">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>              
                    Active
                </span>
            `;

        } else {

            statusHtml = `
                <span class="inline-flex items-center gap-1 text-xs text-red-600 font-medium">
                    <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>
                    Inactive
                </span>
            `;
        }


        let changeBadge = '';

        if (question.status === 'new') {

            changeBadge = `
                <span class="inline-flex items-center
                             px-2 py-0.5 rounded-full
                             bg-green-100 text-green-600
                             text-[10px] font-semibold
                             whitespace-nowrap">

                    <i class="fa-solid fa-sparkles mr-1"></i>
                    NEW
                </span>
            `;

        } else if (question.status === 'edited') {

            changeBadge = `
                <span class="inline-flex items-center
                             px-2 py-0.5 rounded-full
                             bg-amber-100 text-amber-600
                             text-[10px] font-semibold
                             whitespace-nowrap">
                    <i class="fa-solid fa-pen mr-1"></i>
                    EDITED
                </span>
            `;
        }

        row.innerHTML = `

            <td class="px-4 py-3 text-xs text-slate-400">
                ${index + 1}
            </td>

            <td class="px-4 py-3">
                <div class="text-sm font-medium text-slate-700 max-w-lg flex items-center gap-2">
                    <span>
                        ${question.questionText}
                    </span>
                    ${changeBadge}
                </div>
            </td>

            <td class="px-4 py-3">
                <span class="inline-flex px-2.5 py-1 rounded-full text-[11px] font-semibold ${typeClass}">
                    ${question.questionType}
                </span>
            </td>

            <td class="px-4 py-3 text-sm font-medium">
                ${question.defaultMark}
            </td>

            <td class="px-4 py-3">
                ${statusHtml}
            </td>

            <td class="px-4 py-3">

                <div class="flex items-center justify-center gap-1">

                    <button onclick="viewQuestion(${question.questionId})"
                        title="View"
                        class="w-8 h-8 rounded-lg text-blue-500 hover:bg-blue-50">
                        <i class="fa-solid fa-eye text-xs"></i>
                    </button>

                    <button onclick="editQuestion(${question.questionId})"
                        title="Edit"
                        class="w-8 h-8 rounded-lg text-amber-500 hover:bg-amber-50">
                        <i class="fa-solid fa-pen text-xs"></i>
                    </button>

                    <button onclick="deleteQuestion(${question.questionId})"
                        title="Delete"
                        class="w-8 h-8 rounded-lg text-red-500 hover:bg-red-50">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>

                </div>

            </td>
        `;

        tableBody.appendChild(row);

    });
}


function viewQuestion(questionId) {
    const modal =document.getElementById('viewQuestionModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    
    fetch(`/api/questions/${questionId}`)
        .then(response => response.json())
        .then(question => {
            document.getElementById('viewQuestionText').textContent =question.questionText;
            document.getElementById('viewQuestionType').textContent = question.questionType;
            document.getElementById('viewQuestionMark' ).textContent =question.defaultMark;
            document.getElementById('viewExplanation' ).textContent = question.explanation || 'No explanation';

            return fetch(`/api/questions/${questionId}/options`);
        })
        
        .then(response => response.json())
        .then(options => {
            renderViewOptions(options);
        })
        .catch(error => {
            console.error(error);
            alert('Failed to load question details.');
        });
}

function renderViewOptions(options) {
    const container = document.getElementById('viewOptionsContainer');
    container.innerHTML = '';

    if (!options || options.length === 0) {
        container.innerHTML = `
            <div class="bg-slate-50 rounded-lg p-3 text-xs text-slate-400">
                No answer options.
            </div>
        `;
        return;
    }

    options.forEach(option => {
        const div =document.createElement('div');
        div.className = 'flex items-center gap-2 p-2.5 mb-2 border rounded-lg';

        if (option.isCorrect) {
            div.classList.add('border-green-300','bg-green-50');
        }

        div.innerHTML = `
            <div class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-100 text-xs font-semibold">
                ${option.optionLabel}
            </div>

            <div class="flex-1 text-sm">
                ${option.optionText}
            </div>
            ${
                option.isCorrect
                ?
                `
                <span class="text-green-600 text-xs font-semibold">
                    <i class="fa-solid fa-check"></i>
                    Correct
                </span>
                `
                :
                ''
            }
        `;
        container.appendChild(div);
    });
}

function closeViewQuestion() {
    const modal = document.getElementById('viewQuestionModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}

function editQuestion(questionId) {
    const modal =document.getElementById('editQuestionModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');

    fetch(`/api/questions/${questionId}`)
        .then(response => response.json())
        .then(question => {
        	
            document.getElementById('editQuestionForm').dataset.questionId = questionId;
            document.getElementById('editQuestionCourse').value = question.courseId;
            document.getElementById('editQuestionText').value = question.questionText;
            document.getElementById('editQuestionType').value = question.questionType;
            document.getElementById('editDefaultMark').value =question.defaultMark;
            document.getElementById('editExplanation').value = question.explanation || '';
            return fetch(`/api/questions/${questionId}/options`);
        })

        .then(response => response.json())
        .then(options => {
            renderEditOptions(options);
            
        }).catch(error => {
            console.error(error);
            alert('Failed to load question.');
            closeEditQuestion();
        });
}

function renderEditOptions(options) {
    const type =document.getElementById('editQuestionType').value;
    const section = document.getElementById('editOptionsSection');
    const container =document.getElementById('editOptionsContainer');
    container.innerHTML = '';

    if (type === 'SHORT_ANSWER') {
        section.classList.add('hidden');
        return;
    }

    section.classList.remove('hidden');
    let labels = [];
    if (type === 'MCQ') {
        labels = ['A', 'B', 'C', 'D'];
    }else if (type === 'TRUE_FALSE') {
        labels = ['A', 'B'];
    }
    labels.forEach(label => {

        const existingOption = options.find( option =>option.optionLabel === label );
        const optionText = existingOption ? existingOption.optionText : '';
        const isCorrect = existingOption ? existingOption.isCorrect : false;
        createEditOption(label, optionText,isCorrect);
    });
}

function createEditOption( label, defaultText = '', isCorrect = false) {
    const container = document.getElementById( 'editOptionsContainer');
    const div = document.createElement('div');
    div.className ='flex items-center gap-2 mb-2';
    div.innerHTML = `
        <input type="radio" name="editCorrectOption"
            value="${label}" ${isCorrect ? 'checked' : ''}
            class="w-4 h-4 text-indigo-600" required>
        <div class="w-8 h-8 flex items-center justify-center bg-slate-100 rounded-lg text-xs font-semibold">
            ${label}
        </div>

        <input type="text" id="editOption_${label}"
            value="${defaultText}" placeholder="Option ${label}" required
            class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm">
 `;
    container.appendChild(div);
}

function changeEditQuestionType() {
    const type = document.getElementById('editQuestionType').value;
    const section = document.getElementById('editOptionsSection');
    const container =document.getElementById('editOptionsContainer');
    container.innerHTML = '';

    if (type === 'MCQ') {
        section.classList.remove('hidden');
        createEditOption('A');
        createEditOption('B');
        createEditOption('C');
        createEditOption('D');
        
    }else if (type === 'TRUE_FALSE') {
        section.classList.remove('hidden');
        createEditOption('A', 'True');
        createEditOption('B', 'False');

    }else {
        section.classList.add('hidden');
    }
}

function closeEditQuestion() {
    const modal = document.getElementById('editQuestionModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    document.getElementById('editQuestionForm').reset();
    document.getElementById('editOptionsContainer').innerHTML = '';
    document.getElementById('editOptionsSection').classList.add('hidden');
}

document.getElementById('editQuestionForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const questionId = this.dataset.questionId;
        const questionType = document.getElementById('editQuestionType').value;
        const question = {
            courseId: Number(document.getElementById( 'editQuestionCourse').value),
            questionText: document.getElementById('editQuestionText' ).value,
            questionType: questionType,
            defaultMark: Number(
            document.getElementById('editDefaultMark').value),
            explanation: document.getElementById('editExplanation').value,
            isActive: true
        };

        fetch(`/api/questions/${questionId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(question)
            
        }).then(response => {
            if (!response.ok) {
                throw new Error('Failed to update question');
            }
            return response.json();
            
        }).then(() => {
            if (
                questionType === 'MCQ' || questionType === 'TRUE_FALSE') {
                return updateOptions(questionId,questionType);
            }
            return null;

        })
        .then(() => {

        localStorage.setItem( `question_edited_${questionId}`, new Date().toISOString());
        alert('Question updated successfully!');
        closeEditQuestion();
        loadQuestions();
    })
   
        .catch(error => {
            console.error(error);
            alert('Failed to update question.');
        });
    });

function updateOptions(questionId,questionType) {
    let labels = [];
    if (questionType === 'MCQ') {
        labels = ['A', 'B', 'C', 'D'];
    }else if (questionType === 'TRUE_FALSE') {
        labels = ['A', 'B'];
    }

    const correctOption =document.querySelector('input[name="editCorrectOption"]:checked');
    if (!correctOption) {
        throw new Error('Please select correct answer');
    }

    const correctLabel = correctOption.value;
    return fetch( `/api/questions/${questionId}/options`,
        {
            method: 'DELETE'
        }).then(response => {
        if (!response.ok) {
            throw new Error('Failed to delete old options');
        }
        return response.text();

    }).then(() => {
        const requests = labels.map(label => {
                const optionText =document.getElementById(`editOption_${label}`).value;
                
                const option = {
                    optionLabel: label,
                    optionText: optionText,
                    isCorrect: label === correctLabel
                };

                return fetch(`/api/questions/${questionId}/options`,{
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(option)
                    });
            });
        return Promise.all(requests);
    });
}

function deleteQuestion(questionId) {
    const confirmDelete =confirm( 'Are you sure you want to delete this question?');
    if (!confirmDelete) {
        return;
    }

    fetch(`/api/questions/${questionId}`, {
        method: 'DELETE'
    }).then(response => {
        if (!response.ok) {
            throw new Error( 'Failed to delete question');
        }
        return response.text();
        
    }).then(() => {
        alert('Question deleted successfully!');
        loadQuestions();
        
    }).catch(error => {
        console.error(error);
        alert('Failed to delete question.');
    });
}

function filterQuestions() {
    const searchText =document.getElementById('searchInput').value.toLowerCase().trim();
    const selectedType =document.getElementById('typeFilter').value;
    const rows =document.querySelectorAll('#questionTableBody tr');

    rows.forEach(row => {
        const rowText = row.innerText.toLowerCase();
        const typeMatch =!selectedType || rowText.includes(selectedType.toLowerCase());
        const searchMatch = !searchText || rowText.includes(searchText);
        row.style.display = typeMatch && searchMatch
                ? ''
                : 'none';
    });
}
document.getElementById('courseFilter').addEventListener('change', filterQuestions);
document.getElementById('searchInput').addEventListener('input',filterQuestions);
document.getElementById('typeFilter').addEventListener('change', filterQuestions);

document.addEventListener('DOMContentLoaded', function() {
    loadQuestions();
    loadCourses();
});

</script>
</body>
</html>
