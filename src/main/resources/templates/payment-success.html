<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Receipt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .receipt-card {
            max-width: 450px;
            margin: 50px auto 20px auto;
            padding: 30px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .success-icon {
            font-size: 50px;
            color: #198754;
        }
    </style>
</head>
<body class="bg-light">

<div class="container">
    <!-- Receipt Card Display -->
    <div id="receipt-card" class="receipt-card text-center">
        <div class="mb-3">
            <i class="fa-solid fa-circle-check success-icon"></i>
        </div>
        <h4 class="fw-bold text-success mb-1">Payment Successful!</h4>
        <p class="text-muted small mb-4">Your payment has been successfully completed.</p>

        <!-- Receipt Details Box -->
        <div class="border rounded p-3 bg-light text-start mb-2">
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted small">Amount Paid:</span>
                <span class="fw-bold text-dark" id="lbl-amount" th:text="${amount != null ? amount + ' MMK' : '0 MMK'}"></span>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted small">Payment Purpose:</span>
                <span class="fw-semibold text-dark" id="lbl-purpose" th:text="${paymentType != null ? paymentType : '-'}"></span>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted small">Transaction No:</span>
                <span class="fw-semibold text-dark" id="lbl-txn" th:text="${transactionNo != null ? transactionNo : '-'}"></span>
            </div>
            <div class="d-flex justify-content-between" th:if="${note != null and !#strings.isEmpty(note)}">
                <span class="text-muted small">Note:</span>
                <span class="fw-semibold text-dark" id="lbl-note" th:text="${note}"></span>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div style="max-width: 450px; margin: 0 auto;" class="d-grid gap-2">
        <!-- Direct PNG Download Button -->
        <button type="button" onclick="downloadReceiptImage()" class="btn btn-success py-2 fw-bold">
            <i class="fa-solid fa-download me-2"></i> Download Receipt (PNG)
        </button>

        <a th:href="@{/student}" class="btn btn-primary py-2 fw-bold">Back to Dashboard</a>
    </div>
</div>

<!-- Hidden Canvas for Image Generation -->
<canvas id="receiptCanvas" width="800" height="700" style="display:none;"></canvas>

<!-- JavaScript to generate and trigger direct PNG download -->
<script>
    function downloadReceiptImage() {
        const canvas = document.getElementById('receiptCanvas');
        const ctx = canvas.getContext('2d');

        // Fetch text values from the DOM safely
        const amountVal = document.getElementById('lbl-amount').innerText;
        const purposeVal = document.getElementById('lbl-purpose').innerText;
        const txnVal = document.getElementById('lbl-txn').innerText;
        const noteElem = document.getElementById('lbl-note');
        const noteVal = noteElem ? noteElem.innerText : '';

        // 1. Clear background
        ctx.fillStyle = '#f8f9fa';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Draw Receipt Card Box
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(150, 50, 500, noteVal ? 520 : 480, 16);
        ctx.fill();

        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 3. Draw Success Icon Checkmark
        ctx.fillStyle = '#198754';
        ctx.beginPath();
        ctx.arc(400, 110, 30, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✓', 400, 119);

        // 4. Header Titles
        ctx.fillStyle = '#198754';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText('Payment Successful!', 400, 175);

        ctx.fillStyle = '#6c757d';
        ctx.font = '14px sans-serif';
        ctx.fillText('Your payment has been successfully completed.', 400, 200);

        // 5. Details Inner Box
        ctx.fillStyle = '#f8f9fa';
        ctx.beginPath();
        ctx.roundRect(190, 230, 420, noteVal ? 220 : 170, 8);
        ctx.fill();
        ctx.strokeStyle = '#dee2e6';
        ctx.stroke();

        // 6. Helper function for rows
        function drawRow(label, value, yPos) {
            ctx.fillStyle = '#6c757d';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(label, 215, yPos);

            ctx.fillStyle = '#212529';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(value, 585, yPos);
        }

        drawRow('Amount Paid:', amountVal, 275);
        drawRow('Payment Purpose:', purposeVal, 325);
        drawRow('Transaction No:', txnVal, 375);
        
        if (noteVal) {
            drawRow('Note:', noteVal, 425);
        }

        // 7. Trigger Download
        const dataURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = dataURL;
        link.download = 'Payment-Receipt.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
