<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Exam Questions</title>

    <style>
        * { box-sizing: border-box; }

body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }
.container {
    width: 100%;
    max-width: 680px;
    margin: 25px auto;
    padding: 0 15px;
}
        .header {
            margin-bottom: 20px;
        }
        h1 {
            font-size: 23px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #64748b;
            font-size: 14px;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.05);
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .summary-item {
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            background: #f8fafc;
        }
        .summary-item span {
            font-size: 12px;
            color: #64748b;
        }
        .summary-item strong {
            display: block;
            margin-top: 8px;
            font-size: 22px;
        }
        .search {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            font-size: 13px;
        }
        th {
            background: #f1f5f9;
            color: #475569;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        .existing {
            color: #15803d;
            font-size: 11px;
            font-weight: bold;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 18px;
            font-size: 13px;
        }
        .valid {
            background: #dcfce7;
            color: #166534;
        }
        .invalid {
            background: #fef3c7;
            color: #92400e;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }
        .btn {
            padding: 11px 17px;
            border-radius: 7px;
            border: none;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
        }
        .cancel {
            background: #e2e8f0;
            color: #334155;
        }
        .save {
            background: #4f46e5;
            color: white;
        }
        .save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        @media(max-width: 600px) {
            .summary {
                grid-template-columns: 1fr;
            }
        }

.card {
    padding: 18px 20px;
    border-radius: 10px;
}
.header {
    margin-bottom: 15px;
}
h1 {
    font-size: 20px;
    margin-bottom: 5px;
}
.subtitle {
    font-size: 12px;
}
.summary {
    gap: 8px;
    margin-bottom: 15px;
}
.summary-item {
    padding: 10px 12px;
    border-radius: 7px;
}
.summary-item span {
    font-size: 11px;
}
.summary-item strong {
    font-size: 18px;
    margin-top: 5px;
}
.search {
    padding: 9px 11px;
    font-size: 12px;
    margin-bottom: 12px;
}
th, td {
    padding: 9px 10px;
    font-size: 12px;
}
.question-checkbox {
    width: 15px;
    height: 15px;
    cursor: pointer;
}
.message {
    padding: 10px 12px;
    margin-top: 12px;
    font-size: 12px;
}
.actions {
    margin-top: 16px;
}
.btn {
    padding: 9px 14px;
    font-size: 12px;
}
@media (max-width: 600px) {
    .container {
        max-width: 100%;
        padding: 0 12px;
    }
    .card {
        padding: 14px;
    }
    .summary {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
    }
    .summary-item {
        padding: 8px;
    }
    .summary-item strong {
        font-size: 16px;
    }
}
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Manage Exam Questions</h1>
        <div class="subtitle">
            Exam:
            <strong th:text="${exam.title}"></strong>
        </div>
    </div>

    <div class="card">

        <form id="updateQuestionForm" method="post"
              th:action="@{/teacher/exams/update/confirm}">

            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <input type="hidden" name="examId"
                   th:value="${exam.examId}">

            <input type="hidden" name="title"
                   th:value="${exam.title}">

            <input type="hidden" name="examType"
                   th:value="${exam.examType}">

            <input type="hidden" name="durationMin"
                   th:value="${exam.durationMin}">

            <input type="hidden" name="totalMark"
                   th:value="${exam.totalMark}">

            <input type="hidden" name="passMark"
                   th:value="${exam.passMark}">

            <input type="hidden" name="startAt"
                   th:value="${exam.startAt}">

            <input type="hidden" name="endAt"
                   th:value="${exam.endAt}">

            <input type="hidden" name="maxAttempts"
                   th:value="${exam.maxAttempts}">

            <input type="hidden" name="status"
                   th:value="${exam.status}">

            <input type="hidden" name="shuffleQuestions"
                   th:value="${exam.shuffleQuestions}">

            <div class="summary">

                <div class="summary-item">
                    <span>Exam Total Mark</span>
                    <strong id="targetMark" th:text="${exam.totalMark}">
                        100
                    </strong>
                </div>

                <div class="summary-item">
                    <span>Selected Marks</span>
                    <strong id="selectedMark">0</strong>
                </div>

                <div class="summary-item">
                    <span>Selected Questions</span>
                    <strong id="selectedCount">0</strong>
                </div>

            </div>

            <input type="text" id="questionSearch"
                   class="search" placeholder="Search questions...">

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Select</th>
                            <th>Question</th>
                            <th>Type</th>
                            <th>Mark</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr class="question-row" th:each="q : ${selectedQuestions}">

                            <td>
                                <input type="checkbox" class="question-checkbox"
                                       name="questionIds" th:value="${q.questionId}"
                                       th:attr="data-mark=${q.mark}" checked>
                            </td>

                            <td>
                                <span th:text="${q.questionText}"> Question </span>
                                <span class="existing"> (Existing)</span>
                            </td>

                            <td th:text="${q.questionType}"> MCQ</td>
                            <td th:text="${q.mark}"> 5</td>

                        </tr>

                        <tr class="question-row" th:each="q : ${questions}"
                            th:if="${!selectedQuestionIds.contains(q.questionId)}">

                            <td>
                                <input type="checkbox" class="question-checkbox"
                                       name="questionIds" th:value="${q.questionId}"
                                       th:attr="data-mark=${q.defaultMark}">
                            </td>

                            <td th:text="${q.questionText}">Question</td>
                            <td th:text="${q.questionType}"> MCQ</td>
                            <td th:text="${q.defaultMark}">5</td>
                        </tr>

                    </tbody>

                </table>

            </div>

            <div id="markMessage" class="message invalid">
                Select questions to match the exam total mark.
            </div>

            <div class="actions">
                <a th:href="@{/teacher/exams}" class="btn cancel">
                    Cancel
                </a>
                <button type="submit" id="saveBtn" class="btn save" disabled>
                    Confirm & Save
                </button>
            </div>

        </form>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const checkboxes = document.querySelectorAll(".question-checkbox");
    const target = Number(document.getElementById("targetMark").textContent.trim());
    const selectedMark = document.getElementById("selectedMark");
    const selectedCount = document.getElementById("selectedCount");
    const message = document.getElementById("markMessage");
    const saveBtn = document.getElementById("saveBtn");

    function calculateMarks() {
        let total = 0;
        let count = 0;

        checkboxes.forEach(function (checkbox) {
            if (checkbox.checked) {
                total += Number(checkbox.dataset.mark);
                count++;
            }

        });

        selectedMark.textContent = total.toFixed(2);
        selectedCount.textContent = count;
        const difference = Math.round( (target - total) * 100) / 100;

        if (count > 0 && Math.abs(difference) < 0.001) {
            message.className = "message valid";
            message.textContent ="Total Marks match. You can save now.";
            saveBtn.disabled = false;

        } else {
            message.className = "message invalid";

            if (difference > 0) {
                message.textContent =
                    "You need " + difference.toFixed(2)
                    + " more marks. Add questions.";
            } else {
                message.textContent =
                    "Selected marks exceed the target by "
                    + Math.abs(difference).toFixed(2)
                    + ". Remove questions.";
            }

            saveBtn.disabled = true;
        }
    }

    checkboxes.forEach(function (checkbox) {
        checkbox.addEventListener("change", calculateMarks);
    });

    const search = document.getElementById("questionSearch");

    search.addEventListener("input", function () {
        const keyword = this.value.toLowerCase();

        document.querySelectorAll(".question-row")
            .forEach(function (row) {
                row.style.display =
                    row.textContent.toLowerCase().includes(keyword)
                    ? ""
                    : "none";
            });
    });

    document.getElementById("updateQuestionForm")
        .addEventListener("submit", function (event) {
            calculateMarks();
            if (saveBtn.disabled) {
                event.preventDefault();
            }
        });

    calculateMarks();
});
</script>

</body>
</html>
