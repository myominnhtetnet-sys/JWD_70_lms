<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{head :: head}"></head>
<body class="bg-slate-100 dark:bg-[#0f1118] text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen">

<div id="app" class="min-h-screen flex flex-col">
    
    <!-- TOP HEADER BAR -->
    <div th:replace="~{header :: header}"></div>

    <!-- MAIN APP CONTENT AREA (Sidebar + Dynamic View) -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- DYNAMIC SIDEBAR -->
        <div th:replace="~{nav :: nav}"></div>

        <!-- Audit Logs Main Container -->
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto bg-slate-100 dark:bg-[#0f1118]">
            <div class="max-w-7xl mx-auto bg-white dark:bg-[#181d28] rounded-2xl border border-slate-200/80 dark:border-[#293142] p-6 shadow-sm">
                
                <!-- Section Header -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6 pb-4 border-b border-slate-100 dark:border-[#293142]">
                    <div>
                        <h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2">
                            <i class="fa-solid fa-clock-rotate-left text-indigo-600 dark:text-indigo-400"></i>
                            Audit Logs
                        </h3>
                        <p class="text-xs text-slate-400 dark:text-slate-400 mt-1">Track system actions, modifications, and user activities</p>
                    </div>

                    <!-- Action Filter & Refresh -->
                    <div class="flex items-center gap-2">
                        <select id="audit-action-filter" onchange="filterAuditLogs()" 
                            class="px-3 py-1.5 text-xs bg-slate-50 dark:bg-[#202634] border border-slate-200 dark:border-[#293142] rounded-xl text-slate-600 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                            <option value="ALL">All Actions</option>
                            <option value="CREATE">CREATE</option>
                            <option value="UPDATE">UPDATE</option>
                            <option value="DELETE">DELETE</option>
                        </select>

                        <button onclick="loadAuditLogsTable()" 
                            class="p-2 text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 bg-slate-50 dark:bg-[#202634] border border-slate-200 dark:border-[#293142] rounded-xl transition" title="Refresh List">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Audit Logs Table -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-600 dark:text-slate-300">
                        <thead class="bg-slate-50/70 dark:bg-[#202634]/60 uppercase text-[10px] text-slate-400 font-semibold tracking-wider border-b border-slate-200/50 dark:border-[#293142]">
                            <tr>
                                <th class="p-3 pl-4 rounded-l-xl">User</th>
                                <th class="p-3">Action</th>
                                <th class="p-3">Table Name</th>
                                <th class="p-3">Record ID</th>
                                <th class="p-3">Changes Summary</th>
                                <th class="p-3">IP Address</th>
                                <th class="p-3 pr-4 text-right rounded-r-xl">Date & Time</th>
                            </tr>
                        </thead>
                        <tbody id="audit-log-table-body" class="divide-y divide-slate-100 dark:divide-[#293142]/60">
                            <!-- JS မှ Dynamic Data ရောက်လာပါမည် -->
                        </tbody>
                    </table>
                </div>

            </div>
        </main>

    </div>
</div>

<!-- 🌟 View Details Modal (JSON Changes ကို လှပစွာပြသရန်) -->
<div id="auditDetailModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-[#181d28] border border-slate-200 dark:border-[#293142] rounded-2xl w-full max-w-2xl p-6 shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
        
        <!-- Modal Header -->
        <div class="flex justify-between items-center pb-4 border-b border-slate-100 dark:border-[#293142]">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-file-code"></i>
                </div>
                <div>
                    <h3 class="text-base font-bold text-slate-800 dark:text-white">Audit Log Details</h3>
                    <p class="text-[11px] text-slate-400" id="modal-sub-info">Table & Record Info</p>
                </div>
            </div>
            <button onclick="closeAuditModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-[#202634] transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Modal Body (JSON formatted content) -->
        <div class="py-4 overflow-y-auto space-y-4 flex-1">
            <div class="grid grid-cols-2 gap-4 bg-slate-50 dark:bg-[#202634]/50 p-3.5 rounded-xl border border-slate-200/60 dark:border-[#293142]">
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-400 block mb-0.5">User</span>
                    <span class="text-xs font-semibold text-slate-700 dark:text-slate-200" id="modal-user">-</span>
                </div>
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-400 block mb-0.5">Action & Table</span>
                    <span class="text-xs font-semibold text-slate-700 dark:text-slate-200" id="modal-action-table">-</span>
                </div>
            </div>

            <!-- Old vs New Comparison Area -->
            <div class="space-y-3">
                <div id="old-value-container" class="hidden">
                    <h4 class="text-xs font-bold text-rose-500 mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-minus"></i> Old Values
                    </h4>
                    <div id="modal-old-values" class="bg-slate-900 text-rose-300 font-mono text-xs p-3.5 rounded-xl overflow-x-auto border border-slate-800"></div>
                </div>

                <div id="new-value-container" class="hidden">
                    <h4 class="text-xs font-bold text-emerald-500 mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-plus"></i> New Values
                    </h4>
                    <div id="modal-new-values" class="bg-slate-900 text-emerald-300 font-mono text-xs p-3.5 rounded-xl overflow-x-auto border border-slate-800"></div>
                </div>
            </div>
        </div>

        <!-- Modal Footer -->
        <div class="pt-4 border-t border-slate-100 dark:border-[#293142] flex justify-end">
            <button onclick="closeAuditModal()" class="px-4 py-2 text-xs font-semibold bg-slate-100 dark:bg-[#202634] text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-200 dark:hover:bg-[#293142]/85 transition">
                Close
            </button>
        </div>

    </div>
</div>

<script>
// Data များကို Fetch ပြီး Table ထဲပြသပေးသည့် Main Function
async function loadAuditLogsTable() {
    const tbody = document.getElementById('audit-log-table-body');
    const actionFilter = document.getElementById('audit-action-filter')?.value || 'ALL';

    if (!tbody) return;

    let url = '/api/audit-logs';
    if (actionFilter !== 'ALL') {
        url = `/api/audit-logs/action/${actionFilter}`;
    }

    try {
        tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-slate-400">Loading audit logs...</td></tr>';

        const response = await fetch(url);
        if (!response.ok) throw new Error('Network response was not ok');

        const data = await response.json();

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-slate-400">No audit logs found for this filter.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(item => {
            // Safe JSON strings for passing into open modal function
            const safeOld = item.oldValues ? encodeURIComponent(item.oldValues) : '';
            const safeNew = item.newValues ? encodeURIComponent(item.newValues) : '';
            const userName = escapeHtml(item.userName || 'System');
            const tableName = escapeHtml(item.tableName);
            const actionType = escapeHtml(item.actionType);

            return `
                <tr class="hover:bg-slate-50/60 dark:hover:bg-slate-800/40 transition-colors duration-150 border-b border-slate-100 dark:border-[#293142]/40">
                    <td class="p-3.5 pl-4 font-normal text-slate-600 dark:text-slate-300">
                        ${userName}
                    </td>
                    <td class="p-3.5">
                        <span class="px-2.5 py-1 rounded-md text-[10px] font-semibold tracking-wide ${getActionBadgeClass(item.actionType)}">
                            ${actionType}
                        </span>
                    </td>
                    <td class="p-3.5 font-mono text-slate-500 dark:text-slate-400">${tableName}</td>
                    <td class="p-3.5 font-mono text-slate-500 dark:text-slate-400">${escapeHtml(item.recordId || '-')}</td>
                    <td class="p-3.5">
                        <button onclick="openAuditModal('${userName}', '${actionType}', '${tableName}', '${item.recordId || '-'}', '${safeOld}', '${safeNew}')"
                            class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-500/20 transition flex items-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-eye text-[10px]"></i> View Details
                        </button>
                    </td>
                    <td class="p-3.5 font-mono text-xs text-slate-400">${escapeHtml(item.ipAddress || '-')}</td>
                    <td class="p-3.5 pr-4 text-right text-slate-400">${formatDateTime(item.createdAt)}</td>
                </tr>
            `;
        }).join('');

    } catch (error) {
        console.error('Error fetching audit logs:', error);
        tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-rose-500">Failed to load audit logs.</td></tr>';
    }
}

// 🌟 View Details Modal ဖွင့်ရန်နှင့် JSON Formatting ပြုလုပ်ရန်
function openAuditModal(userName, actionType, tableName, recordId, safeOld, safeNew) {
    const modal = document.getElementById('auditDetailModal');
    const modalUser = document.getElementById('modal-user');
    const modalActionTable = document.getElementById('modal-action-table');
    const modalSubInfo = document.getElementById('modal-sub-info');
    
    const oldContainer = document.getElementById('old-value-container');
    const newContainer = document.getElementById('new-value-container');
    const modalOldValues = document.getElementById('modal-old-values');
    const modalNewValues = document.getElementById('modal-new-values');

    modalUser.textContent = userName;
    modalActionTable.textContent = `${actionType} on ${tableName}`;
    modalSubInfo.textContent = `Record ID: ${recordId}`;

    // Decode values
    const oldValStr = safeOld ? decodeURIComponent(safeOld) : '';
    const newValStr = safeNew ? decodeURIComponent(safeNew) : '';

    // Format Old Values JSON
    if (oldValStr && oldValStr !== '{}' && oldValStr.trim() !== '') {
        oldContainer.classList.remove('hidden');
        modalOldValues.innerHTML = formatJsonToHtml(oldValStr);
    } else {
        oldContainer.classList.add('hidden');
    }

    // Format New Values JSON
    if (newValStr && newValStr !== '{}' && newValStr.trim() !== '') {
        newContainer.classList.remove('hidden');
        modalNewValues.innerHTML = formatJsonToHtml(newValStr);
    } else {
        newContainer.classList.add('hidden');
    }

    modal.classList.remove('hidden');
}

function closeAuditModal() {
    document.getElementById('auditDetailModal').classList.add('hidden');
}

// 🌟 JSON String ကို Prettify လုပ်ပေးပြီး Key-Value အလှပြင်ပေးသည့် Helper
function formatJsonToHtml(jsonStr) {
    try {
        const jsonObj = JSON.parse(jsonStr);
        let html = '<ul class="space-y-1">';
        for (const [key, value] of Object.entries(jsonObj)) {
            html += `<li><span class="text-slate-400 font-semibold">"${escapeHtml(key)}":</span> <span class="text-amber-300">${escapeHtml(JSON.stringify(value))}</span></li>`;
        }
        html += '</ul>';
        return html;
    } catch (e) {
        // JSON မဟုတ်ဘဲ Plain text ဖြစ်နေပါက
        return `<pre class="whitespace-pre-wrap">${escapeHtml(jsonStr)}</pre>`;
    }
}

function filterAuditLogs() {
    loadAuditLogsTable();
}

function getActionBadgeClass(action) {
    switch (action) {
        case 'CREATE': return 'bg-emerald-500/15 text-emerald-600 dark:bg-emerald-500/20 dark:text-emerald-400';
        case 'UPDATE': return 'bg-amber-500/15 text-amber-600 dark:bg-amber-500/20 dark:text-amber-400';
        case 'DELETE': return 'bg-rose-500/15 text-rose-500 dark:bg-rose-500/20 dark:text-rose-400';
        default: return 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300';
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function formatDateTime(dateStr) {
    if (!dateStr) return '-';
    return new Date(dateStr).toLocaleString('en-US', { 
        month: 'short', 
        day: 'numeric', 
        hour: '2-digit', 
        minute: '2-digit',
        hour12: true 
    });
}

document.addEventListener("DOMContentLoaded", () => {
    loadAuditLogsTable();
});
</script>

</body>
</html>
