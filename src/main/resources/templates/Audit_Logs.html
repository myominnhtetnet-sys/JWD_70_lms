<!DOCTYPE html>
<html>
<div th:replace="~{head :: head}"></div>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">

<div th:replace="~{header :: header}"></div>

<div class="flex-1 flex overflow-hidden">

<div th:replace="~{nav :: nav}"></div>

<!-- Audit Logs Main Container -->
<div class="flex-1 p-6 overflow-y-auto">
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 p-6 shadow-sm">
        
        <!-- Section Header -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6 pb-4 border-b border-slate-100 dark:border-slate-700">
            <div>
                <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-indigo-600 dark:text-indigo-400"></i>
                    Audit Logs
                </h3>
                <p class="text-xs text-slate-400 dark:text-slate-400 mt-1">Track system actions, modifications, and user activities</p>
            </div>

            <!-- Action Filter & Refresh -->
            <div class="flex items-center gap-2">
                <select id="audit-action-filter" onchange="filterAuditLogs()" 
                    class="px-3 py-1.5 text-xs bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-slate-600 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                    <option value="ALL">All Actions</option>
                    <option value="CREATE">CREATE</option>
                    <option value="UPDATE">UPDATE</option>
                    <option value="DELETE">DELETE</option>
                </select>

                <button onclick="loadAuditLogsTable()" 
                    class="p-2 text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg transition" title="Refresh List">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <!-- Audit Logs Table -->
        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-600 dark:text-slate-300">
                <thead class="bg-slate-50/70 dark:bg-slate-700/40 uppercase text-[10px] text-slate-400 font-semibold tracking-wider">
                    <tr>
                        <th class="p-3 pl-4 rounded-l-lg">User</th>
                        <th class="p-3">Action</th>
                        <th class="p-3">Table Name</th>
                        <th class="p-3">Record ID</th>
                        <th class="p-3">Changes (Old / New)</th>
                        <th class="p-3">IP Address</th>
                        <th class="p-3 pr-4 text-right rounded-r-lg">Date & Time</th>
                    </tr>
                </thead>
                <tbody id="audit-log-table-body" class="divide-y divide-slate-100 dark:divide-slate-700/50">
                    <!-- JS မှ Dynamic Data ရောက်လာပါမည် -->
                </tbody>
            </table>
        </div>

    </div>
</div>

</div>

<script>

// Data များကို Fetch ပြီး Table ထဲပြသပေးသည့် Main Function
async function loadAuditLogsTable() {
    const tbody = document.getElementById('audit-log-table-body');
    const actionFilter = document.getElementById('audit-action-filter')?.value || 'ALL';

    if (!tbody) return;

    let url = '/api/audit-logs';
    if (actionFilter !== 'ALL') {
        url = `/api/audit-logs/action/${actionFilter}`;
    }

    try {
        tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-slate-400">Loading audit logs...</td></tr>';

        const response = await fetch(url);
        if (!response.ok) throw new Error('Network response was not ok');

        const data = await response.json();

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-slate-400">No audit logs found for this filter.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(item => `
            <tr class="hover:bg-slate-50/60 dark:hover:bg-slate-700/30 transition-colors duration-150 border-b border-slate-100 dark:border-slate-700/40">
                <td class="p-3.5 pl-4 font-normal text-slate-400 dark:text-slate-300">
                    ${escapeHtml(item.userName || 'System')}
                </td>
                <td class="p-3.5">
                    <span class="px-2.5 py-1 rounded-md text-[10px] font-semibold tracking-wide ${getActionBadgeClass(item.actionType)}">
                        ${escapeHtml(item.actionType)}
                    </span>
                </td>
                <td class="p-3.5 font-mono text-slate-500 dark:text-slate-400">${escapeHtml(item.tableName)}</td>
                <td class="p-3.5 font-mono text-slate-500 dark:text-slate-400">${escapeHtml(item.recordId || '-')}</td>
                <td class="p-3.5 max-w-xs truncate font-mono text-slate-500 dark:text-slate-400" title="${escapeHtml(item.newValues || item.oldValues)}">
                    ${escapeHtml(item.newValues || item.oldValues || '-')}
                </td>
                <td class="p-3.5 font-mono text-xs text-slate-400">${escapeHtml(item.ipAddress || '-')}</td>
                <td class="p-3.5 pr-4 text-right text-slate-400">${formatDateTime(item.createdAt)}</td>
            </tr>
        `).join('');

    } catch (error) {
        console.error('Error fetching audit logs:', error);
        tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-rose-500">Failed to load audit logs.</td></tr>';
    }
}

function filterAuditLogs() {
    loadAuditLogsTable();
}

// ပုံထဲကအတိုင်း Soft Color Badges များကို သတ်မှတ်ပေးခြင်း
function getActionBadgeClass(action) {
    switch (action) {
        case 'CREATE': return 'bg-emerald-500/15 text-emerald-600 dark:bg-emerald-500/20 dark:text-emerald-400';
        case 'UPDATE': return 'bg-amber-500/15 text-amber-600 dark:bg-amber-500/20 dark:text-amber-400';
        case 'DELETE': return 'bg-rose-500/15 text-rose-500 dark:bg-rose-500/20 dark:text-rose-400';
        default: return 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300';
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function formatDateTime(dateStr) {
    if (!dateStr) return '-';
    return new Date(dateStr).toLocaleString('en-US', { 
        month: 'short', 
        day: 'numeric', 
        hour: '2-digit', 
        minute: '2-digit',
        hour12: true 
    });
}

document.addEventListener("DOMContentLoaded", () => {
    loadAuditLogsTable();
});

</script>

</body>
</html>
