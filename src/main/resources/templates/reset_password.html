<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LMS - Reset Password</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4e9ff;
            min-height: 100vh;
        }

        /* =========================
           Navbar
           ========================= */

        .navbar {
            height: 65px;
            background: white;
            border-bottom: 2px solid #8e44ad;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            color: #4b176b;
            font-size: 25px;
            font-weight: bold;
        }

        .home-link {
            text-decoration: none;
            color: #4b176b;
            font-size: 16px;
        }

        .home-link i {
            margin-right: 6px;
        }

        /* =========================
           Container
           ========================= */

        .container {
            width: 100%;
            max-width: 450px;

            margin: 70px auto;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        /* =========================
           Title
           ========================= */

        .title {
            text-align: center;

            color: #4b176b;

            margin-bottom: 10px;

            font-size: 28px;
        }

        .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 25px;

            font-size: 14px;
        }

        /* =========================
           Email
           ========================= */

        .email-box {
            background: #f4e9ff;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            text-align: center;

            color: #4b176b;

            font-weight: bold;
        }

        /* =========================
           Error
           ========================= */

        .error {
            background: #ffe6e6;

            color: #c0392b;

            border: 1px solid #e74c3c;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 14px;
        }

        /* =========================
           Form
           ========================= */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-weight: bold;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            width: 100%;

            padding: 12px 45px 12px 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        .password-box input:focus {
            border-color: #8e44ad;
        }

        .eye {
            position: absolute;

            right: 14px;

            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            color: #777;
        }

        /* =========================
           Button
           ========================= */

        .reset-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #8e44ad;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .reset-btn:hover {
            background: #6c3483;
        }

        /* =========================
           Back Login
           ========================= */

        .back-login {
            text-align: center;

            margin-top: 20px;
        }

        .back-login a {
            text-decoration: none;

            color: #8e44ad;

            font-weight: bold;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <!-- =========================
         Navbar
         ========================= -->

    <div class="navbar">

        <div class="logo">
            LMS
        </div>

        <a href="/" class="home-link">

            <i class="fa-solid fa-house"></i>

            Home

        </a>

    </div>


    <!-- =========================
         Reset Password Form
         ========================= -->

    <div class="container">

        <h1 class="title">
            Reset Password
        </h1>

        <p class="subtitle">
            Enter your new password below.
        </p>


        <!-- Email -->

        <div class="email-box"
             th:if="${email != null}">

            <i class="fa-solid fa-envelope"></i>

            <span th:text="${email}">
                user@example.com
            </span>

        </div>


        <!-- Error -->

        <div class="error"
             th:if="${error != null}"
             th:text="${error}">

        </div>


        <!-- Form -->

        <form th:action="@{/reset-password}"
              th:object="${forgotPassword}"
              method="post">


            <!-- New Password -->

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <div class="password-box">

                    <input type="password"
                           id="newPassword"
                           th:field="*{newPassword}"
                           placeholder="Enter new password"
                           autocomplete="new-password">

                    <i class="fa-solid fa-eye eye"
                       onclick="togglePassword('newPassword', this)">
                    </i>

                </div>

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input type="password"
                           id="confirmPassword"
                           th:field="*{confirmPassword}"
                           placeholder="Confirm new password"
                           autocomplete="new-password">

                    <i class="fa-solid fa-eye eye"
                       onclick="togglePassword('confirmPassword', this)">
                    </i>

                </div>

            </div>


            <!-- Reset Button -->

            <button type="submit"
                    class="reset-btn">

                <i class="fa-solid fa-key"></i>

                Reset Password

            </button>

        </form>


        <!-- Back Login -->

        <div class="back-login">

            <a th:href="@{/login}">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Login

            </a>

        </div>

    </div>


    <!-- =========================
         JavaScript
         ========================= -->

    <script>

        function togglePassword(id, icon) {

            const input = document.getElementById(id);

            if (input.type === "password") {

                input.type = "text";

                icon.classList.remove("fa-eye");

                icon.classList.add("fa-eye-slash");

            } else {

                input.type = "password";

                icon.classList.remove("fa-eye-slash");

                icon.classList.add("fa-eye");
            }
        }

    </script>

</body>

</html>
