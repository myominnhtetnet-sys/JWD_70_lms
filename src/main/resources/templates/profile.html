<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - LMS</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f5fa;
            color: #333;
        }

        a {
            text-decoration: none;
        }

        /* TOPBAR */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            height: 70px;

            background: #fff;

            border-bottom: 1px solid #e5dbea;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            z-index: 1000;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #4b176b;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .top-link {
            color: #555;

            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 14px;
        }

        .top-link:hover {
            color: #8e44ad;
        }

        .logout-btn {
            background: #8e44ad;
            color: white;

            padding: 10px 16px;

            border-radius: 8px;

            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;

            top: 70px;
            left: 0;
            bottom: 0;

            width: 250px;

            background: #fff;

            border-right: 1px solid #e5dbea;

            padding: 25px 15px;
        }

        .sidebar-title {
            padding: 0 15px 15px;

            color: #888;

            font-size: 13px;

            font-weight: bold;

            text-transform: uppercase;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 13px 15px;

            margin-bottom: 6px;

            border-radius: 8px;

            color: #555;

            font-size: 14px;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: #f4e9ff;
            color: #8e44ad;
        }

        .sidebar-link i {
            width: 20px;
            text-align: center;
        }

        /* CONTENT */
        .content {
            margin-left: 250px;

            padding: 105px 35px 40px;

            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #777;
            font-size: 14px;
        }

        /* PROFILE CARD */
        .profile-card {
            background: white;

            max-width: 700px;

            border: 1px solid #eee5f3;

            border-radius: 12px;

            padding: 30px;

            box-shadow:
                    0 3px 12px rgba(0,0,0,0.05);
        }

        .profile-avatar {
            width: 85px;
            height: 85px;

            background: #f4e9ff;

            color: #8e44ad;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;

            margin-bottom: 25px;
        }

        .profile-row {
            display: grid;

            grid-template-columns: 160px 1fr;

            padding: 16px 0;

            border-bottom: 1px solid #eee;
        }

        .profile-label {
            font-weight: bold;
            color: #777;
        }

        .profile-value {
            color: #333;
        }

        .change-password {
            display: inline-block;

            margin-top: 25px;

            padding: 11px 18px;

            background: #8e44ad;

            color: white;

            border-radius: 8px;
        }

        .change-password:hover {
            background: #71368a;
        }

        @media (max-width: 768px) {

            .sidebar {
                width: 210px;
            }

            .content {
                margin-left: 210px;
                padding-left: 20px;
                padding-right: 20px;
            }

            .top-link {
                display: none;
            }
        }

    </style>

</head>

<body>

<header class="topbar">

    <div class="logo">
        LMS
    </div>

    <div class="topbar-right">

        <a th:href="@{/admin/notifications}"
           class="top-link">

            <i class="fa-regular fa-bell"></i>
            Notifications

        </a>

        <a th:href="@{/admin/profile}"
           class="top-link">

            <i class="fa-regular fa-user"></i>
            My Profile

        </a>

        <a th:href="@{/admin/logout}"
           class="logout-btn">

            <i class="fa-solid fa-right-from-bracket"></i>
            Logout

        </a>

    </div>

</header>


<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-title">
            Admin Portal
        </div>


        <a th:href="@{/admin}"
           class="sidebar-link">

            <i class="fa-solid fa-gauge-high"></i>
            <span>Dashboard</span>

        </a>


        <a th:href="@{/admin/users}"
           class="sidebar-link">

            <i class="fa-solid fa-users"></i>
            <span>User &amp; Role</span>

        </a>


        <a th:href="@{/admin/notifications}"
           class="sidebar-link">

            <i class="fa-regular fa-bell"></i>
            <span>Notifications</span>

        </a>


        <a th:href="@{/admin/profile}"
           class="sidebar-link active">

            <i class="fa-regular fa-user"></i>
            <span>My Profile</span>

        </a>


        <a th:href="@{/admin/logout}"
           class="sidebar-link">

            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>

        </a>

    </aside>


    <main class="content">

        <div class="page-header">

            <h1>My Profile</h1>

            <p>
                View your account information.
            </p>

        </div>


        <div class="profile-card">

            <div class="profile-avatar">

                <i class="fa-regular fa-user"></i>

            </div>


            <div class="profile-row">

                <div class="profile-label">
                    Full Name
                </div>

                <div class="profile-value"
                     th:text="${fullName}">
                    Admin
                </div>

            </div>


            <div class="profile-row">

                <div class="profile-label">
                    Email
                </div>

                <div class="profile-value"
                     th:text="${email}">
                    admin@example.com
                </div>

            </div>


            <div class="profile-row">

                <div class="profile-label">
                    Role ID
                </div>

                <div class="profile-value"
                     th:text="${roleId}">
                    1
                </div>

            </div>


            <a th:href="@{/admin/change-password}"
               class="change-password">

                <i class="fa-solid fa-key"></i>

                Change Password

            </a>

        </div>

    </main>

</div>

</body>

</html>
