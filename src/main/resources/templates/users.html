<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{head :: head}"></head>

<body class="bg-[#0f1118] text-[#f1f3f9] font-sans antialiased min-h-screen">
<div class="app min-h-screen flex flex-col">

    <!-- TOP HEADER BAR -->
    <div th:replace="~{header :: header}"></div>

    <!-- MAIN APP CONTENT AREA (Sidebar + Dynamic View) -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- DYNAMIC SIDEBAR -->
        <div th:replace="~{nav :: nav}"></div>

        <!-- MAIN SECTION -->
        <main class="main flex-1 overflow-y-auto p-6 lg:p-8 bg-[#0f1118]">

            <!-- PAGE CONTENT -->
            <div class="max-w-7xl mx-auto">
                <!-- Success / Error Alerts -->
                <div th:if="${success}" class="p-4 mb-6 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-xl text-sm font-medium flex items-center gap-3 shadow-lg" th:text="${success}">Success message</div>
                <div th:if="${error}" class="p-4 mb-6 bg-rose-500/10 text-rose-400 border border-rose-500/30 rounded-xl text-sm font-medium flex items-center gap-3 shadow-lg" th:text="${error}">Error message</div>

                <!-- Page Header & Action Bar -->
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight text-white mb-1">User Management</h1>
                        <p class="text-sm text-slate-400">Manage system users, roles and account statuses seamlessly.</p>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <!-- Search Form -->
                        <form method="get" th:action="@{/admin/users/search}" class="flex items-center gap-2">
                            <input type="text" name="keyword" th:value="${keyword}" class="bg-[#181d28] border border-[#293142] text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500 w-60 sm:w-72 transition" placeholder="Search by name or email...">
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition flex items-center justify-center shadow-md">
                                <i class="fa-solid fa-search"></i>
                            </button>
                        </form>
                        
                        <button type="button" onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow-lg shadow-indigo-600/20 whitespace-nowrap">
                            <i class="fa-solid fa-plus"></i> Add User
                        </button>
                    </div>
                </div>

                <!-- Users Table Panel -->
                <section class="bg-[#181d28] border border-[#293142] rounded-2xl shadow-xl overflow-hidden">
                    <div class="p-6 border-b border-[#293142] flex items-center justify-between">
                        <div>
                            <h2 class="text-base font-bold text-white">All System Users</h2>
                            <p class="text-xs text-slate-400 mt-0.5">List of all registered accounts and their current statuses.</p>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-[#293142] text-slate-400 text-xs uppercase tracking-wider bg-[#202634]/50">
                                    <th class="py-4 px-6 font-semibold">ID</th>
                                    <th class="py-4 px-6 font-semibold">Name</th>
                                    <th class="py-4 px-6 font-semibold">Email</th>
                                    <th class="py-4 px-6 font-semibold">Role</th>
                                    <th class="py-4 px-6 font-semibold">Status</th>
                                    <th class="py-4 px-6 font-semibold text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-[#293142] text-sm text-slate-300">
                                <tr th:each="u : ${users}" class="hover:bg-slate-800/40 transition">
                                    <td class="py-4 px-6 font-medium text-white" th:text="${u.user_id}">1</td>
                                    <td class="py-4 px-6 font-semibold text-white" th:text="${u.full_name}">Name</td>
                                    <td class="py-4 px-6 text-slate-400" th:text="${u.email}">Email</td>
                                    <td class="py-4 px-6">
                                        <span class="px-2.5 py-1 bg-slate-800 border border-slate-700 text-indigo-400 text-xs font-semibold rounded-md" th:text="${u.role_name}">Role</span>
                                    </td>
                                    <td class="py-4 px-6">
                                        <span th:text="${u.status}" 
                                              th:classappend="${u.status == 'ACTIVE' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20'}"
                                              class="px-3 py-1 text-xs font-bold rounded-full border inline-block">
                                            ACTIVE
                                        </span>
                                    </td>
                                    <td class="py-4 px-6 text-right">
                                        <div class="inline-flex items-center justify-end gap-2">
                                            <button type="button" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition shadow" th:onclick="'openEditModal(' + ${u.user_id} + ')'">Edit</button>
                                            
                                            <form th:action="@{/admin/users/suspend}" method="post" class="inline" th:if="${u.status == 'ACTIVE'}">
                                                <input type="hidden" name="userId" th:value="${u.user_id}">
                                                <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow">Suspend</button>
                                            </form>
                                            
                                            <form th:action="@{/admin/users/activate}" method="post" class="inline" th:if="${u.status != 'ACTIVE'}">
                                                <input type="hidden" name="userId" th:value="${u.user_id}">
                                                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow">Activate</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>

        </main>
    </div>
</div>

<!-- ADD/EDIT USER MODAL -->
<div id="userModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-[#181d28] border border-[#293142] rounded-2xl p-6 w-full max-w-md shadow-2xl animate-in fade-in zoom-in duration-200">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-[#293142]">
            <h3 id="modalTitle" class="text-lg font-bold text-white">Add New User</h3>
            <button type="button" onclick="closeUserModal()" class="text-slate-400 hover:text-white text-lg transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form id="userForm" th:action="@{/admin/users/add}" method="post" class="space-y-4">
            <input type="hidden" id="user_id" name="user_id">
            
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Full Name *</label>
                <input type="text" id="full_name" name="full_name" class="w-full bg-[#202634] border border-[#293142] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition" required placeholder="Enter full name">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Address *</label>
                <input type="email" id="email" name="email" class="w-full bg-[#202634] border border-[#293142] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition" required placeholder="Enter email address">
            </div>

            <div id="passwordGroup">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password * <span class="text-[10px] text-slate-500 normal-case">(At least 8 characters)</span></label>
                <input type="password" id="password_hash" name="password_hash" class="w-full bg-[#202634] border border-[#293142] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="Enter password">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Role *</label>
                <select id="role_id" name="role_id" class="w-full bg-[#202634] border border-[#293142] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition" required>
                    <option value="">-- Select Role --</option>
                    <option value="1">Admin</option>
                    <option value="2">Teacher</option>
                    <option value="3">Student</option>
                </select>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-[#293142] mt-6">
                <button type="button" onclick="closeUserModal()" class="px-5 py-2.5 bg-[#202634] hover:bg-slate-800 text-slate-300 rounded-xl text-sm font-semibold transition border border-[#293142]">Cancel</button>
                <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition shadow-lg shadow-indigo-600/20">Save User</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openAddModal() {
        document.getElementById('modalTitle').innerText = 'Add New User';
        document.getElementById('userForm').action = '/admin/users/add';
        document.getElementById('user_id').value = '';
        document.getElementById('full_name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('password_hash').value = '';
        document.getElementById('password_hash').required = true;
        document.getElementById('passwordGroup').style.display = 'block';
        document.getElementById('role_id').value = '';
        
        const modal = document.getElementById('userModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function openEditModal(id) {
        fetch('/admin/users/edit-json/' + id)
            .then(response => response.json())
            .then(data => {
                document.getElementById('modalTitle').innerText = 'Edit User';
                document.getElementById('userForm').action = '/admin/users/update';
                
                document.getElementById('user_id').value = data.user_id || '';
                document.getElementById('full_name').value = data.full_name || '';
                document.getElementById('email').value = data.email || '';
                
                document.getElementById('password_hash').required = false;
                document.getElementById('passwordGroup').style.display = 'none';
                
                document.getElementById('role_id').value = data.role_id || '';
                
                const modal = document.getElementById('userModal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            })
            .catch(err => console.error("Error fetching user data:", err));
    }

    function closeUserModal() {
        const modal = document.getElementById('userModal');
        modal.classList.remove('flex');
        modal.classList.add('hidden');
    }
</script>
</body>
</html>
