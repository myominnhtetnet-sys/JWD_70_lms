<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | LMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f1118; --sidebar: #181d28; --card: #181d28; --border: #293142;
            --primary: #6c4ce5; --primary-light: #8068f0; --text: #f1f3f9; --muted: #929bb0;
            --green: #36c995; --yellow: #f4bd50; --red: #ff7373; --input: #202634;
        }
        body.light-mode {
            --bg: #f4f6fb; --sidebar: #ffffff; --card: #ffffff; --border: #e2e6ef;
            --text: #242938; --muted: #727c91; --input: #f5f6fa;
        }
        body { font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        a { color: inherit; text-decoration: none; }
        button, input, select { font: inherit; cursor: pointer; }
        .app { min-height: 100vh; }
        
        /* Layout CSS */
        .sidebar { width: 260px; position: fixed; inset: 0 auto 0 0; background: var(--sidebar); border-right: 1px solid var(--border); padding: 25px 18px; overflow-y: auto; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 13px; padding: 5px 10px 32px; }
        .brand-icon { width: 45px; height: 45px; background: #7895ff; color: white; border-radius: 13px; display: grid; place-items: center; font-size: 21px; }
        .brand-name { font-size: 20px; font-weight: 700; }
        .brand-subtitle { color: var(--muted); font-size: 13px; margin-top: 5px; }
        .menu-heading { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 17px 12px 12px; }
        .nav-link { display: flex; align-items: center; gap: 14px; padding: 13px 14px; margin-bottom: 5px; border-radius: 10px; color: var(--muted); font-size: 14px; }
        .nav-link i { width: 20px; text-align: center; }
        .nav-link:hover, .nav-link.active { background: rgba(108, 76, 229, .19); color: #9b8aff; font-weight: 700; }
        .sidebar-bottom { margin-top: 30px; border-top: 1px solid var(--border); padding-top: 15px; }
        .logout-link:hover { color: var(--red); }

        .main { margin-left: 260px; min-height: 100vh; }
        .topbar { min-height: 88px; padding: 18px 30px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 50; }
        .page-heading h1 { font-size: 23px; margin-bottom: 7px; }
        .page-heading p { color: var(--muted); font-size: 13px; }
        .topbar-right { display: flex; align-items: center; gap: 13px; }
        .icon-btn { width: 44px; height: 44px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--muted); display: grid; place-items: center; }
        .profile { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: white; font-weight: 700; }
        .profile-name { font-weight: 700; font-size: 14px; }
        .profile-role { font-size: 12px; color: var(--muted); margin-top: 5px; }

        .content { padding: 28px 30px 40px; }
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 23px; margin-bottom: 20px; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        
        .primary-btn { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 13px; }
        .primary-btn:hover { opacity: 0.9; }

        .search-form { display: flex; gap: 10px; align-items: center; }
        .search-input { padding: 9px 14px; background: var(--input); border: 1px solid var(--border); color: var(--text); border-radius: 9px; font-size: 13px; width: 240px; }

        /* Table Design */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; white-space: nowrap; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13px; text-align: left; }
        th { color: var(--muted); font-weight: 600; }
        
        .inline-form { display: inline-flex; gap: 8px; align-items: center; }
        .inline-form select { padding: 6px 10px; background: var(--input); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 12px; }
        .mini-btn { padding: 6px 12px; border: none; border-radius: 7px; background: var(--primary); color: white; cursor: pointer; font-size: 12px; font-weight: 600; }
        .edit-btn { background: #3b82f6; }

        /* Modal Overlay */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
        .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 25px; width: 100%; max-width: 450px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 11px; background: var(--input); border: 1px solid var(--border); color: var(--text); border-radius: 9px; font-size: 13px; }
   /* နောက်ခံကို Dark ဖြစ်စေပြီး Blur လုပ်ပေးမည့် Class */
.modal-overlay {
    display: none; /* ပုံမှန်ဆို ပိတ်ထားမည် */
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6); /* နောက်ခံ အမည်းစိမ့်စိမ့် */
    backdrop-filter: blur(8px); /* 🌟 ဒီနေရာက နောက်ခံကို Blur လုပ်ပေးတာပါ */
    z-index: 9999;
    justify-content: center;
    align-items: center;
}

/* ပေါ်လာမည့် Modal Box ပုံစံ */
.modal-box {
    background: white; /* Dashboard dark theme အရောင်နှင့် ကိုက်ညီစေရန် */
    color: #fff;
    padding: 25px;
    border-radius: 10px;
    width: 400px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
}
    </style>
</head>

<body>
<div class="app">

    <!-- SIDEBAR FRAGMENT -->
    <div th:replace="~{fragments/admin-layout :: sidebar(activePage='users')}"></div>

    <!-- MAIN -->
    <main class="main">

        <!-- TOPBAR FRAGMENT -->
        <div th:replace="~{fragments/admin-layout :: topbar('User Management', 'Manage system users, roles and account statuses.')}"></div>

        <!-- PAGE CONTENT -->
        <div class="content">
            <div th:if="${success}" style="padding: 12px 16px; background: rgba(54,201,149,0.15); color: var(--green); border: 1px solid rgba(54,201,149,0.3); border-radius: 9px; margin-bottom: 20px; font-size: 13px;" th:text="${success}">Success message</div>
            <div th:if="${error}" style="padding: 12px 16px; background: rgba(255,115,115,0.15); color: var(--red); border: 1px solid rgba(255,115,115,0.3); border-radius: 9px; margin-bottom: 20px; font-size: 13px;" th:text="${error}">Error message</div>

            <section class="panel">
                <div class="panel-header">
                    <div>
                        <h2 style="font-size: 16px; font-weight: 700;">All Users</h2>
                        <p style="color: var(--muted); font-size: 13px; margin-top: 2px;">View and manage system accounts.</p>
                    </div>
                    
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <!-- Search Form -->
                       <!--  <form method="get" th:action="@{/admin/users}" class="search-form">
                            <input type="text" name="keyword" th:value="${keyword}" class="search-input" placeholder="Search by name or email...">
                            <button type="submit" class="mini-btn" style="padding: 9px 14px;"><i class="fa-solid fa-search"></i></button>
                        </form> -->

<form method="get"
      th:action="@{/admin/users}"
      class="search-form"
      id="searchForm">

    <input type="search"
           id="keyword"
           name="keyword"
           th:value="${keyword}"
           class="search-input"
           placeholder="Search by name or email..."
           autocomplete="off">

    <button type="submit"
            class="mini-btn"
            style="padding:9px 14px;">
        <i class="fa-solid fa-search"></i>
    </button>
</form>
               
                        
                        <button type="button" class="primary-btn" onclick="openAddModal()"><i class="fa-solid fa-plus" style="margin-right: 5px;"></i> Add User</button>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>NO</th>
                            <th>NAME</th>
                            <th>EMAIL</th>
                            <th>ROLE</th>
                            <th>STATUS</th>
                            <th>ACTIONS</th>
                        </tr>
                    </thead>
            
                    <tbody>
    <!-- th:each ထဲမှာ u, iterStat ဆိုပြီး status variable ထည့်ပေးပါ -->
    <tr th:each="u, iterStat : ${users}">
        <!-- နံပါတ်စဉ်အတွက် iterStat.count ကို သုံးပါ (၁ စဉ်မည်) -->
        <td th:text="${iterStat.count}">1</td>
        
        <td th:text="${u.full_name}">Name</td>
        <td th:text="${u.email}">Email</td>
        <td th:text="${u.role_name}">Role</td>
        <td th:text="${u.status}" th:style="${u.status == 'ACTIVE' ? 'color: var(--green); font-weight: 600;' : 'color: var(--red); font-weight: 600;'}">ACTIVE</td>
        <td>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button type="button" class="mini-btn edit-btn" th:onclick="'openEditModal(' + ${u.user_id} + ')'">Edit</button>
              
            </div>
        </td>
    </tr>
</tbody>
                </table>
            </section>
        </div>

    </main>
</div>

<!-- ADD / EDIT USER MODAL -->
<div id="userModal" class="modal-overlay">
    <div class="modal-box">

        <div style="display:flex; justify-content:space-between;
                    align-items:center; margin-bottom:20px;">
            <div>
                <h3 id="modalTitle">Add New User</h3>
                <p style="color:var(--muted); font-size:12px;
                          margin-top:5px;">
                    Manage user information and account status.
                </p>
            </div>

            <button type="button" onclick="closeUserModal()"
                    style="background:none; border:none;
                           color:var(--muted); font-size:20px;">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form id="userForm"
              th:action="@{/admin/users/create}"
              method="post">

            <input type="hidden" id="user_id" name="user_id">

            <div class="form-group">
                <label for="full_name">Full Name *</label>
                <input type="text" id="full_name" name="full_name"
                       class="form-control"
                       required maxlength="100"
                       placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email"
                       class="form-control"
                       required maxlength="255"
                       placeholder="Enter email">
            </div>

            <div class="form-group" id="passwordGroup">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password"
                       class="form-control"
                       minlength="8"
                       placeholder="Enter password">
            </div>

            <div class="form-group">
                <label for="role_id">Role *</label>
                <select id="role_id" name="role_id"
                        class="form-control" required>
                    <option value="">-- Select Role --</option>
                    <option value="1">Admin</option>
                    <option value="2">Teacher</option>
                    <option value="3">Student</option>
                </select>
            </div>

            <div class="form-group" id="statusGroup"
                 style="display:none;">
                <label for="status">Account Status *</label>
                <select id="status" name="status"
                        class="form-control">
                    <option value="ACTIVE">Active</option>
                    <option value="SUSPENDED">Suspended</option>
                </select>
            </div>

            <div style="display:flex; justify-content:flex-end;
                        gap:10px; margin-top:20px;">
                <button type="button" onclick="closeUserModal()"
                        style="padding:10px 16px;
                               background:var(--input);
                               border:1px solid var(--border);
                               color:var(--text); border-radius:9px;">
                    Cancel
                </button>

                <button type="submit" id="submitUserBtn"
                        class="primary-btn">
                    Save User
                </button>
            </div>
        </form>
    </div>
</div>

</div>

<script>
    const themeToggle = document.getElementById("themeToggle");
    function applyTheme(isLight) {
        document.body.classList.toggle("light-mode", isLight);
        if(themeToggle) {
            themeToggle.innerHTML = isLight ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-regular fa-moon"></i>';
        }
        localStorage.setItem("lmsTheme", isLight ? "light" : "dark");
    }
    applyTheme(localStorage.getItem("lmsTheme") === "light");
    if(themeToggle) {
        themeToggle.addEventListener("click", () => applyTheme(!document.body.classList.contains("light-mode")));
    }

 

    function openAddModal() {
        const form = document.getElementById("userForm");

        document.getElementById("modalTitle").innerText = "Add New User";
        form.action = "/admin/users/create";

        document.getElementById("user_id").value = "";
        document.getElementById("full_name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("password").value = "";
        document.getElementById("password").required = true;

        document.getElementById("passwordGroup").style.display = "block";
        document.getElementById("statusGroup").style.display = "none";

        document.getElementById("role_id").value = "";
        document.getElementById("status").value = "ACTIVE";
        document.getElementById("submitUserBtn").innerText = "Save User";

        document.getElementById("userModal").style.display = "flex";
    }

    async function openEditModal(id) {
        try {
            const response = await fetch(
                "/admin/users/edit/" + encodeURIComponent(id)
            );

            if (!response.ok) {
                throw new Error(
                    response.status === 404
                        ? "User not found."
                        : "Unable to load user information."
                );
            }

            const data = await response.json();
            const form = document.getElementById("userForm");

            document.getElementById("modalTitle").innerText = "Edit User";
            form.action = "/admin/users/update";

            document.getElementById("user_id").value =
                data.user_id ?? data.userId ?? id;

            document.getElementById("full_name").value =
                data.full_name ?? data.fullName ?? "";

            document.getElementById("email").value =
                data.email ?? "";

            document.getElementById("role_id").value =
                String(data.role_id ?? data.roleId ?? "");

            document.getElementById("status").value =
                String(data.status ?? "ACTIVE").toUpperCase();

            // Edit မှာ password ကို မပြင်ပါ။
            document.getElementById("password").value = "";
            document.getElementById("password").required = false;
            document.getElementById("passwordGroup").style.display = "none";

            document.getElementById("statusGroup").style.display = "block";
            document.getElementById("submitUserBtn").innerText = "Update User";

            document.getElementById("userModal").style.display = "flex";

        } catch (error) {
            alert(error.message);
            console.error("Edit User Error:", error);
        }
    }

    function closeUserModal() {
        document.getElementById("userModal").style.display = "none";
    }

    document.getElementById("userModal").addEventListener("click", function (e) {
        if (e.target === this) {
            closeUserModal();
        }
    });

    const searchInput = document.getElementById("keyword");
    const searchForm = document.getElementById("searchForm");

    if (searchInput && searchForm) {
        searchInput.addEventListener("search", function () {
            if (this.value.trim() === "") {
                window.location.href = "/admin/users";
            }
        });
    }


</script>


</body>
