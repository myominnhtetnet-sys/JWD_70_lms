<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management | LearnHub LMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
   <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --bg: #0f1118; 
        --sidebar: #181d28; 
        --card: #181d28; 
        --border: #293142;
        --primary: #6c4ce5; 
        --text: #f1f3f9; 
        --muted: #929bb0; 
        --input: #202634;
        --green: #36c995; 
        --red: #ff7373;
    }
    body { font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    /* Layout Structure - Fixed Sidebar & Margin Left */
    .sidebar { 
        width: 260px; 
        position: fixed; 
        top: 0; 
        left: 0; 
        bottom: 0; 
        height: 100vh; 
        background: var(--sidebar); 
        border-right: 1px solid var(--border); 
        padding: 25px 18px; 
        z-index: 1000; 
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }
    .main { 
        margin-left: 260px; 
        min-height: 100vh; 
        display: flex; 
        flex-direction: column; 
    }

    /* Sidebar Brand & Navigation Styling */
    .sidebar .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        margin-bottom: 25px;
        padding: 0 5px;
    }
    .sidebar .brand-icon {
        width: 40px;
        height: 40px;
        background: var(--primary);
        color: white;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
    }
    .sidebar .brand-name { font-size: 16px; font-weight: 700; color: var(--text); }
    .sidebar .brand-subtitle { font-size: 11px; color: var(--muted); }

    .sidebar .menu-heading {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.5px;
        margin: 20px 0 10px 5px;
        font-weight: 600;
    }
    .sidebar .nav-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        color: var(--muted);
        text-decoration: none;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s ease;
        margin-bottom: 4px;
    }
    .sidebar .nav-link:hover, 
    .sidebar .nav-link.active {
        background: rgba(108, 76, 229, 0.15);
        color: var(--text);
    }
    .sidebar .nav-link.active {
        color: #a894ff;
        font-weight: 600;
    }
    .sidebar .nav-link i {
        width: 18px;
        text-align: center;
        font-size: 15px;
    }
    .sidebar .sidebar-bottom {
        margin-top: auto;
        border-top: 1px solid var(--border);
        padding-top: 15px;
    }
    .sidebar .logout-link:hover {
        background: rgba(255, 115, 115, 0.15);
        color: #ff7373;
    }
    
    /* Topbar Styling */
    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 30px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
    }
    .topbar-left h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .topbar-left p { font-size: 13px; color: var(--muted); }
    .topbar-profile { display: flex; align-items: center; gap: 12px; }
    .user-avatar { width: 40px; height: 40px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }

    /* Content Area */
    .content { padding: 28px 30px; flex: 1; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 23px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    .primary-btn { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 13px; }
    .primary-btn:hover { opacity: 0.9; }

    /* Table Design */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; white-space: nowrap; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13px; text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    
    .inline-form { display: inline-flex; gap: 8px; align-items: center; }
    .inline-form select { padding: 6px 10px; background: var(--input); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 12px; }
    .mini-btn { padding: 6px 12px; border: none; border-radius: 7px; background: var(--primary); color: white; cursor: pointer; font-size: 12px; font-weight: 600; }

    /* Modal Overlay */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 25px; width: 100%; max-width: 450px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 11px; background: var(--input); border: 1px solid var(--border); color: var(--text); border-radius: 9px; font-size: 13px; }
</style>
</head>
<body>

    <!-- Sidebar Fragment -->
<div th:replace="~{fragments/admin-layout :: sidebar(activePage='users')}"></div>

    <main class="main">
        <!-- Topbar Custom Layout -->
        <header class="topbar">
            <div class="topbar-left">
                <h1>User Management</h1>
                <p>Manage system users, roles and statuses.</p>
            </div>
            <div class="topbar-profile">
                <div class="user-avatar">AD</div>
                <div>
                    <div style="font-weight: 600; font-size: 14px;" th:text="${fullName}">Aung Aung</div>
                    <div style="font-size: 11px; color: var(--muted);">Administrator</div>
                </div>
            </div>
        </header>

        <div class="content">
            <!-- Success Alert -->
            <div th:if="${success}" style="padding: 12px 16px; background: rgba(54,201,149,0.15); color: var(--green); border: 1px solid rgba(54,201,149,0.3); border-radius: 9px; margin-bottom: 20px; font-size: 13px;" th:text="${success}">Success message</div>

            <section class="panel">
                <div class="panel-header">
                    <div>
                        <h2 style="font-size: 16px; font-weight: 700;">All Users</h2>
                        <p style="color: var(--muted); font-size: 13px; margin-top: 2px;">View and manage system accounts.</p>
                    </div>
                    <button type="button" class="primary-btn" onclick="openUserModal()"><i class="fa-solid fa-plus" style="margin-right: 5px;"></i> Add User</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NAME</th>
                            <th>EMAIL</th>
                            <th>ROLE</th>
                            <th>STATUS</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.user_id}">1</td>
                            <td th:text="${u.full_name}">Name</td>
                            <td th:text="${u.email}">Email</td>
                            <td th:text="${u.role_name}">Role</td>
                            <td th:text="${u.status}" th:style="${u.status == 'ACTIVE' ? 'color: var(--green); font-weight: 600;' : 'color: var(--red); font-weight: 600;'}">ACTIVE</td>
                            <td>
                                <form th:action="@{/admin/users/status}" method="post" class="inline-form">
                                    <input type="hidden" name="userId" th:value="${u.user_id}">
                                    <select name="status">
                                        <option value="ACTIVE" th:selected="${u.status == 'ACTIVE'}">ACTIVE</option>
                                        <option value="SUSPENDED" th:selected="${u.status == 'SUSPENDED'}">SUSPENDED</option>
                                    </select>
                                    <button type="submit" class="mini-btn">Save</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </main>

    <!-- ADD USER MODAL -->
    <div id="userModal" class="modal-overlay">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="font-size: 16px; font-weight: 700;">Add New User</h3>
                <button type="button" onclick="closeUserModal()" style="background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form th:action="@{/admin/users/create}" method="post" th:object="${user}">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" class="form-control" required placeholder="Enter full name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="Enter password">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Role</label>
                    <select name="role_id" class="form-control" required>
                        <option value="1">Admin</option>
                        <option value="2">Teacher</option>
                        <option value="3">Student</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" onclick="closeUserModal()" style="padding: 10px 16px; background: var(--input); border: 1px solid var(--border); color: var(--text); border-radius: 9px; cursor: pointer; font-size: 13px;">Cancel</button>
                    <button type="submit" class="primary-btn">Save User</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openUserModal() {
            document.getElementById('userModal').style.display = 'flex';
        }
        function closeUserModal() {
            document.getElementById('userModal').style.display = 'none';
        }
    </script>
</body>
</html>
