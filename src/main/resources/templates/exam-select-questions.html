<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Questions</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

	<div class="exam-select-container">

		<!-- ================= HEADER ================= -->

		<div class="exam-select-header">

			<div>

				<h1>Select Questions</h1>

				<div class="exam-select-subtitle">

					Exam: <strong th:text="${exam.title}"> Java Basic Exam </strong>

				</div>

			</div>


			<a th:href="@{/teacher/exams/view/{id}(id=${exam.examId})}"
				class="exam-btn exam-btn-secondary"> Back </a>

		</div>


		<!-- ================= QUESTION CARD ================= -->

		<div class="exam-select-card">


			<!-- ================= EMPTY ================= -->

			<div th:if="${#lists.isEmpty(questions)}" class="exam-select-empty">

				No questions found in Question Bank.</div>


			<!-- ================= FORM ================= -->

			<form id="questionForm" th:if="${!#lists.isEmpty(questions)}"
				th:action="@{/teacher/exams/{examId}/questions/save(examId=${exam.examId})}"
				method="post">


				<!-- ================= FILTER ================= -->

				<div class="question-filter">


					<!-- Search -->

					<div class="filter-group">

						<label for="questionSearch"> Search Question </label> <input
							type="text" id="questionSearch" placeholder="Search question...">

					</div>


					<!-- Type -->

					<div class="filter-group">

						<label for="questionTypeFilter"> Question Type </label> <select
							id="questionTypeFilter">

							<option value="">All Types</option>

							<option value="MCQ">MCQ</option>

							<option value="TRUE_FALSE">TRUE_FALSE</option>

							<option value="SHORT_ANSWER">SHORT_ANSWER</option>

						</select>

					</div>

				</div>


				<!-- ================= TABLE ================= -->

				<div class="question-table-wrapper">

					<table class="exam-question-table">


						<thead>

							<tr>

								<th>Select</th>

								<th>Question</th>

								<th>Type</th>

								<th>Default Mark</th>

								<th>Exam Mark</th>

							</tr>

						</thead>


						<tbody id="questionTableBody">


							<tr th:each="question : ${questions}" class="question-row"
								th:attr="
                            data-question-text=${question.questionText},
                            data-question-type=${question.questionType}">


								<!-- ================= SELECT ================= -->

								<td>
									<!-- Already Added --> <span
									th:if="${selectedQuestionIds.contains(question.questionId)}"
									class="added"> ✓ Added </span> <!-- New Question --> <input
									th:unless="${selectedQuestionIds.contains(question.questionId)}"
									type="checkbox" class="question-checkbox"
									th:value="${question.questionId}">

								</td>


								<!-- ================= QUESTION ================= -->

								<td><span class="question-text"
									th:text="${question.questionText}"> What is Java? </span></td>


								<!-- ================= TYPE ================= -->

								<td th:text="${question.questionType}">MCQ</td>


								<!-- ================= DEFAULT MARK ================= -->

								<td th:text="${question.defaultMark}">5</td>


								<!-- ================= EXAM MARK ================= -->

								<td><input type="number" class="mark-input" step="0.01"
									min="0.01" th:value="${question.defaultMark}"
									th:disabled="${selectedQuestionIds.contains(question.questionId)}">

								</td>


							</tr>


						</tbody>

					</table>

				</div>


				<!-- ================= HIDDEN INPUTS ================= -->

				<div id="hiddenInputs"></div>


				<!-- ================= ACTIONS ================= -->

				<div class="actions">


					<a th:href="@{/teacher/exams/view/{id}(id=${exam.examId})}"
						class="exam-btn exam-btn-secondary"> Cancel </a>


					<button type="submit" class="exam-btn exam-btn-primary">

						Save Selected Questions</button>


				</div>


			</form>

		</div>

	</div>


	<!-- =====================================================
     JAVASCRIPT
===================================================== -->

	<script>

document.addEventListener("DOMContentLoaded", function () {


    /* ==================================================
       FORM
    ================================================== */

    const questionForm =
        document.getElementById("questionForm");


    if (questionForm) {


        questionForm.addEventListener(
            "submit",
            function (event) {


                /* ===============================
                   SELECTED CHECKBOXES
                =============================== */

                const selectedQuestions =
                    document.querySelectorAll(
                        ".question-checkbox:checked"
                    );


                const hiddenInputs =
                    document.getElementById(
                        "hiddenInputs"
                    );


                hiddenInputs.innerHTML = "";


                /* ===============================
                   NO QUESTION SELECTED
                =============================== */

                if (selectedQuestions.length === 0) {

                    event.preventDefault();

                    alert(
                        "Please select at least one new question."
                    );

                    return;
                }


                /* ===============================
                   PROCESS QUESTIONS
                =============================== */

                let hasError = false;


                selectedQuestions.forEach(
                    function (checkbox) {


                        const questionId =
                            checkbox.value;


                        /* Get row */

                        const row =
                            checkbox.closest(
                                ".question-row"
                            );


                        /* Get mark */

                        const markInput =
                            row.querySelector(
                                ".mark-input"
                            );


                        let mark =
                            markInput.value.trim();


                        /* ===============================
                           CHECK MARK
                        =============================== */

                        if (
                            mark === "" ||
                            Number(mark) <= 0
                        ) {

                            hasError = true;

                            markInput.focus();

                            alert(
                                "Exam mark must be greater than 0."
                            );

                            return;
                        }


                        /* ===============================
                           QUESTION ID
                        =============================== */

                        const questionIdInput =
                            document.createElement(
                                "input"
                            );

                        questionIdInput.type =
                            "hidden";

                        questionIdInput.name =
                            "questionIds";

                        questionIdInput.value =
                            questionId;


                        /* ===============================
                           MARK
                        =============================== */

                        const markHiddenInput =
                            document.createElement(
                                "input"
                            );

                        markHiddenInput.type =
                            "hidden";

                        markHiddenInput.name =
                            "marks";

                        markHiddenInput.value =
                            mark;


                        /* ===============================
                           ADD
                        =============================== */

                        hiddenInputs.appendChild(
                            questionIdInput
                        );

                        hiddenInputs.appendChild(
                            markHiddenInput
                        );

                    }
                );


                /* ===============================
                   STOP SUBMIT IF ERROR
                =============================== */

                if (hasError) {

                    event.preventDefault();

                    hiddenInputs.innerHTML = "";

                }

            }
        );

    }


    /* ==================================================
       SEARCH
    ================================================== */

    const questionSearch =
        document.getElementById(
            "questionSearch"
        );


    /* ==================================================
       TYPE FILTER
    ================================================== */

    const questionTypeFilter =
        document.getElementById(
            "questionTypeFilter"
        );


    /* ==================================================
       QUESTION ROWS
    ================================================== */

    const questionRows =
        document.querySelectorAll(
            ".question-row"
        );


    /* ==================================================
       FILTER FUNCTION
    ================================================== */

    function filterQuestions() {


        const searchText =
            questionSearch
                ? questionSearch.value
                    .toLowerCase()
                    .trim()
                : "";


        const selectedType =
            questionTypeFilter
                ? questionTypeFilter.value
                    .toLowerCase()
                : "";


        questionRows.forEach(
            function (row) {


                const questionText =
                    (
                        row.dataset.questionText || ""
                    )
                    .toLowerCase();


                const questionType =
                    (
                        row.dataset.questionType || ""
                    )
                    .toLowerCase();


                /* ===============================
                   SEARCH MATCH
                =============================== */

                const matchText =
                    questionText.includes(
                        searchText
                    );


                /* ===============================
                   TYPE MATCH
                =============================== */

                const matchType =
                    selectedType === "" ||
                    questionType === selectedType;


                /* ===============================
                   SHOW / HIDE
                =============================== */

                if (
                    matchText &&
                    matchType
                ) {

                    row.style.display = "";

                } else {

                    row.style.display = "none";

                }

            }
        );

    }


    /* ==================================================
       SEARCH EVENT
    ================================================== */

    if (questionSearch) {

        questionSearch.addEventListener(
            "input",
            filterQuestions
        );

    }


    /* ==================================================
       TYPE FILTER EVENT
    ================================================== */

    if (questionTypeFilter) {

        questionTypeFilter.addEventListener(
            "change",
            filterQuestions
        );

    }


});

</script>


</body>

</html>
