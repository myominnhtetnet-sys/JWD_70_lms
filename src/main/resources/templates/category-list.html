<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{head :: head}">
    <meta charset="UTF-8">
    <title>Category List</title>
</head>
<body class="bg-slate-50 dark:bg-slate-900 p-6 min-h-screen">

<div th:fragment="category-list" class="space-y-6">

    <!-- Header & Action Button -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Category Management</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">Manage course categories, subcategories, and visibility.</p>
        </div>
        <div class="flex items-center gap-3">
            <a th:href="@{/admin/categories/new}" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-plus"></i>
                Add New Category
            </a>
        </div>
    </div>

    <!-- Category Table -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100 dark:border-slate-700/80 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <h3 class="font-bold text-base text-slate-900 dark:text-white">All Categories</h3>
            <div class="flex items-center gap-3">
                <input type="text" id="categorySearch" placeholder="Search categories..." class="text-xs px-3 py-2 bg-slate-100 dark:bg-slate-700 border border-transparent rounded-lg focus:outline-none focus:bg-white dark:focus:bg-slate-800 border-slate-200 dark:border-slate-600 text-slate-900 dark:text-white">
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-600 dark:text-slate-300">
                <thead class="text-xs uppercase bg-slate-50 dark:bg-slate-700/50 text-slate-500 dark:text-slate-400 font-semibold border-b border-slate-100 dark:border-slate-700">
                    <tr>
                        <th class="px-6 py-3.5">ID</th>
                        <th class="px-6 py-3.5">Name</th>
                        <th class="px-6 py-3.5">Slug</th>
                        <th class="px-6 py-3.5">Description</th>
                        <th class="px-6 py-3.5">Status</th>
                        <th class="px-6 py-3.5 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-700/60 font-medium">
                    <tr th:each="category : ${categories}" class="hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors">
                        <!-- Category ID -->
                        <td class="px-6 py-4 font-semibold text-slate-900 dark:text-white" th:text="${category.category_id != null ? category.category_id : category.id}">1</td>
                        
                        <!-- Category Name + NEW/EDITED Badges -->
                        <td class="px-6 py-4 font-semibold text-slate-900 dark:text-white flex items-center gap-2">
                            <span th:text="${category.name}">Web Development</span>

                            <!-- NEW Badge (Animated Pulse) -->
                            <span th:if="${actionType == 'new' and activeId == category.category_id}" 
                                  class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700 animate-pulse">
                                NEW
                            </span>

                            <!-- EDITED Badge -->
                            <span th:if="${actionType == 'edited' and activeId == category.category_id}" 
                                  class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-300 border border-amber-300 dark:border-amber-700">
                                EDITED
                            </span>
                        </td>

                        <!-- Slug -->
                        <td class="px-6 py-4 text-xs text-slate-500 dark:text-slate-400" th:text="${category.slug}">web-development</td>
                        
                        <!-- Description -->
                        <td class="px-6 py-4 text-xs text-slate-500 dark:text-slate-400" th:text="${category.description}">Courses related to frontend and backend web technologies.</td>
                        
                        <!-- Active Status -->
                        <td class="px-6 py-4">
                            <span th:if="${category.is_active == 1 || category.is_active == '1' || category.is_active == 'true'}" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-50 dark:bg-emerald-900/50 text-emerald-600 dark:text-emerald-300">Active</span>
                            <span th:unless="${category.is_active == 1 || category.is_active == '1' || category.is_active == 'true'}" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-rose-50 dark:bg-rose-900/50 text-rose-600 dark:text-rose-300">Inactive</span>
                        </td>

                        <!-- Actions -->
                        <td class="px-6 py-4 text-right flex items-center justify-end gap-2">
                            <a th:href="@{/admin/categories/edit/{id}(id=${category.category_id})}" class="text-slate-400 hover:text-indigo-600 transition p-1">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </a>
                            <a th:href="@{/admin/categories/delete/{id}(id=${category.category_id})}" onclick="return confirm('Are you sure you want to delete this category?')" class="text-slate-400 hover:text-rose-600 transition p-1">
                                <i class="fa-solid fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
