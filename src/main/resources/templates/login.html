<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LMS - Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>


<body class="bg-slate-50 dark:bg-slate-900 min-h-screen py-10 flex items-center justify-center p-4">


<!-- ========================================================= -->
<!-- LOGIN CARD -->
<!-- ========================================================= -->

<div class="max-w-xl w-full bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm overflow-hidden">


    <!-- ===================================================== -->
    <!-- HEADER -->
    <!-- ===================================================== -->

    <div class="bg-indigo-600 px-6 py-6 text-white text-center">

        <!-- Icon -->

        <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center mx-auto mb-3 text-white">

            <i class="fa-solid fa-right-to-bracket text-xl"></i>

        </div>


        <!-- Title -->

        <h1 class="text-2xl font-bold tracking-tight text-white">

            Welcome Back

        </h1>


        <!-- Description -->

        <p class="text-xs text-indigo-100 mt-1">

            Login to continue your learning journey

        </p>

    </div>



    <!-- ===================================================== -->
    <!-- ERROR MESSAGE -->
    <!-- ===================================================== -->

    <div th:if="${error != null}"
         class="m-6 mb-0 p-4 bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-800 rounded-xl flex items-center gap-3 text-red-700 dark:text-red-300">

        <i class="fa-solid fa-circle-exclamation text-lg"></i>

        <p class="text-xs font-semibold"
           th:text="${error}">

            Invalid email or password.

        </p>

    </div>



    <!-- ===================================================== -->
    <!-- LOGOUT MESSAGE -->
    <!-- ===================================================== -->

    <div th:if="${param.logout}"
         class="m-6 mb-0 p-4 bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 rounded-xl flex items-center gap-3 text-emerald-700 dark:text-emerald-300">

        <i class="fa-solid fa-circle-check text-lg"></i>

        <p class="text-xs font-semibold">

            You have been logged out successfully.

        </p>

    </div>



    <!-- ===================================================== -->
    <!-- SUCCESS MESSAGE FROM FORGOT PASSWORD -->
    <!-- ===================================================== -->

    <div th:if="${success != null}"
         class="m-6 mb-0 p-4 bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 rounded-xl flex items-center gap-3 text-emerald-700 dark:text-emerald-300">

        <i class="fa-solid fa-circle-check text-lg"></i>

        <p class="text-xs font-semibold"
           th:text="${success}">

            Password reset successfully.

        </p>

    </div>



    <!-- ===================================================== -->
    <!-- FORM -->
    <!-- ===================================================== -->

    <div class="p-6 sm:p-8">

        <form th:action="@{/login}"
              method="post"
              class="space-y-5">


            <!-- ================================================= -->
            <!-- EMAIL -->
            <!-- ================================================= -->

            <div>

                <label for="email"
                       class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">

                    Email Address

                </label>


                <div class="relative">

                    <!-- Email Icon -->

                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">

                        <i class="fa-regular fa-envelope text-sm"></i>

                    </span>


                    <!-- Email Input -->

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="name@gmail.com"
                        required

                        class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 dark:text-white transition">

                </div>

            </div>



            <!-- ================================================= -->
            <!-- PASSWORD -->
            <!-- ================================================= -->

            <div>

                <div class="flex items-center justify-between mb-2">

                    <label for="password"
                           class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">

                        Password

                    </label>


                    <!-- Forgot Password -->

                    <a th:href="@{/forgot-password}"
                       class="text-xs font-semibold text-indigo-600 hover:text-indigo-700 dark:text-indigo-400 dark:hover:text-indigo-300">

                        Forgot Password?

                    </a>

                </div>


                <div class="relative">

                    <!-- Lock Icon -->

                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">

                        <i class="fa-solid fa-lock text-sm"></i>

                    </span>


                    <!-- Password Input -->

                    <input
                        type="password"
                        id="password"
                        name="password_hash"
                        placeholder="Enter password"
                        required

                        class="w-full pl-10 pr-10 py-2.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 dark:text-white transition">


                    <!-- Eye Button -->

                    <button
                        type="button"
                        onclick="togglePasswordVisibility()"

                        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 focus:outline-none">

                        <i id="eyeIcon"
                           class="fa-regular fa-eye text-sm"></i>

                    </button>

                </div>

            </div>



            <!-- ================================================= -->
            <!-- REMEMBER ME -->
            <!-- ================================================= -->

            <div class="flex items-center">

                <label class="flex items-center gap-2 cursor-pointer">

                    <input
                        type="checkbox"
                        class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-600">

                    <span class="text-xs text-slate-600 dark:text-slate-300">

                        Remember me

                    </span>

                </label>

            </div>



            <!-- ================================================= -->
            <!-- LOGIN BUTTON -->
            <!-- ================================================= -->

            <button
                type="submit"

                class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs transition shadow-sm flex items-center justify-center gap-2">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>



            <!-- ================================================= -->
            <!-- REGISTER LINK -->
            <!-- ================================================= -->

            <div class="text-center pt-2">

                <p class="text-xs text-slate-500 dark:text-slate-400">

                    Don't have an account?

                    <a th:href="@{/register}"
                       class="font-semibold text-indigo-600 hover:text-indigo-700 dark:text-indigo-400">

                        Create an account

                    </a>

                </p>

            </div>



            <!-- ================================================= -->
            <!-- BACK HOME -->
            <!-- ================================================= -->

            <div class="pt-1">

                <a th:href="@{/}"

                   class="w-full py-3 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold rounded-xl text-xs transition shadow-sm flex items-center justify-center gap-2 text-center">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Home

                </a>

            </div>


        </form>

    </div>

</div>



<!-- ========================================================= -->
<!-- PASSWORD TOGGLE -->
<!-- ========================================================= -->

<script>

    function togglePasswordVisibility() {

        const passwordInput =
            document.getElementById("password");

        const eyeIcon =
            document.getElementById("eyeIcon");


        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            eyeIcon.classList.remove("fa-eye");

            eyeIcon.classList.add("fa-eye-slash");

        } else {

            passwordInput.type = "password";

            eyeIcon.classList.remove("fa-eye-slash");

            eyeIcon.classList.add("fa-eye");

        }

    }

</script>


</body>

</html>
