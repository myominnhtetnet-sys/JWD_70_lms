<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${exam.examId == null ? 'Create Exam' : 'Edit Exam'}">
        Create Exam
    </title>

   
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="exam-form-page">

    <!-- ================= HEADER ================= -->

    <div class="exam-form-header">

        <div>
            <h1>
                <span th:if="${exam.examId == null}">
                    Create Exam
                </span>

                <span th:if="${exam.examId != null}">
                    Edit Exam
                </span>
            </h1>

            <p>
                Create and configure an examination.
            </p>
        </div>

    </div>


    <!-- ================= ERROR ================= -->

    <div th:if="${error}"
         class="exam-error"
         th:text="${error}">
    </div>


    <!-- ================= FORM CARD ================= -->

    <div class="exam-form-card">

        <form method="post"
              th:object="${exam}"
              th:action="${exam.examId == null
                    ? '/teacher/exams/save'
                    : '/teacher/exams/update'}">


            <!-- ================= HIDDEN ID ================= -->

            <input type="hidden"
                   th:if="${exam.examId != null}"
                   th:field="*{examId}">


            <!-- ================= FORM GRID ================= -->

            <div class="exam-form-grid">


                <!-- COURSE -->

                <div class="exam-form-group">

                    <label>
                        Course
                        <span class="exam-required">*</span>
                    </label>

                    <input type="number"
                           th:field="*{courseId}"
                           placeholder="Enter course ID"
                           min="1"
                           required>

                </div>


                <!-- BATCH -->

                <div class="exam-form-group">

                    <label>
                        Batch
                        <span class="exam-required">*</span>
                    </label>

                    <input type="number"
                           th:field="*{batchId}"
                           placeholder="Enter batch ID"
                           min="1"
                           required>

                </div>


                <!-- EXAM TITLE -->

                <div class="exam-form-group exam-full">

                    <label>
                        Exam Title
                        <span class="exam-required">*</span>
                    </label>

                    <input type="text"
                           th:field="*{title}"
                           placeholder="Enter exam title"
                           maxlength="255"
                           required>

                </div>


                <!-- EXAM TYPE -->

                <div class="exam-form-group">

                    <label>
                        Exam Type
                        <span class="exam-required">*</span>
                    </label>

                    <select th:field="*{examType}"
                            required>

                        <option value="">
                            -- Select Exam Type --
                        </option>

                        <option value="QUIZ">
                            Quiz
                        </option>

                        <option value="MIDTERM">
                            Midterm
                        </option>

                        <option value="FINAL">
                            Final
                        </option>

                    </select>

                </div>


                <!-- DURATION -->

                <div class="exam-form-group">

                    <label>
                        Duration (Minutes)
                        <span class="exam-required">*</span>
                    </label>

                    <input type="number"
                           th:field="*{durationMin}"
                           min="1"
                           placeholder="e.g. 60"
                           required>

                </div>


                <!-- TOTAL MARK -->

                <div class="exam-form-group">

                    <label>
                        Total Mark
                        <span class="exam-required">*</span>
                    </label>

                    <input type="number"
                           th:field="*{totalMark}"
                           min="0.01"
                           step="0.01"
                           placeholder="e.g. 100"
                           required>

                </div>


                <!-- PASS MARK -->

                <div class="exam-form-group">

                    <label>
                        Pass Mark
                        <span class="exam-required">*</span>
                    </label>

                    <input type="number"
                           th:field="*{passMark}"
                           min="0"
                           step="0.01"
                           placeholder="e.g. 40"
                           required>

                </div>


                <!-- START DATE -->

                <div class="exam-form-group">

                    <label>
                        Start Date & Time
                        <span class="exam-required">*</span>
                    </label>

                    <input type="datetime-local"
                           th:field="*{startAt}"
                           required>

                </div>


                <!-- END DATE -->

                <div class="exam-form-group">

                    <label>
                        End Date & Time
                        <span class="exam-required">*</span>
                    </label>

                    <input type="datetime-local"
                           th:field="*{endAt}"
                           required>

                </div>


                <!-- MAX ATTEMPTS -->

                <div class="exam-form-group">

                    <label>
                        Maximum Attempts
                        <span class="exam-required">*</span>
                    </label>

                    <input type="number"
                           th:field="*{maxAttempts}"
                           min="1"
                           placeholder="e.g. 2"
                           required>

                </div>


                <!-- STATUS -->

                <div class="exam-form-group">

                    <label>
                        Status
                        <span class="exam-required">*</span>
                    </label>

                    <select th:field="*{status}"
                            required>

                        <option value="">
                            -- Select Status --
                        </option>

                        <option value="DRAFT">
                            Draft
                        </option>

                        <option value="PUBLISHED">
                            Published
                        </option>

                        <option value="CLOSED">
                            Closed
                        </option>

                    </select>

                </div>


                <!-- SHUFFLE QUESTIONS -->

                <div class="exam-checkbox-row exam-full">

                    <input type="checkbox"
                           th:field="*{shuffleQuestions}"
                           id="shuffleQuestions">

                    <label for="shuffleQuestions">
                        Shuffle Questions
                    </label>

                </div>


            </div>


            <!-- ================= BUTTONS ================= -->

            <div class="exam-form-actions">

                <a th:href="@{/teacher/exams}"
                   class="exam-btn exam-btn-secondary">
                    Cancel
                </a>

                <button type="submit"
                        class="exam-btn exam-btn-primary">

                    <span th:if="${exam.examId == null}">
                        Create Exam
                    </span>

                    <span th:if="${exam.examId != null}">
                        Update Exam
                    </span>

                </button>

            </div>


        </form>

    </div>

</div>

</body>
</html>
