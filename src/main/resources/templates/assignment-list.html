<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="container">
        <div class="page-header">

            <div>
                <h1 class="page-title">Assignment Management </h1>
                <p class="page-subtitle">
                    Manage your assignments easily.
                </p>
            </div>

            <a th:href="@{/teacher/assignments/create}"
               class="btn btn-primary">
                + Create Assignment
            </a>

        </div>

        <div class="success"
             th:if="${successMessage}"
             th:text="${successMessage}">
        </div>

        <div class="error"
             th:if="${errorMessage}"
             th:text="${errorMessage}">
        </div>

        <div class="filter-card">

            <form th:action="@{/teacher/assignments/search}"
                  method="get" class="search-form">

                <input type="text" name="title"
                       placeholder="Search assignment title..."
                       th:value="${title}">

                <select name="batchId">
                    <option value="">All Batches</option>
				<option th:each="batch : ${batches}" 
				        th:value="${batch.batch_id}" 
				        th:text="${batch.title}">Batch Title</option>

                </select>

                <select name="status">
                    <option value="">All Status</option>
                    
                    <option value="PUBLISHED"
                            th:selected="${selectedStatus == 'PUBLISHED'}">
                        PUBLISHED
                    </option>
                    
                    <option value="ACTIVE"
                            th:selected="${selectedStatus == 'ACTIVE'}">
                        ACTIVE
                    </option>
                    
                    <option value="INACTIVE"
                            th:selected="${selectedStatus == 'INACTIVE'}">
                        INACTIVE
                    </option>

                    <option value="CLOSED"
                            th:selected="${selectedStatus == 'CLOSED'}">
                        CLOSED
                    </option>
                </select>

                <button type="submit" class="btn btn-search">
                    Search
                </button>

                <a th:href="@{/teacher/assignments}"
                   class="btn btn-reset">
                    Reset
                </a>

            </form>
        </div>

        <div class="table-card">
            <div class="table-header">
                <h2>Assignment List</h2>
                <span class="total-count">
                    Total:
                    <strong th:text="${totalItems}">0</strong>
                </span>
            </div>

            <div class="table-responsive">
                <table class="assignment-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Batch</th>
                            <th>Lesson</th>
                            <th>Title</th>
                            <th>Start At</th>
                            <th>Due At</th>
                            <th>Total Mark</th>
                            <th>Pass Mark</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                   <tbody>

		    <tr th:each="assignment : ${assignments}">
		        <td th:text="${assignment.assignmentId}"></td>
		      <td>
			    <span th:each="batch : ${batches}"
			          th:if="${batch.batch_id == assignment.batchId}"
			          th:text="${batch.batch_code + ' - ' + batch.title}"> <!-- 🟢 FIXED: Changed batchCode to batch_code -->
			    </span>
			</td>

		
		        <td>
		            <!-- 🟢 DOUBLE CHECK: Ensure lessonId matches your Java model variable casing structure (lessonId vs lesson_id) -->
		            <span th:each="lesson : ${lessons}"
		                  th:if="${lesson.lessonId == assignment.lessonId}"
		                  th:text="${lesson.title}">
		            </span>
		        </td>
		
		        <td class="assignment-title" th:text="${assignment.title}"></td>
		        <td th:text="${assignment.startAt}"></td>
		        <td th:text="${assignment.dueAt}"></td>
		        <td th:text="${assignment.totalMark}"></td>
		        <td th:text="${assignment.passMark}"></td>
		        <td>
		            <span class="status-badge"
		                  th:classappend="${assignment.status == 'PUBLISHED'} ? ' status-published' :
		                  (${assignment.status == 'DRAFT'} ? ' status-draft' :
		                  (${assignment.status == 'CLOSED'} ? ' status-closed' : ' status-default'))"
		                  th:text="${assignment.status}">
		            </span>
		        </td>
		
		        <td class="action-buttons">
		            <a th:href="@{/teacher/assignments/{id}(id=${assignment.assignmentId})}"
		               class="btn btn-view">
		                View
		            </a>
		
		            <a th:href="@{/teacher/assignments/edit/{id}(id=${assignment.assignmentId})}"
		               class="btn btn-edit">
		                Edit
		            </a>
		
		            <form th:action="@{/teacher/assignments/delete/{id}(id=${assignment.assignmentId})}"
		                  method="post"
		                  class="delete-form"
		                  onsubmit="return confirm('Are you sure you want to delete this assignment?');">
		
		                <button type="submit" class="btn btn-delete">
		                    Delete
		                </button>
		                
		            </form>
		        </td>
		
		    </tr>
		
		    <tr th:if="${#lists.isEmpty(assignments)}">
		        <td colspan="10" class="empty-message">
		            No assignments found.
		        </td>
		    </tr>
		
		</tbody>

                </table>

            </div>

            <div class="pagination">
                <a th:if="${currentPage > 1}"
                   th:href="@{/teacher/assignments(page=${currentPage - 1})}">
                    Previous
                </a>

                <span th:each="i : ${#numbers.sequence(1, totalPages)}">
                    <a th:href="@{/teacher/assignments(page=${i})}"
                       th:text="${i}"
                       th:classappend="${i == currentPage} ? 'active' : ''">
                    </a>
                </span>

                <a th:if="${currentPage < totalPages}"
                   th:href="@{/teacher/assignments(page=${currentPage + 1})}">
                    Next
                </a>

            </div>
        </div>
    </div>

</body>
</html>
