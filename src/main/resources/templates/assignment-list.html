<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assignment List</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        padding: 30px;
    }

    .container {
        max-width: 1200px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
    }

    h2 {
        margin-bottom: 20px;
    }

    .create-btn {
        display: inline-block;
        padding: 10px 18px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        margin-bottom: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: left;
    }

    th {
        background: #2563eb;
        color: white;
    }

    tr:nth-child(even) {
        background: #f9fafb;
    }

    .edit-btn {
        background: #16a34a;
        color: white;
        padding: 6px 10px;
        text-decoration: none;
        border-radius: 4px;
    }

    .delete-btn {
        background: #dc2626;
        color: white;
        padding: 6px 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .success {
        background: #dcfce7;
        color: #166534;
        padding: 12px;
        margin-bottom: 15px;
    }

    .error {
        background: #fee2e2;
        color: #991b1b;
        padding: 12px;
        margin-bottom: 15px;
    }
</style>

</head>

<body>

<div class="container">

<h2>Assignment Management</h2>

<div class="success"
     th:if="${successMessage}"
     th:text="${successMessage}">
</div>

<div class="error"
     th:if="${errorMessage}"
     th:text="${errorMessage}">
</div>

<a th:href="@{/teacher/assignments/create}"
   class="create-btn">
    + Create Assignment
</a>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Batch ID</th>
            <th>Lesson ID</th>
            <th>Title</th>
            <th>Start At</th>
            <th>Due At</th>
            <th>Total Mark</th>
            <th>Pass Mark</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>

        <tr th:each="assignment : ${assignments}">
            <td th:text="${assignment.assignmentId}"></td>
            <td th:text="${assignment.batchId}"></td>
            <td th:text="${assignment.lessonId}"></td>
            <td th:text="${assignment.title}"></td>
            <td th:text="${assignment.startAt}"></td>
            <td th:text="${assignment.dueAt}"></td>
            <td th:text="${assignment.totalMark}"></td>
            <td th:text="${assignment.passMark}"></td>
            <td th:text="${assignment.status}"></td>

            <td>
                <a th:href="@{/teacher/assignments/edit/{id}(id=${assignment.assignmentId})}"
                   class="edit-btn">
                    Edit
                </a>

                <form th:action="@{/teacher/assignments/delete/{id}(id=${assignment.assignmentId})}"
                      method="post"
                      style="display:inline;"
                      onsubmit="return confirm('Are you sure you want to delete this assignment?');">

                    <button type="submit" class="delete-btn">
                        Delete
                    </button>

                </form>
            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(assignments)}">
            <td colspan="10" style="text-align:center;">
                No assignments found.
            </td>
        </tr>

    </tbody>
</table>

</div>

</body>
</html>
