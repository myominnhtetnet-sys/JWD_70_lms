<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | LMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f1118; --sidebar: #181d28; --card: #181d28; --border: #293142;
            --primary: #6c4ce5; --primary-light: #8068f0; --text: #f1f3f9; --muted: #929bb0;
            --green: #36c995; --yellow: #f4bd50; --red: #ff7373; --input: #202634;
        }
        body.light-mode {
            --bg: #f4f6fb; --sidebar: #ffffff; --card: #ffffff; --border: #e2e6ef;
            --text: #242938; --muted: #727c91; --input: #f5f6fa;
        }
        body { font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        a { color: inherit; text-decoration: none; }
        button, input, select { font: inherit; cursor: pointer; }
        .app { min-height: 100vh; }
        
        /* Layout CSS */
        .sidebar { width: 260px; position: fixed; inset: 0 auto 0 0; background: var(--sidebar); border-right: 1px solid var(--border); padding: 25px 18px; overflow-y: auto; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 13px; padding: 5px 10px 32px; }
        .brand-icon { width: 45px; height: 45px; background: #7895ff; color: white; border-radius: 13px; display: grid; place-items: center; font-size: 21px; }
        .brand-name { font-size: 20px; font-weight: 700; }
        .brand-subtitle { color: var(--muted); font-size: 13px; margin-top: 5px; }
        .menu-heading { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 17px 12px 12px; }
        .nav-link { display: flex; align-items: center; gap: 14px; padding: 13px 14px; margin-bottom: 5px; border-radius: 10px; color: var(--muted); font-size: 14px; }
        .nav-link i { width: 20px; text-align: center; }
        .nav-link:hover, .nav-link.active { background: rgba(108, 76, 229, .19); color: #9b8aff; font-weight: 700; }
        .sidebar-bottom { margin-top: 30px; border-top: 1px solid var(--border); padding-top: 15px; }
        .logout-link:hover { color: var(--red); }

        .main { margin-left: 260px; min-height: 100vh; }
        .topbar { min-height: 88px; padding: 18px 30px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 50; }
        .page-heading h1 { font-size: 23px; margin-bottom: 7px; }
        .page-heading p { color: var(--muted); font-size: 13px; }
        .topbar-right { display: flex; align-items: center; gap: 13px; }
        .icon-btn { width: 44px; height: 44px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--muted); display: grid; place-items: center; }
        .profile { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: white; font-weight: 700; }
        .profile-name { font-weight: 700; font-size: 14px; }
        .profile-role { font-size: 12px; color: var(--muted); margin-top: 5px; }

        .content { padding: 28px 30px 40px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-bottom: 23px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 22px; display: flex; gap: 15px; }
        .stat-icon { width: 49px; height: 49px; border-radius: 13px; display: grid; place-items: center; font-size: 20px; }
        .purple { background: rgba(108,76,229,.2); color: #a697ff; }
        .green { background: rgba(54,201,149,.15); color: var(--green); }
        .yellow { background: rgba(244,189,80,.15); color: var(--yellow); }
        .red { background: rgba(255,115,115,.14); color: var(--red); }
        .stat-label { color: var(--muted); font-size: 13px; margin-bottom: 9px; }
        .stat-value { font-size: 29px; font-weight: 700; }
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 23px; margin-bottom: 20px; }
    </style>
</head>

<script>
    const themeToggle = document.getElementById("themeToggle");
    function applyTheme(isLight) {
        document.body.classList.toggle("light-mode", isLight);
        themeToggle.innerHTML = isLight ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-regular fa-moon"></i>';
        localStorage.setItem("lmsTheme", isLight ? "light" : "dark");
    }
    applyTheme(localStorage.getItem("lmsTheme") === "light");
    if(themeToggle) {
        themeToggle.addEventListener("click", () => applyTheme(!document.body.classList.contains("light-mode")));
    }
</script>
