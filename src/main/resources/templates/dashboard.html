<!DOCTYPE html>
<html lang="en"
      class="h-full bg-slate-50"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPulse Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="h-full font-sans text-slate-800 dark:text-slate-100 dark:bg-slate-900 transition-colors duration-200">

<div id="app" class="min-h-screen flex flex-col">

    <!-- =====================================================
         HEADER
         ===================================================== -->
    <div th:replace="~{header :: header}"></div>

    <!-- =====================================================
         MAIN APPLICATION AREA
         ===================================================== -->
    <div class="flex-1 flex overflow-hidden">

        <!-- =================================================
             SIDEBAR (STANDARDIZED ADMIN MENU)
             ================================================= -->
        <aside id="sidebar"
               class="w-64 bg-[#0f172a] text-slate-300 flex-shrink-0 flex flex-col justify-between sticky top-0 h-screen text-sm font-medium transition-all duration-300">

            <div>
                <!-- Logo Area -->
                <div class="h-20 flex items-center px-6 gap-3 border-b border-slate-800 shrink-0">
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center font-bold justify-center">E</div>
                    <div>
                        <div class="font-bold text-white text-sm">EduPulse <span class="text-xs bg-indigo-600/30 text-indigo-400 px-1.5 py-0.5 rounded">LMS</span></div>
                    </div>
                </div>

                <!-- Navigation Links -->
                <div class="p-4 space-y-1 overflow-y-auto">
                    <div id="sidebar-category"
                         class="px-3 py-2 text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                        Admin Menu
                    </div>

                    <nav id="sidebar-menu" class="space-y-1">
                        <!-- Active Dashboard Link -->
                        <a th:href="@{/admin}"
                           class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/30 transition">
                            <i class="fa-solid fa-house w-5"></i>
                            <span>Dashboard</span>
                        </a>

                        <a th:href="@{/admin/users}"
                           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
                            <i class="fa-solid fa-users w-5"></i>
                            <span>Users &amp; Roles</span>
                        </a>

                        <a th:href="@{/admin/categories/list}"
                           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
                            <i class="fa-solid fa-layer-group w-5"></i>
                            <span>Category</span>
                        </a>

                        <a th:href="@{/api/v1/discounts/view}"
                           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
                            <i class="fa-solid fa-tags w-5"></i>
                            <span>Discounts</span>
                        </a>

                        <a th:href="@{/admin/installments}"
                           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
                            <i class="fa-solid fa-file-invoice-dollar w-5"></i>
                            <span>Installment Rules</span>
                        </a>
                        
                        <a th:href="@{/admin/scholarships}"
                           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
                            <i class="fa-solid fa-graduation-cap w-5"></i>
                            <span>Scholarships</span>
                        </a>

                        <a th:href="@{/admin/scholarship-applications-review}"
                           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
                            <i class="fa-solid fa-file-lines w-5"></i>
                            <span>Scholarship Applications</span>
                        </a>

                        <a th:href="@{/admin/courses}"
                           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
                            <i class="fa-solid fa-book w-5"></i>
                            <span>Global Courses</span>
                        </a>

                        <a th:href="@{/admin/Settings}"
                           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
                            <i class="fa-solid fa-gear w-5"></i>
                            <span>System Settings</span>
                        </a>

                        <a th:href="@{/admin/reports}"
                           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
                            <i class="fa-solid fa-chart-pie w-5"></i>
                            <span>Reports</span>
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Footer Badge -->
            <div class="p-4 border-t border-slate-800 shrink-0">
                <div class="p-3 rounded-xl bg-slate-800/60 border border-slate-700/50">
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                        <span class="text-xs font-medium text-slate-300">EduPulse v2.4 Active</span>
                    </div>
                    <p class="text-[11px] text-slate-500 mt-1">All systems operational</p>
                </div>
            </div>
        </aside>

        <!-- =====================================================
             MAIN CONTENT
             ===================================================== -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-50 dark:bg-slate-900">
            <div id="view-admin" class="role-view">
                <div th:replace="~{admin :: admin}"></div>
            </div>
            <div id="view-teacher" class="role-view hidden">
                <div th:replace="~{teacher :: teacher}"></div>
            </div>
            <div id="view-student" class="role-view hidden">
                <div th:replace="~{student :: student}"></div>
            </div>
        </main>

    </div>
</div>

<script type="text/javascript" th:src="@{/js/main.js}"></script>

</body>
</html>
