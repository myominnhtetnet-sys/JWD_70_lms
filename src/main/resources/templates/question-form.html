<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Create Question</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    ::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.03);
    }
    ::-webkit-scrollbar-thumb {
        background: rgba(0,0,0,0.15);
        border-radius: 3px;
    }
    .fade-in {
        animation: fadeIn 0.25s ease-in-out;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body class="h-full font-sans text-slate-900 bg-slate-50 antialiased">

    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- TOP HEADER BAR -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div class="px-6 py-3.5 flex items-center justify-between gap-4">
                
                <!-- Left: Branding & User Profile -->
                <div class="flex items-center gap-6 flex-1 max-w-xl">
                    <div class="flex items-center gap-3 cursor-pointer">
                        <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-indigo-100">
                            <i class="fa-solid font-bold text-lg">E</i>
                        </div>
                        <div>
                            <span class="font-extrabold text-base tracking-tight bg-gradient-to-r from-indigo-600 to-indigo-800 bg-clip-text text-transparent">EduPulse</span>
                            <span class="text-xs px-2 py-0.5 ml-1 rounded-full bg-indigo-50 text-indigo-700 font-bold border border-indigo-200">LMS</span>
                        </div>
                    </div>
                    </div>
                    </div>
		</header>

		<!-- MAIN CONTENT WRAPPER -->
		<main class="flex-1 w-full max-w-4xl mx-auto px-4 sm:px-8 py-6">

			<div class="mb-5">
				<h1 id="pageTitle" class="text-xl font-bold text-slate-900">
					Create Question</h1>
				<p id="pageDescription" class="text-xs text-slate-600 mt-1">
					Manage question information and answer options.</p>
			</div>


			<form id="questionForm">

				<div class="bg-white rounded-2xl
						border border-slate-200 shadow-xs p-5 mb-5 w-full">

					<h2 class="text-base font-bold text-slate-800
						   pb-3 mb-4 border-b border-slate-200">
						Basic Information</h2>

					<div class="mb-4">
						<label for="courseId"
							class="block text-xs font-bold uppercase text-slate-700 mb-1">
							Course </label>
						<select id="courseId" name="courseId" required
							class="w-full px-3.5 py-2.5 text-sm border border-slate-300
								   rounded-xl bg-slate-50 focus:outline-none
								   focus:ring-2 focus:ring-teal-500 font-medium">
							<option value="">-- Select Course --</option>
						</select>
					</div>

					<div class="mb-4">
						<label for="questionText"
							class="block text-xs
								  font-bold uppercase
								  text-slate-700 mb-1">
							Question </label>

						<textarea id="questionText" name="questionText" rows="2" required
							placeholder="Enter your question"
							class="w-full px-3.5 py-2.5 text-sm border border-slate-300
									 rounded-xl resize-none focus:outline-none
									 focus:ring-2 focus:ring-teal-500 bg-slate-50"></textarea>
					</div>

					<div class="grid grid-cols-2 gap-4">
						<div>
							<label for="questionType"
								class="block text-xs font-bold uppercase text-slate-700 mb-1">
								Question Type </label> 
							<select id="questionType" name="questionType"
								required onchange="changeQuestionType()"
								class="w-full px-3.5 py-2.5 text-sm
									   border border-slate-300 rounded-xl
									   bg-slate-50 focus:outline-none
									   focus:ring-2 focus:ring-teal-500 font-medium">
								<option value="">-- Select Type --</option>
								<option value="MCQ">Multiple Choice</option>
								<option value="TRUE_FALSE">True / False</option>
								<option value="SHORT_ANSWER">Short Answer</option>
							</select>
						</div>

						<div>
							<label for="defaultMark"
								class="block text-xs font-bold uppercase text-slate-700 mb-1">
								Default Mark </label> 
							<input type="number" id="defaultMark"
								name="defaultMark" step="0.01" min="0" required
								placeholder="Enter mark"
								class="w-full px-3.5 py-2.5 text-sm
									  border border-slate-300 rounded-xl
									  focus:outline-none focus:ring-2 focus:ring-teal-500 bg-slate-50">
						</div>

					</div>

				</div>

				<div id="optionsSection"
					class="bg-white rounded-2xl border border-slate-200 shadow-xs p-5 mb-5 w-full hidden">

					<div class="flex items-center justify-between
							pb-3 mb-4 border-b border-slate-200">

						<div>
							<h2
								class="text-base font-bold text-slate-800">
								Answer Options</h2>
							<p class="text-xs text-slate-500">Select the correct
								answer.</p>
						</div>

						<button type="button" id="addOptionButton" onclick="createOption()"
							class="px-3.5 py-2 text-xs bg-indigo-600
								   text-white rounded-xl hover:bg-indigo-700 font-bold transition shadow-xs cursor-pointer">
							<i class="fa-solid fa-plus mr-1"></i> Add Option
						</button>

					</div>

					<div id="optionsContainer" class="space-y-3"></div>

				</div>

				<div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-5 mb-5 w-full">
					<h2 class="text-base font-bold text-slate-800 pb-3 mb-4 border-b border-slate-200">
						Explanation</h2>
					<label for="explanation"
						class="block text-xs font-bold uppercase text-slate-700 mb-1">
						Explanation 
						<span class="text-xs text-slate-400 font-normal">
							(Optional) </span>
					</label>

					<textarea id="explanation" name="explanation" rows="2"
						placeholder="Enter explanation..."
						class="w-full px-3.5 py-2.5 text-sm
								 border border-slate-300
								 rounded-xl resize-none
								 focus:outline-none focus:ring-2
								 focus:ring-teal-500 bg-slate-50"></textarea>
				</div>

				<div class="flex justify-end gap-2 pb-6">

					<button type="button" onclick="goBack()"
						class="px-4 py-2 text-xs border border-slate-300
							   bg-slate-200 text-slate-800 font-bold
							   rounded-xl hover:bg-slate-300 transition cursor-pointer">
						Cancel</button>


					<button type="submit" id="saveButton"
						class="px-5 py-2 text-xs bg-teal-600
							   text-white font-bold rounded-xl hover:bg-teal-700 transition cursor-pointer shadow-xs">
						<i class="fa-solid fa-floppy-disk mr-1"></i> 
						<span id="saveButtonText"> Save Question </span>
					</button>

				</div>

			</form>

		</main>

	</div>


	<script>

let optionCount = 0;
let questionId = null;

const currentPath = window.location.pathname;
const isEdit = currentPath.startsWith("/questions/edit/");

document.addEventListener("DOMContentLoaded", function () {

    loadCourses()
        .then(() => {
            if (isEdit) {
                questionId = currentPath.split("/").pop();
                setupEditPage();
                loadQuestionForEdit();
            } else {
                setupAddPage();

            }

        })

        .catch(error => {
            console.error( "Page initialization error:", error);
        });

});

function loadCourses() {
	
    return fetch("/api/questions/courses")
        .then(response => {
            if (!response.ok) {
                throw new Error( "Failed to load courses" );
            }
            return response.json();
        })

        .then(courses => {
        	
            const select = document.getElementById("courseId");
            select.innerHTML = '<option value="">-- Select Course --</option>';

            courses.forEach(course => {
                const option =  document.createElement("option");
                option.value = course.course_id;
                option.textContent = course.title;
                select.appendChild(option);
            });

        })

        .catch(error => {
            console.error( "Course loading error:", error);
            alert("Failed to load courses.");
            throw error;

        });

}

function setupAddPage() {

    document.getElementById("pageTitle").textContent = "Create Question";
    document.getElementById("pageDescription").textContent =
        "Manage question information and answer options.";
    document.getElementById("saveButtonText").textContent = "Save Question";

}

function setupEditPage() {

    document.getElementById("pageTitle").textContent = "Edit Question";
    document.getElementById("pageDescription").textContent =
        "Update question information and answer options.";
    document.getElementById("saveButtonText").textContent = "Update Question";

}

function changeQuestionType() {
	
    const type = document.getElementById("questionType").value;
    const optionsSection = document.getElementById("optionsSection");
    const addOptionButton =document.getElementById("addOptionButton");
    const optionsContainer = document.getElementById("optionsContainer");

    optionsContainer.innerHTML = "";
    optionCount = 0;

    if (type === "") {
        optionsSection.classList.add("hidden");
        return;
    }

    if (type === "SHORT_ANSWER") {
        optionsSection.classList.add("hidden");
        return;
    }

    if (type === "MCQ") {
        optionsSection.classList.remove("hidden");
        addOptionButton.classList.remove("hidden");

        createOption();
        createOption();
        createOption();
        createOption();

        return;
    }


    /* TRUE / FALSE */

    if (type === "TRUE_FALSE") {

        optionsSection.classList.remove("hidden");

        addOptionButton.classList.add("hidden");

        createOption("True", false);
        createOption("False", false);

        return;
    }

}

function createOption( text = "", isCorrect = false) {

    optionCount++;
    const container = document.getElementById("optionsContainer");
    const optionItem = document.createElement("div");

    optionItem.className =
        "option-item flex items-center gap-3 " +
        "p-3 rounded-xl border border-slate-200 " +
        "bg-slate-50 hover:border-teal-300 " +
        "hover:bg-teal-50/30 transition";

    const radioWrapper = document.createElement("div");
    
    radioWrapper.className = "flex items-center";
    
    const radio =document.createElement("input");

    radio.type = "radio";
    radio.name = "correctOption";
    radio.value = optionCount;
    radio.checked = isCorrect;
    radio.className =
        "w-4 h-4 text-teal-600 " +
        "border-slate-300 " +
        "focus:ring-teal-500 cursor-pointer";

    radioWrapper.appendChild(radio);

    const label = document.createElement("span");

    label.className = "text-xs font-bold text-slate-700 w-16";
    label.textContent = "Option " + optionCount;

    const input = document.createElement("input");
    input.type = "text";
    input.className =
        "option-text flex-1 px-3.5 py-2 " +
        "text-sm " +
        "border border-slate-300 rounded-xl " +
        "bg-white focus:outline-none " +
        "focus:ring-2 focus:ring-teal-500 " +
        "font-medium";

    input.placeholder = "Enter option " + optionCount;
    input.value = text;

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    
    deleteButton.className =
        "w-8 h-8 rounded-lg " +
        "text-rose-500 hover:text-rose-600 " +
        "hover:bg-rose-50 transition cursor-pointer flex items-center justify-center";

    deleteButton.innerHTML = '<i class="fa-solid fa-trash text-xs"></i>';
    deleteButton.onclick = function () {
        optionItem.remove();
        refreshOptionNumbers();
    };

    optionItem.appendChild(radioWrapper);
    optionItem.appendChild(label);
    optionItem.appendChild(input);
    optionItem.appendChild(deleteButton);
    container.appendChild(optionItem);

}

function refreshOptionNumbers() {

    const items =document.querySelectorAll(".option-item" );

    items.forEach((item, index) => {

        const label = item.querySelector("span");
        const input = item.querySelector(".option-text");

        label.textContent = "Option " + (index + 1);
        input.placeholder = "Enter option " + (index + 1);

    });

    optionCount = items.length;

}

function loadQuestionForEdit() {

    fetch(`/api/questions/${questionId}`)

        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to load question");
            }
            return response.json();

        })

        .then(question => {
        	
            document.getElementById("courseId").value =question.courseId ?? "";
            document.getElementById("questionText").value = question.questionText ?? "";
            document.getElementById("questionType") .value = question.questionType ?? "";
            document.getElementById("defaultMark") .value = question.defaultMark ?? "";
            document.getElementById("explanation") .value = question.explanation ?? "";

            return fetch(`/api/questions/${questionId}/options`);

        })


        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to load options");
            }
            return response.json();

        })

        .then(options => {
            renderEditOptions(options);
        })

        .catch(error => {
            console.error(error);
            alert("Failed to load question information.");

        });

}

function renderEditOptions(options) {

    const container = document.getElementById( "optionsContainer" );
    const type = document.getElementById( "questionType").value;
    const optionsSection = document.getElementById("optionsSection" );
    const addOptionButton =document.getElementById( "addOptionButton" );

    container.innerHTML = "";

    optionCount = 0;

    if (type === "SHORT_ANSWER") {
        optionsSection.classList.add("hidden");
        return;
    }

    optionsSection.classList.remove("hidden");

    if (type === "MCQ") {
        addOptionButton.classList.remove( "hidden");
    }

    if (type === "TRUE_FALSE") {
        addOptionButton.classList.add( "hidden");
    }

    if (!options || options.length === 0) {
        if (type === "MCQ") {
            createOption();
            createOption();
            createOption();
            createOption();
            
        }else if (type === "TRUE_FALSE") {
            createOption( "True", false);
            createOption("False", false);
        }

        return;
    }

    options.forEach(option => {
        createOption( option.optionText || "", option.isCorrect === true);
    });

}


function getFormData() {

    const courseId = document.getElementById("courseId").value;
    const questionText = document.getElementById("questionText").value.trim();
    const questionType = document.getElementById("questionType").value;
    const defaultMark = document.getElementById("defaultMark").value;
    const explanation = document.getElementById("explanation").value.trim();

    return {

        courseId: courseId
                ? Number(courseId) : null,

        questionText: questionText,
        questionType: questionType,

        defaultMark: defaultMark
                ? Number(defaultMark) : null,

        explanation: explanation,
        isActive: true,
        createdBy:
            1
    };

}

function validateOptions() {

    const type = document.getElementById("questionType").value;

    if (type === "SHORT_ANSWER") {
        return true;
    }

    const optionItems =document.querySelectorAll(".option-item");
    if (optionItems.length === 0) {
        alert( "Please add at least one option.");
        return false;
    }

    for (const item of optionItems) {
        const input = item.querySelector(".option-text");
        if (!input.value.trim()) {
            alert("Please fill in all answer options.");
            input.focus();
            return false;
        }

    }

    const correctOption = document.querySelector('input[name="correctOption"]:checked');

    if (!correctOption) {
        alert("Please select at least one correct answer.");
        return false;
    }

    return true;
}

document.getElementById("questionForm").addEventListener("submit", function (event) {

        event.preventDefault();
        if (!validateOptions()) {
            return;
        }

        const formData = getFormData();
        const saveButton = document.getElementById( "saveButton");

        saveButton.disabled = true;
        saveButton.classList.add( "opacity-60", "cursor-not-allowed");

        if (!isEdit) {
            fetch(
                "/api/questions",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":"application/json"
                    },
                    body: JSON.stringify( formData )
                })

                .then(response => {
                    if (!response.ok) {
                        throw new Error("Failed to save question");
                    }
                    return response.json();

                }).then(newQuestionId => {
                    return saveOptions( newQuestionId);
                    
                }).then(() => {
                    alert( "Question created successfully.");
                    window.location.href ="/questions";

                })

                .catch(error => {
                    console.error(error);
                    alert("Failed to save question.");
                    enableSaveButton();
                });

        }

        else {
            fetch(
                `/api/questions/${questionId}`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify( formData )
                })

                .then(response => {
                    if (!response.ok) {
                        throw new Error( "Failed to update question" );
                    }
                    return response;
                })

                .then(() => {
                    return fetch(
                        `/api/questions/${questionId}/options`,
                        {
                            method: "DELETE"
                        }
                    );

                }).then(() => {
                    return saveOptions( questionId);
                    
                }).then(() => {
                    alert( "Question updated successfully.");
                    window.location.href = "/questions";
                    
                })
                .catch(error => {
                    console.error(error);
                    alert("Failed to update question.");
                    enableSaveButton();
                });
        }

    });


function saveOptions(id) {
    const type = document.getElementById( "questionType").value;
    if (type === "SHORT_ANSWER") {
        return Promise.resolve();

    }

    const optionItems =document.querySelectorAll( ".option-item");
    const requests = [];

    optionItems.forEach(item => {
        const input =item.querySelector( ".option-text" );
        const radio = item.querySelector('input[name="correctOption"]');
        const optionData = {
            questionId: Number(id),
            optionText: input.value.trim(),
            isCorrect: radio.checked

        };

        requests.push(
            fetch(
                `/api/questions/${id}/options`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(optionData )
                })
        );

    });

    return Promise.all(requests);

}

function enableSaveButton() {
    const saveButton = document.getElementById("saveButton");
    saveButton.disabled = false;
    saveButton.classList.remove("opacity-60","cursor-not-allowed");

}

function goBack() {
    window.location.href = "/questions";
}

</script>

</body>
</html>
