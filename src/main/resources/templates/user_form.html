<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit User | LMS</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 35px 15px;
            background: #f5f6fa;
            color: #24243a;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            border: 1px solid #e9eaf2;
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #85859b;
            margin-bottom: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e2ed;
            border-radius: 8px;
            font: inherit;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
        }

        .save {
            color: white;
            background: #7565f5;
        }

        .cancel {
            color: #555;
            background: #f0f0f6;
        }

        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>
        <i class="fa-solid fa-user-pen"></i>
        Edit User
    </h1>

    <p class="subtitle">
        Update user information and account status.
    </p>

    <form th:action="@{/admin/users/update}"
          th:object="${user}"
          method="post">

        <input type="hidden"
               th:field="*{user_id}">

        <div class="form-grid">

            <div class="form-group">
                <label for="full_name">Full Name *</label>

                <input type="text"
                       id="full_name"
                       th:field="*{full_name}"
                       maxlength="100"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>

                <input type="email"
                       id="email"
                       th:field="*{email}"
                       maxlength="255"
                       required>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>

                <input type="tel"
                       id="phone"
                       th:field="*{phone}"
                       maxlength="20">
            </div>

            <div class="form-group">
                <label for="role_id">Role *</label>

                <select id="role_id"
                        th:field="*{role_id}"
                        required>

                    <option th:each="r : ${roles}"
                            th:value="${r.role_id}"
                            th:text="${r.role_name}">
                        Role
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label for="status">Status *</label>

                <select id="status"
                        th:field="*{status}"
                        required>

                    <option value="ACTIVE">Active</option>
                    <option value="INACTIVE">Inactive</option>
                    <option value="SUSPENDED">Suspended</option>

                </select>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>

                <input type="date"
                       id="dob"
                       th:field="*{dob}">
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>

                <select id="gender"
                        th:field="*{gender}">

                    <option value="">Select Gender</option>
                    <option value="MALE">Male</option>
                    <option value="FEMALE">Female</option>
                    <option value="OTHER">Other</option>

                </select>
            </div>

            <div class="form-group full">
                <label for="address">Address</label>

                <textarea id="address"
                          th:field="*{address}"
                          rows="3"
                          maxlength="255"></textarea>
            </div>

        </div>

        <div class="buttons">

            <a th:href="@{/admin/users}"
               class="btn cancel">
                Cancel
            </a>

            <button type="submit"
                    class="btn save">
                <i class="fa-solid fa-floppy-disk"></i>
                Save Changes
            </button>

        </div>

    </form>

</div>

</body>
</html>
