<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title th:text="${user.userId == 0 ? 'Add User' : 'Edit User'}">
        User Form
    </title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4e9ff;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            color: #4b176b;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / 3;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #8e44ad;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        button,
        .cancel {
            padding: 11px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .save {
            background: #8e44ad;
            color: white;
        }

        .cancel {
            background: #ddd;
            color: #333;
        }

        .alert {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .error {
            background: #ffe0e0;
            color: #b00020;
        }

        @media(max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h2>

            <i class="fa-solid fa-user"></i>

            <span
                th:text="${user.userId == 0 ? 'Add New User' : 'Edit User'}">
                User Form
            </span>

        </h2>


        <div
            th:if="${error}"
            class="alert error"
            th:text="${error}">
        </div>


        <!-- ADD -->
        <form
            th:if="${user.userId == 0}"
            th:action="@{/admin/users/add}"
            method="post">

            <div class="form-grid">

                <div class="form-group">
                    <label>Full Name</label>

                    <input
                        type="text"
                        name="fullName"
                        required>
                </div>


                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        required>
                </div>


                <div class="form-group">
                    <label>Phone</label>

                    <input
                        type="text"
                        name="phone">
                </div>


                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        name="passwordHash"
                        required>
                </div>


                <div class="form-group">
                    <label>Role</label>

                    <select name="roleId" required>

                        <option value="">
                            -- Select Role --
                        </option>

                        <option value="1">
                            Admin
                        </option>

                        <option value="2">
                            Teacher
                        </option>

                        <option value="3">
                            Student
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label>Status</label>

                    <select name="status">

                        <option value="ACTIVE">
                            Active
                        </option>

                        <option value="INACTIVE">
                            Inactive
                        </option>

                        <option value="SUSPENDED">
                            Suspended
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label>Date of Birth</label>

                    <input
                        type="date"
                        name="dob">
                </div>


                <div class="form-group">
                    <label>Gender</label>

                    <select name="gender">

                        <option value="">
                            -- Select Gender --
                        </option>

                        <option value="MALE">
                            Male
                        </option>

                        <option value="FEMALE">
                            Female
                        </option>

                        <option value="OTHER">
                            Other
                        </option>

                    </select>
                </div>


                <div class="form-group full">

                    <label>Address</label>

                    <textarea
                        name="address">
                    </textarea>

                </div>

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="save">

                    <i class="fa-solid fa-save"></i>
                    Save User

                </button>

                <a
                    href="/admin"
                    class="cancel">

                    Cancel

                </a>

            </div>

        </form>


        <!-- EDIT -->
        <form
            th:if="${user.userId != 0}"
            th:action="@{/admin/users/update}"
            method="post">

            <input
                type="hidden"
                name="userId"
                th:value="${user.userId}">


            <div class="form-grid">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="fullName"
                        th:value="${user.fullName}"
                        required>

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        th:value="${user.email}"
                        required>

                </div>


                <div class="form-group">

                    <label>Phone</label>

                    <input
                        type="text"
                        name="phone"
                        th:value="${user.phone}">

                </div>


                <div class="form-group">

                    <label>Role</label>

                    <select name="roleId" required>

                        <option
                            value="1"
                            th:selected="${user.roleId == 1}">
                            Admin
                        </option>

                        <option
                            value="2"
                            th:selected="${user.roleId == 2}">
                            Teacher
                        </option>

                        <option
                            value="3"
                            th:selected="${user.roleId == 3}">
                            Student
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Status</label>

                    <select name="status">

                        <option
                            value="ACTIVE"
                            th:selected="${user.status == 'ACTIVE'}">
                            Active
                        </option>

                        <option
                            value="INACTIVE"
                            th:selected="${user.status == 'INACTIVE'}">
                            Inactive
                        </option>

                        <option
                            value="SUSPENDED"
                            th:selected="${user.status == 'SUSPENDED'}">
                            Suspended
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Date of Birth</label>

                    <input
                        type="date"
                        name="dob"
                        th:value="${user.dob}">

                </div>


                <div class="form-group">

                    <label>Gender</label>

                    <select name="gender">

                        <option
                            value="MALE"
                            th:selected="${user.gender == 'MALE'}">
                            Male
                        </option>

                        <option
                            value="FEMALE"
                            th:selected="${user.gender == 'FEMALE'}">
                            Female
                        </option>

                        <option
                            value="OTHER"
                            th:selected="${user.gender == 'OTHER'}">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>Address</label>

                    <textarea
                        name="address"
                        th:text="${user.address}">
                    </textarea>

                </div>

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="save">

                    <i class="fa-solid fa-pen"></i>
                    Update User

                </button>

                <a
                    href="/admin"
                    class="cancel">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
