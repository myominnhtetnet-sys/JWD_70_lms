<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - LMS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Student CSS -->
    <link rel="stylesheet" th:href="@{/css/student.css}" href="css/student.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

    <div class="flex min-h-screen">
        <!-- Sidebar Navigation Menu -->
        <aside class="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col justify-between shrink-0">
            <div>
                <!-- Logo -->
                <div class="h-16 flex items-center px-6 border-b border-slate-800 gap-3">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <span class="text-lg font-bold text-white tracking-wide">LMS</span>
                </div>

                <!-- Navigation Links -->
                <nav class="p-4 space-y-1">
                    <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-white bg-indigo-600 shadow-sm transition">
                        <i class="fa-solid fa-house text-base"></i> Dashboard
                    </a>
                    <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition">
                        <i class="fa-solid fa-book-open text-base"></i> My Courses
                    </a>
                    <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition justify-between">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-list-check text-base"></i> Assignments
                        </div>
                        <span class="px-2 py-0.5 text-[10px] font-bold bg-amber-500/20 text-amber-400 rounded-full">2</span>
                    </a>
                    
                    <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition">
                        <i class="fa-solid fa-chart-line text-base"></i> Grades & Certificates
                    </a>
                    <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition">
                        <i class="fa-solid fa-user text-base"></i> My Profile
                    </a>
                </nav>
            </div>

            <!-- Logout Link -->
            <div class="p-4 border-t border-slate-800">
                <a th:href="@{/logout}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-rose-400 hover:bg-rose-500/10 transition">
                    <i class="fa-solid fa-right-from-bracket text-base"></i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">

            <!-- Top Header -->
            <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-10 shadow-sm">
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-bold text-slate-800">Student Dashboard</h2>
                </div>
            </header>

            <main class="p-6 lg:p-8 space-y-8">

                <!-- Profile Welcome Section -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                    <div class="flex items-center gap-5">
                        
                        <!-- Static Circle Icon Avatar -->
                        <div class="relative">
                            <div class="w-16 h-16 rounded-2xl bg-slate-100 text-slate-500 flex items-center justify-center ring-4 ring-slate-100/50 shadow-sm border border-slate-200">
                                <i class="fa-solid fa-user text-2xl"></i>
                            </div>
                            
                            <!-- Active Status Dot -->
                            <span class="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 border-2 border-white rounded-full" title="Active"></span>
                        </div>

                        <!-- Student Information -->
                        <div>
                            <div class="flex items-center gap-2">
                                <h1 class="text-2xl font-bold text-slate-900">
                                    Welcome, <span th:text="${fullName != null ? fullName : (session.fullName != null ? session.fullName : 'Aris')}">Aris</span>! 👋
                                </h1>
                            </div>
                            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-1 text-xs text-slate-500 font-medium">
                                <span><i class="fa-solid fa-id-card text-slate-400 mr-1"></i> ID: <strong class="text-slate-700" th:text="${studentId != null ? studentId : (session.studentId != null ? session.studentId : 'STU-2026-0042')}">STU-2026-0042</strong></span>
                                <span>•</span>
                                <span><i class="fa-solid fa-graduation-cap text-slate-400 mr-1"></i> Course: <strong class="text-slate-700" th:text="${course != null ? course : '?'}">?</strong></span>
                            </div>
                        </div>

                    </div>
                </div>

            </main>
        </div>
    </div>

</body>
</html>
