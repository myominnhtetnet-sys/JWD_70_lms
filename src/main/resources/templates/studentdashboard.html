<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - LMS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/student.css}" href="css/student.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">

    <div class="flex min-h-screen">
        <!-- Sidebar Navigation Menu -->
        <aside class="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col justify-between shrink-0 sticky top-0 h-screen overflow-y-auto border-r border-slate-800">
            <div>
                <!-- Logo -->
                <div class="h-16 flex items-center px-6 border-b border-slate-800 gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-500 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-500/20">
                        <i class="fa-solid fa-graduation-cap text-lg"></i>
                    </div>
                    <div>
                        <span class="text-base font-bold text-white tracking-wide block leading-none">LearnHub</span>
                        <small class="text-[11px] font-medium text-slate-400">Student Portal</small>
                    </div>
                </div>

                <!-- Navigation Links -->
                <nav class="p-4 space-y-6">
                    <div>
                        <div class="px-3 text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2">Learning</div>
                        <div class="space-y-1">
                            <a th:href="@{/student}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-white bg-indigo-600/90 shadow-sm transition">
                                <i class="fa-solid fa-border-all text-base"></i> Dashboard
                            </a>
                            <a th:href="@{/student/courses}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition text-slate-400">
                                <i class="fa-solid fa-book-open text-base"></i> My Courses
                            </a>
                            <a th:href="@{/student/classroom}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition text-slate-400">
                                <i class="fa-solid fa-display text-base"></i> Classroom
                            </a>
                            <a th:href="@{/student/schedule}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition text-slate-400">
                                <i class="fa-regular fa-calendar-check text-base"></i> Schedule
                            </a>
                            <a th:href="@{/student/assignments}" class="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition text-slate-400">
                                <div class="flex items-center gap-3">
                                    <i class="fa-regular fa-file-lines text-base"></i> Assignments
                                </div>
                                <span class="px-2 py-0.5 text-[10px] font-bold bg-rose-500/20 text-rose-400 rounded-full">2</span>
                            </a>
                            <a th:href="@{/student/exams}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition text-slate-400">
                                <i class="fa-solid fa-square-check text-base"></i> Exams
                            </a>
                            <a th:href="@{/certificate/verify}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition text-slate-400">
                                <i class="fa-solid fa-award text-base"></i> Certificates
                            </a>
                        </div>
                    </div>

                    <div>
                        <div class="px-3 text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2">Account</div>
                        <div class="space-y-1">
                            <a th:href="@{/student/checkout}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition text-slate-400">
                                <i class="fa-regular fa-credit-card text-base"></i> Payments
                            </a>
                            <a th:href="@{/student/profile}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition text-slate-400">
                                <i class="fa-regular fa-user text-base"></i> My Profile
                            </a>
                        </div>
                    </div>
                </nav>
            </div>

            <!-- Side Card & Logout Link -->
            <div class="p-4 border-t border-slate-800 space-y-3">
                <a th:href="@{/logout}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-rose-400 hover:bg-rose-500/10 transition">
                    <i class="fa-solid fa-right-from-bracket text-base"></i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">

            <!-- Top Header -->
            <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between sticky top-0 z-10 shadow-sm">
                <div>
                    <h2 class="text-lg font-bold text-slate-900 leading-tight">Dashboard</h2>
                    <p class="text-xs text-slate-400 font-medium">Friday, 2 October 2026</p>
                </div>

                <div class="flex items-center gap-3">
                    <!-- User Info -->
                    <div class="flex items-center gap-3 pl-2 border-l border-slate-200">
                        <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-rose-400 to-pink-500 text-white font-bold text-xs flex items-center justify-center shadow-sm">
                            <span th:text="${fullName != null ? #strings.substring(fullName,0,2) : 'AR'}">AR</span>
                        </div>
                        <div class="hidden lg:block">
                            <b class="block text-xs font-bold text-slate-800 leading-none" th:text="${fullName != null ? fullName : 'Student'}">Student</b>
                            <small class="text-[11px] text-slate-400 font-medium">Student</small>
                        </div>
                    </div>
                </div>
            </header>

            <main class="p-6 lg:p-8 space-y-6 max-w-[1400px] mx-auto w-full">

                <!-- Hero Section Banner -->
                <div class="bg-indigo-600 rounded-2xl p-6 text-white shadow-md flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                    <div class="space-y-1">
                        <h1 class="text-xl lg:text-2xl font-bold tracking-tight">
                            Mingalabar, <span th:text="${fullName != null ? fullName : 'Student'}">Student</span>! 👋
                        </h1>
                        
                    </div>
                </div>

                <!-- Stats Overview Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-4">
                        <div class="w-11 h-11 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg">
                            <i class="fa-solid fa-book"></i>
                        </div>
                        <div>
                            <span class="text-xs font-medium text-slate-400 block">Active courses</span>
                            <span class="text-xl font-bold text-slate-800">2</span>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

</body>
</html>
