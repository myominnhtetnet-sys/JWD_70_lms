<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>LMS - Reset Password</title>

<!-- Font Awesome -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>
* {
	box-sizing: border-box;
	margin: 0;
	padding: 0;
}

body {
	font-family: Arial, Helvetica, sans-serif;
	background: #ffffff;
	width: 100%;
	min-width: 1000px;
	height: 100vh;
	overflow: hidden;
}

/* =========================
           NAVBAR
           ========================= */
.navbar {
	width: 100%;
	height: 60px;
	background: #f4e9ff;
	border-bottom: 2px solid #8e44ad;
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding-left: 60px;
	padding-right: 60px;
}

.logo {
	display: flex;
	align-items: center;
	font-size: 22px;
	font-weight: bold;
	color: #6c3483;
}

.logo-icon {
	font-size: 25px;
	margin-right: 8px;
}

.nav-links {
	display: flex;
	align-items: center;
	gap: 35px;
}

.nav-links a {
	text-decoration: none;
	color: #5b2c6f;
	font-size: 14px;
	font-weight: 500;
}

.nav-links a i {
	margin-right: 6px;
}

.nav-links a:hover {
	color: #8e44ad;
}

/* =========================
           MAIN CONTAINER
           ========================= */
.main-container {
	width: 100%;
	height: calc(100vh - 60px);
	position: relative;
	display: flex;
	justify-content: center;
	align-items: center;
}

/* =========================
           RESET PASSWORD BOX
           ========================= */
.reset-box {
	width: 420px;
	min-height: 390px;
	padding: 40px 38px 38px;
	background: #ffffff;
	border: 1px solid #eeeeee;
	border-radius: 8px;
	box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
}

/* =========================
           TITLE
           ========================= */
.reset-title {
	text-align: center;
	font-size: 24px;
	font-weight: bold;
	color: #5b2c6f;
	margin-bottom: 10px;
}

.reset-subtitle {
	text-align: center;
	font-size: 13px;
	color: #777777;
	margin-bottom: 32px;
}

/* =========================
           FORM
           ========================= */
.form-group {
	margin-bottom: 20px;
}

.form-group label {
	display: block;
	height: 20px;
	font-size: 13px;
	font-weight: bold;
	color: #555555;
	margin-bottom: 8px;
}

.form-group label i {
	color: #8e44ad;
	margin-right: 6px;
}

/* =========================
           INPUT
           ========================= */
.form-group input {
	width: 100%;
	height: 42px;
	padding-left: 12px;
	padding-right: 12px;
	border: 1px solid #cccccc;
	border-radius: 5px;
	outline: none;
	font-size: 13px;
	color: #333333;
}

.form-group input:focus {
	border-color: #8e44ad;
}

/* =========================
           RESET BUTTON
           ========================= */
.reset-button {
	width: 100%;
	height: 42px;
	margin-top: 3px;
	border: none;
	border-radius: 5px;
	background: #8e44ad;
	color: #ffffff;
	font-size: 14px;
	font-weight: bold;
	cursor: pointer;
}

.reset-button i {
	margin-right: 7px;
}

.reset-button:hover {
	background: #6c3483;
}

/* =========================
           ERROR MESSAGE
           ========================= */
.error-message {
	width: 100%;
	padding: 10px 12px;
	margin-bottom: 20px;
	background: #fdecec;
	border: 1px solid #f5b7b1;
	border-radius: 5px;
	color: #c0392b;
	font-size: 12px;
	display: flex;
	align-items: center;
}

.error-message i {
	margin-right: 7px;
}

/* =========================
           BACK TO LOGIN
           ========================= */
.back-login {
	text-align: center;
	margin-top: 18px;
}

.back-login a {
	text-decoration: none;
	color: #8e44ad;
	font-size: 12px;
	font-weight: 500;
}

.back-login a:hover {
	color: #6c3483;
	text-decoration: underline;
}

.password-box {
	position: relative;
	width: 100%;
}

/* PASSWORD INPUT */
.password-box input {
	width: 100%;
	height: 42px;
	padding-left: 12px;
	padding-right: 42px;
	border: 1px solid #cccccc;
	border-radius: 5px;
	outline: none;
	font-size: 13px;
	color: #333333;
}

.password-box input:focus {
	border-color: #8e44ad;
}

/* EYE BUTTON */
.eye-button {
	position: absolute;
	right: 0;
	top: 0;
	width: 42px;
	height: 42px;
	border: none;
	background: transparent;
	color: #777777;
	cursor: pointer;
	display: flex;
	align-items: center;
	justify-content: center;
}

.eye-button:hover {
	color: #8e44ad;
}

.eye-button i {
	font-size: 14px;
}
</style>

</head>


<body>


	<!-- =========================
         NAVBAR
         ========================= -->

	<nav class="navbar">

		<div class="logo">

			<span class="logo-icon">🎓</span> <span>LMS</span>

		</div>


		<div class="nav-links">

			<a th:href="@{/}"> <i class="fa-solid fa-house"></i> Home

			</a> <a th:href="@{/login}"> <i class="fa-solid fa-right-to-bracket"></i>

				Login

			</a>

		</div>

	</nav>



	<!-- =========================
         MAIN
         ========================= -->

	<div class="main-container">


		<!-- =========================
             RESET PASSWORD BOX
             ========================= -->

		<div class="reset-box">


			<h1 class="reset-title">Reset Password</h1>


			<p class="reset-subtitle">Enter your email and create a new
				password.</p>



			<!-- =========================
                 ERROR MESSAGE
                 ========================= -->

			<div th:if="${error != null}" class="error-message">

				<i class="fa-solid fa-circle-exclamation"></i> <span
					th:text="${error}"> Error message </span>

			</div>



			<!-- =========================
                 FORM
                 ========================= -->

			<form th:action="@{/forgot-password}" th:object="${forgotPassword}"
				method="post">


				<!-- EMAIL -->

				<div class="form-group">

					<label for="email"> <i class="fa-solid fa-envelope"></i>

						Email

					</label> <input type="email" id="email" th:field="*{email}"
						placeholder="Enter email" required>

				</div>



				<!-- NEW PASSWORD -->

				<!-- NEW PASSWORD -->
				<div class="form-group">

					<label for="newPassword"> <i class="fa-solid fa-lock"></i>
						New Password
					</label>

					<div class="password-box">

						<input type="password" id="newPassword" th:field="*{newPassword}"
							placeholder="Enter new password" required>

						<button type="button" class="eye-button"
							onclick="toggleNewPassword()">

							<i class="fa-solid fa-eye" id="newPasswordEye"></i>

						</button>

					</div>

				</div>


				<!-- CONFIRM PASSWORD -->
				<div class="form-group">

					<label for="confirmPassword"> <i class="fa-solid fa-lock"></i>
						Confirm Password
					</label>

					<div class="password-box">

						<input type="password" id="confirmPassword"
							th:field="*{confirmPassword}" placeholder="Confirm new password"
							required>

						<button type="button" class="eye-button"
							onclick="toggleConfirmPassword()">

							<i class="fa-solid fa-eye" id="confirmPasswordEye"></i>

						</button>

					</div>

				</div>



				<!-- RESET BUTTON -->

				<button type="submit" class="reset-button">

					<i class="fa-solid fa-key"></i> Reset Password

				</button>


			</form>



			<script>

    // NEW PASSWORD
    function toggleNewPassword() {

        const password = document.getElementById("newPassword");
        const icon = document.getElementById("newPasswordEye");

        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");

        } else {

            password.type = "password";

            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }


    // CONFIRM PASSWORD
    function toggleConfirmPassword() {

        const password = document.getElementById("confirmPassword");
        const icon = document.getElementById("confirmPasswordEye");

        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");

        } else {

            password.type = "password";

            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

</script>





			<div class="back-login">

				<a th:href="@{/login}"> <i class="fa-solid fa-arrow-left"></i>

					Back to Login

				</a>

			</div>


		</div>

	</div>


</body>

</html>
