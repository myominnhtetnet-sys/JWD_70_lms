<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>LMS - Forgot Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f3ff;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.10);
        }

        h2 {
            text-align: center;
            color: #6d28d9;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #7c3aed;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #7c3aed;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #7c3aed;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Forgot Password</h2>

    <div class="description">
        Enter your registered email address.
    </div>


    <!-- Error -->
    <div
        th:if="${error != null}"
        class="error"
        th:text="${error}">
    </div>


    <form
        th:action="@{/forgot-password}"
        th:object="${forgotPassword}"
        method="post">

        <label>Email Address</label>

        <input
            type="email"
            th:field="*{email}"
            placeholder="Enter your email"
            required>


        <button type="submit">
            Send Verification Code
        </button>

    </form>


    <div class="back">
        <a th:href="@{/login}">
            Back to Login
        </a>
    </div>

</div>

</body>
</html>
