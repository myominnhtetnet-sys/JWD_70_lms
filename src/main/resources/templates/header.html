<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<div th:fragment="header">

<!-- TOP HEADER BAR -->
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm transition-colors duration-200">
            <div class="px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-4">
                
                <!-- Left: Branding & Search -->
                <div class="flex items-center gap-6 flex-1 max-w-xl">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="switchRole('admin')">
                        <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-indigo-200 dark:shadow-none">
                            <i class="fa-solid font-bold text-lg">E</i>
                        </div>
                        <div>
                            <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-indigo-600 to-indigo-800 dark:from-indigo-400 dark:to-indigo-200 bg-clip-text text-transparent">EduPulse</span>
                            <span class="text-xs px-2 py-0.5 ml-1 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 font-semibold border border-indigo-200 dark:border-indigo-800/50">LMS</span>
                        </div>
                    </div>

                    <!-- Global Search -->
                    <div class="relative flex-1 hidden md:block">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input id="globalSearch" type="text" placeholder="Search courses, users, materials..." 
                            class="w-full pl-10 pr-4 py-2 text-sm bg-slate-100 dark:bg-slate-700/60 border border-transparent dark:border-slate-600 rounded-lg focus:outline-none focus:bg-white dark:focus:bg-slate-800 focus:border-indigo-500 transition-all text-slate-800 dark:text-slate-100 placeholder-slate-400">
                    </div>
                </div>

                <!-- Center: Prominent Role Switcher -->
                <div class="bg-slate-100 dark:bg-slate-700/80 p-1 rounded-xl border border-slate-200 dark:border-slate-600 flex items-center gap-1 shadow-inner">
                    <button onclick="switchRole('admin')" id="role-btn-admin" class="role-btn text-xs font-semibold px-3 sm:px-4 py-1.5 rounded-lg flex items-center gap-2 transition-all">
                        <i class="fa-solid fa-user-shield"></i>
                        <span class="hidden sm:inline">Admin</span>
                    </button>
                    <button onclick="switchRole('teacher')" id="role-btn-teacher" class="role-btn text-xs font-semibold px-3 sm:px-4 py-1.5 rounded-lg flex items-center gap-2 transition-all">
                        <i class="fa-solid fa-chalkboard-user"></i>
                        <span class="hidden sm:inline">Teacher</span>
                    </button>
                    <button onclick="switchRole('student')" id="role-btn-student" class="role-btn text-xs font-semibold px-3 sm:px-4 py-1.5 rounded-lg flex items-center gap-2 transition-all">
                        <i class="fa-solid fa-user-graduate"></i>
                        <span class="hidden sm:inline">Student</span>
                    </button>
                </div>

                <!-- Right: Utilities & User Profile -->
                <div class="flex items-center gap-3">
                    <!-- Dark Mode Toggle -->
                    <button onclick="toggleDarkMode()" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                        <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
                    </button>

                    <!-- Notifications Button -->
                    <div class="relative">
                        <button onclick="toggleNotifications()" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition relative">
                            <i class="fa-regular fa-bell text-lg"></i>
                            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-600 rounded-full ring-2 ring-white dark:ring-slate-800"></span>
                        </button>
                        <!-- Notifications Dropdown -->
                        <div id="notif-dropdown" class="hidden absolute right-0 mt-2 w-80 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 py-2 z-50 fade-in">
                            <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center">
                                <span class="font-bold text-sm">Notifications</span>
                                <span class="text-xs text-indigo-600 dark:text-indigo-400 cursor-pointer hover:underline" onclick="showToast('All marked as read')">Mark read</span>
                            </div>
                            <div class="divide-y divide-slate-100 dark:divide-slate-700 max-h-64 overflow-y-auto">
                                <div class="p-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition cursor-pointer">
                                    <p class="text-xs font-semibold text-slate-800 dark:text-slate-200">Assignment Submitted</p>
                                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Alex Morgan submitted "Physics Lab 3"</p>
                                    <span class="text-[10px] text-slate-400 mt-1 block">10 mins ago</span>
                                </div>
                                <div class="p-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition cursor-pointer">
                                    <p class="text-xs font-semibold text-slate-800 dark:text-slate-200">System Maintenance</p>
                                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Scheduled downtime tonight at 02:00 AM</p>
                                    <span class="text-[10px] text-slate-400 mt-1 block">1 hour ago</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- User Profile Dropdown -->
                    <div class="flex items-center gap-3 pl-2 border-l border-slate-200 dark:border-slate-700">
                        <img id="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=120" alt="Avatar" class="w-9 h-9 rounded-full object-cover ring-2 ring-indigo-500/30">
                        <div class="hidden lg:block text-left">
                            <div id="user-name" class="text-xs font-bold leading-tight">Sarah Jenkins</div>
                            <div id="user-role-label" class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Administrator</div>
                        </div>
                    </div>

                </div>
            </div>
        </header>


</div>

</body>
</html>
