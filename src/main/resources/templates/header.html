<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="header">

    <!-- TOP HEADER BAR (sticky top-0 ဖြင့် အမြဲတမ်း အပေါ်ဆုံးတွင် ငြိမ်နေမည်) -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm transition-colors duration-200 flex-shrink-0">
        <div class="px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-4">
            
            <!-- Left: Branding -->
            <div class="flex items-center gap-6 flex-1 max-w-xl">
                <div class="flex items-center gap-3 cursor-pointer" onclick="switchRole('admin')">
                    <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-indigo-200 dark:shadow-none">
                        <i class="fa-solid font-bold text-lg">E</i>
                    </div>
                    <div>
                        <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-indigo-600 to-indigo-800 dark:from-indigo-400 dark:to-indigo-200 bg-clip-text text-transparent">EduPulse</span>
                        <span class="text-xs px-2 py-0.5 ml-1 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 font-semibold border border-indigo-200 dark:border-indigo-800/50">LMS</span>
                    </div>
                </div>
            </div>

            <!-- Right: Notifications & Profile -->
            <div class="flex items-center gap-4">

                <!-- Notifications Button Container -->
                <div class="relative inline-block text-left">
                    <button onclick="toggleNotifications()" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition relative cursor-pointer">
                        <i class="fa-regular fa-bell text-lg"></i>
                        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-600 rounded-full ring-2 ring-white dark:ring-slate-800"></span>
                    </button>

                    <!-- Notifications Dropdown -->
                    <div id="notif-dropdown" class="hidden absolute right-0 mt-2 w-80 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 py-2 z-50 fade-in overflow-hidden">
                        <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50">
                            <span class="font-bold text-sm text-slate-900 dark:text-white">Notifications</span>
                            <span class="text-xs text-indigo-600 dark:text-indigo-400 cursor-pointer font-semibold hover:underline" onclick="showToast('All marked as read')">Mark read</span>
                        </div>
                        
                        <!-- Notifications List Container -->
                        <div id="notif-list" class="divide-y divide-slate-100 dark:divide-slate-700/60 max-h-72 overflow-y-auto">
                            <!-- Dynamic Content -->
                            <div class="p-3 text-xs text-slate-400 text-center">Loading...</div>
                        </div>
                    </div>
                </div>

                <!-- User Profile Dropdown -->
                <div class="flex items-center gap-3 pl-3 border-l border-slate-200 dark:border-slate-700">
                    <img id="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=120" alt="Avatar" class="w-9 h-9 rounded-full object-cover ring-2 ring-indigo-500/30">
                    <div class="hidden lg:block text-left">
                        <div id="user-name" class="text-xs font-bold leading-tight text-slate-900 dark:text-white">Sarah Jenkins</div>
                        <div id="user-role-label" class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Administrator</div>
                    </div>
                </div>

            </div>

        </div>
    </header>

</div>
</body>
</html>
