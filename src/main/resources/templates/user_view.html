<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>View User - LMS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4e9ff;
        }

        .page {
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #4b176b;
            margin-bottom: 25px;
        }

        .row {
            display: grid;
            grid-template-columns: 180px 1fr;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #222;
        }

        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .active {
            background: #d9f7e8;
            color: #087443;
        }

        .inactive {
            background: #eee;
            color: #666;
        }

        .suspended {
            background: #ffe2e2;
            color: #b30000;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #8e44ad;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        @media (max-width: 600px) {

            .row {
                grid-template-columns: 1fr;
                gap: 5px;
            }

        }

    </style>

</head>

<body>

<div class="page">

    <div class="container">

        <h1>User Details</h1>


        <div class="row">

            <div class="label">
                User ID
            </div>

            <div class="value"
                 th:text="${user.user_id}">
            </div>

        </div>


        <div class="row">

            <div class="label">
                Full Name
            </div>

            <div class="value"
                 th:text="${user.full_name}">
            </div>

        </div>


        <div class="row">

            <div class="label">
                Email
            </div>

            <div class="value"
                 th:text="${user.email}">
            </div>

        </div>


        <div class="row">

            <div class="label">
                Phone
            </div>

            <div class="value"
                 th:text="${user.phone != null ? user.phone : '-'}">
            </div>

        </div>


        <div class="row">

            <div class="label">
                Role
            </div>

            <div class="value"
                 th:text="${user.role_name}">
            </div>

        </div>


        <div class="row">

            <div class="label">
                Status
            </div>

            <div>

                <span class="status"
                      th:classappend="${#strings.toLowerCase(user.status)}"
                      th:text="${user.status}">
                </span>

            </div>

        </div>


        <div class="row">

            <div class="label">
                Created At
            </div>

            <div class="value"
                 th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">
            </div>

        </div>


        <div class="row">

            <div class="label">
                Updated At
            </div>

            <div class="value"
                 th:text="${user.updatedAt != null ? #temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm') : '-'}">
            </div>

        </div>


        <a th:href="@{/admin}"
           class="back-btn">
            Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
