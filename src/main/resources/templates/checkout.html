<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Payment Method</title>
    <!-- Combined CSS UI Framework Modules -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        body {
            background-color: #f8fafc !important;
            color: #1e293b;
        }
        .checkout-wrapper {
            max-width: 580px;
            width: 100%;
        }
        .payment-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 32px;
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .method-option {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .method-option:hover {
            border-color: #0d6efd;
            background-color: #f8f9fa;
        }
        .method-option:has(input:checked) {
            border-color: #0d6efd;
            background-color: #f0f7ff;
            box-shadow: 0 0 0 1px #0d6efd;
        }
        .form-control, .form-select {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14.5px;
            transition: all 0.15s ease-in-out;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
        }
        .btn-submit {
            background-color: #0d6efd;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.15s ease;
            color: #ffffff !important;
        }
        .btn-submit:hover {
            background-color: #0b5ed7;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2);
        }
        .btn-dashboard-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            transition: color 0.15s ease;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .btn-dashboard-back:hover {
            color: #1e293b;
            background-color: #e2e8f0;
        }
    </style>
</head>
<body class="bg-slate-50 antialiased">

    <!-- Outer Side-by-Side Content Matrix Row Wrapper -->
    <div class="flex min-h-screen w-full">

       <!-- Sidebar Navigation Menu (Fixed Pure-CSS Collapsible Animation) -->
        <aside class="bg-slate-900 text-slate-300 hidden md:block shrink-0 sticky top-0 h-screen border-r border-slate-800 transition-all duration-300 relative group/sidebar">
            
            <!-- 🟢 Pure CSS Toggle Checkbox Engine -->
            <input type="checkbox" id="sidebar-toggle-check" class="peer hidden" checked />
            
            <!-- 🟢 Error-Free Scoped Structural Animation Layout Adjustments -->
            <style>
                #sidebar-content-box { width: 256px; }
                .peer:not(:checked) ~ #sidebar-content-box { width: 72px; }
                .peer:not(:checked) ~ #sidebar-content-box .hidden-on-collapse { display: none !important; }
                .peer:not(:checked) ~ #sidebar-content-box nav { padding: 12px 8px !important; }
                .peer:not(:checked) ~ #sidebar-content-box nav a { justify-content: center !important; padding: 10px 0 !important; gap: 0 !important; }
                .peer:not(:checked) ~ #sidebar-content-box nav a i { margin: 0 !important; }
                .peer:not(:checked) ~ #sidebar-content-box .p-4 { padding: 12px 8px !important; }
                .peer:not(:checked) ~ #sidebar-content-box .p-4 a { justify-content: center !important; padding: 10px 0 !important; gap: 0 !important; }
                .peer:not(:checked) ~ #sidebar-content-box .p-4 a i { margin: 0 !important; }
                .peer:not(:checked) ~ #sidebar-content-box .h-16 { padding: 0 !important; justify-content: center !important; }
                .peer:not(:checked) ~ #sidebar-content-box .toggle-arrow { transform: rotate(180deg); }
                .peer:not(:checked) ~ #sidebar-content-box .bars-icon { display: flex !important; }
            </style>

            <div id="sidebar-content-box" class="flex flex-col justify-between h-full transition-all duration-300 overflow-x-hidden">
                <div>
                    <!-- Logo & Collapse Button Trigger -->
                    <div class="h-16 flex items-center px-6 border-b border-slate-800 gap-3 justify-between relative">
                        <!-- 🟢 FIXED: Centered the uncollapse bars icon perfectly inside the 72px header -->
                        <label for="sidebar-toggle-check" class="bars-icon hidden absolute inset-0 w-full h-full items-center justify-center cursor-pointer text-slate-400 hover:text-white transition-colors">
                            <i class="fa-solid fa-bars text-lg"></i>
                        </label>

                        <div class="flex items-center gap-3 hidden-on-collapse">
                            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-500 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-500/20">
                                <i class="fa-solid fa-graduation-cap text-lg"></i>
                            </div>
                            <div>
                                <span class="text-base font-bold text-white tracking-wide block leading-none">LearnHub</span>
                                <small class="text-[11px] font-medium text-slate-400">Student Portal</small>
                            </div>
                        </div>

                        <!-- Interactive Collapse Arrow Button (visible on hover) -->
                        <label for="sidebar-toggle-check" class="cursor-pointer p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-all hidden-on-collapse group-hover/sidebar:block">
                            <i class="fa-solid fa-chevron-left text-xs toggle-arrow transition-transform duration-300"></i>
                        </label>
                    </div>

                    <!-- Navigation Links -->
                    <nav class="p-4 space-y-6">
                        <div>
                            <div class="px-3 text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2 hidden-on-collapse">Learning</div>
                            <div class="space-y-1">
                                <a th:href="@{/student}"  class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition text-slate-400">
                                    <i class="fa-solid fa-border-all text-base shrink-0"></i> <span class="hidden-on-collapse whitespace-nowrap">Dashboard</span>
                                </a>
                               
                                <a th:href="@{/student/my-courses}"  class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
                                    <i class="fa-solid fa-book-open text-base shrink-0"></i> <span class="hidden-on-collapse whitespace-nowrap">My Courses</span>
                                </a>
                                
                               <a th:href="@{/student/schedule}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
                                    <i class="fa-regular fa-calendar-check text-base shrink-0"></i> <span class="hidden-on-collapse whitespace-nowrap">Schedule</span>
                                </a>
                               
                                <a th:href="@{/student/assignments}"  class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition" >
                                    <div class="flex items-center gap-3">
                                        <i class="fa-regular fa-file-lines text-base shrink-0"></i> <span class="hidden-on-collapse whitespace-nowrap">Assignments</span>
                                    </div>
                                </a>
                              
                                <a th:href="@{/student/exam-list}"   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
                                    <i class="fa-solid fa-square-check text-base shrink-0"></i> <span class="hidden-on-collapse whitespace-nowrap">My Exams</span>
                                </a>
                                <a th:href="@{/student/exam-results}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
                                    <i class="fa-solid fa-chart-simple text-base shrink-0"></i> <span class="hidden-on-collapse whitespace-nowrap">My Results</span>
                                </a>
                            </div>
                        </div>

                        <div>
                            <div class="px-3 text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2 hidden-on-collapse">Account</div>
                            <div class="space-y-1">
                            
                                <a th:href="@{/student/checkout}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-white bg-indigo-600 shadow-sm transition">
                                    <i class="fa-regular fa-credit-card text-base shrink-0"></i> <span class="hidden-on-collapse whitespace-nowrap">Payments</span>
                                </a>
                                <a th:href="@{/student/profile}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
                                    <i class="fa-regular fa-user text-base shrink-0"></i> <span class="hidden-on-collapse whitespace-nowrap">My Profile</span>
                                </a>
                            </div>
                        </div>
                    </nav>
                </div>

                <div class="p-4 border-t border-slate-800">
                    <a th:href="@{/logout}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-rose-400 hover:bg-rose-500/10 transition">
                        <i class="fa-solid fa-right-from-bracket text-base shrink-0"></i> <span class="hidden-on-collapse whitespace-nowrap">Logout</span>
                    </a>
                </div>
            </div>
        </aside>

               
        <!-- Right Side Panel Column Main Display Content -->
        <main class="flex-1 p-4 md:p-8 min-w-0 min-h-screen flex items-center justify-center bg-slate-50 overflow-y-auto">
            <div class="container-fluid max-w-4xl mx-auto w-full flex flex-col items-center">
                
                <!-- Centered Layout Wrapper Matrix -->
                <div class="checkout-wrapper w-full max-w-[540px]">
                    <!-- Premium Modular Payment Selection Container Card -->
                    <div class="payment-card">
                        <div class="mb-4 text-center sm:text-start">
                            <h3 class="h4 font-bold text-slate-900 m-0">Select Payment Method</h3>
                            <p class="text-xs text-slate-400 mt-1">Choose your preferred transaction platform to complete enrollment checkouts securely.</p>
                        </div>

                        <!-- Main Ledger Submission Form Row Layout Matrix Components -->
                        <form th:action="@{/student/checkout/submit}" method="POST" id="checkout-form">
                            <!-- Explicit Spring Security CSRF Token Payload Injection -->
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <!-- Method Option 1: KPay -->
                            <label class="method-option w-full d-flex align-items-center justify-content-between" for="method-kpay">
                                <div class="d-flex align-items-center gap-3">
                                    <input type="radio" name="paymentMethod" value="KPAY" id="method-kpay" class="form-check-input m-0" checked />
                                    <div>
                                        <div class="text-sm font-bold text-slate-900">KBZPay (KPay)</div>
                                        <div class="text-xs text-slate-400 mt-0.5">Instant transfer via mobile wallet application</div>
                                    </div>
                                </div>
                            </label>

                            <!-- Method Option 2: WavePay -->
                            <label class="method-option w-full d-flex align-items-center justify-content-between" for="method-wave">
                                <div class="d-flex align-items-center gap-3">
                                    <input type="radio" name="paymentMethod" value="WAVEPAY" id="method-wave" class="form-check-input m-0" />
                                    <div>
                                        <div class="text-sm font-bold text-slate-900">WaveMoney (WavePay)</div>
                                        <div class="text-xs text-slate-400 mt-0.5">Secure payment via Wave mobile networks</div>
                                    </div>
                                </div>
                            </label>

                            <!-- Method Option 3: CB Pay -->
                            <label class="method-option w-full d-flex align-items-center justify-content-between" for="method-cb">
                                <div class="d-flex align-items-center gap-3">
                                    <input type="radio" name="paymentMethod" value="CBPAY" id="method-cb" class="form-check-input m-0" />
                                    <div>
                                        <div class="text-sm font-bold text-slate-900">CB Pay</div>
                                        <div class="text-xs text-slate-400 mt-0.5">Direct link bank transfer channel protocols</div>
                                    </div>
                                </div>
                            </label>

                            <!-- Method Option 4: AYA Pay -->
                            <label class="method-option w-full d-flex align-items-center justify-content-between" for="method-aya">
                                <div class="d-flex align-items-center gap-3">
                                    <input type="radio" name="paymentMethod" value="AYAPAY" id="method-aya" class="form-check-input m-0" />
                                    <div>
                                        <div class="text-sm font-bold text-slate-900">AYA Pay Wallet</div>
                                        <div class="text-xs text-slate-400 mt-0.5">Quick digital banking payment gateway system</div>
                                    </div>
                                </div>
                            </label>

                            <!-- Structural Billing Metadata Row Fields Input Segment -->
                            <div class="mt-4 space-y-3 text-start">
                                <div class="form-group flex flex-col gap-1.5">
                                    <label for="transactionId" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Transaction ID / Reference Number</label>
                                    <input type="text" id="transactionId" name="transactionId" class="form-control" required placeholder="Enter the 10-20 digit tx reference code" />
                                </div>

                                <div class="form-group flex flex-col gap-1.5">
                                    <label for="phoneNumber" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Sender Mobile Number</label>
                                    <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" required placeholder="09xxxxxxxxx" />
                                </div>
                            </div>

                            <!-- Final Checkout Submission Trigger Button Action -->
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary btn-submit w-full">
                                    Confirm & Submit Tuition Receipt
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>


</body>
</html>
