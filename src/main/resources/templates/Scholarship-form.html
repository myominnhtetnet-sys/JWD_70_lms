<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${scholarship != null and scholarship.scholarshipId != null and scholarship.scholarshipId > 0} ? 'Edit Scholarship' : 'Add Scholarship'">Scholarship Form</title>
    
    <!-- Tailwind CSS Restored -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-8">

    <div class="max-w-xl mx-auto">
        
        <!-- Error Alert for Duplicate Entries or Server Errors -->
        <div th:if="${errorMessage}" class="mb-5 p-4 rounded-xl bg-red-100 text-red-800 border border-red-200 text-sm font-medium flex justify-between items-center shadow-sm">
            <span th:text="${errorMessage}">A scholarship with this name already exists.</span>
            <button type="button" onclick="this.parentElement.remove()" class="text-red-600 hover:text-red-800">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            
            <!-- Form Header -->
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-900" 
                    th:text="${scholarship != null and scholarship.scholarshipId != null and scholarship.scholarshipId > 0} ? 'Edit Scholarship' : 'Add New Scholarship'">
                    Scholarship Form
                </h2>
                <a th:href="@{/admin/scholarships/list}" class="text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </a>
            </div>

            <!-- Form Body -->
            <form th:action="@{/admin/scholarships/save}" th:object="${scholarship}" method="post" class="p-6 space-y-5">
                
                <!-- Hidden Primary Key ID Field -->
                <input type="hidden" th:field="*{scholarshipId}" />

                <!-- Scholarship Title -->
                <div>
                    <label for="title" class="block text-sm font-semibold text-slate-700 mb-1">Scholarship Name / Title</label>
                    <input type="text" id="title" th:field="*{name}" required 
                           placeholder="e.g. STEM Merit Excellence Grant"
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                </div>

                <!-- Coverage Percentage or Amount -->
                <div>
                    <label for="discountPercentage" class="block text-sm font-semibold text-slate-700 mb-1">Discount / Coverage Percentage (%)</label>
                    <input type="number" id="discountPercentage" th:field="*{discountPercentage}" step="0.01" min="0" max="100" required
                           placeholder="e.g. 50 (for 50% discount)"
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                </div>

                <!-- Description & Eligibility Requirements -->
                <div>
                    <label for="description" class="block text-sm font-semibold text-slate-700 mb-1">Description & Requirements</label>
                    <textarea id="description" th:field="*{description}" rows="3"
                              placeholder="Describe eligibility rules, target academic criteria, and coverage..."
                              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm resize-none"></textarea>
                </div>

                <!-- Status -->
                <div>
                    <label for="isActive" class="block text-sm font-semibold text-slate-700 mb-1">Status</label>
                    <select id="isActive" th:field="*{isActive}" 
                            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm bg-white">
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>

                <!-- Actions -->
                <div class="pt-4 flex items-center justify-end space-x-3 border-t border-slate-100">
                    <a th:href="@{/admin/scholarships/list}" class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-700 text-sm font-medium hover:bg-slate-50 transition">
                        Cancel
                    </a>
                    <button type="submit" class="px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition shadow-sm">
                        Save Scholarship
                    </button>
                </div>

            </form>
        </div>

    </div>

</body>
</html>
