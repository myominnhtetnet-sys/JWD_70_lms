<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LMS - User Management</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4e9ff;
            color: #333;
        }

        .navbar {
            height: 65px;
            background: white;
            border-bottom: 1px solid #ddd;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .logo {
            color: #4b176b;
            font-size: 25px;
            font-weight: bold;
        }

        .home-link {
            text-decoration: none;
            color: #4b176b;
            font-weight: bold;
        }

        .home-link i {
            margin-right: 6px;
        }

        .container {
            padding: 35px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        .page-title {
            margin: 0;
            color: #4b176b;
        }

        .add-btn {
            background: #8e44ad;
            color: white;

            text-decoration: none;

            padding: 11px 18px;

            border-radius: 7px;

            font-weight: bold;
        }

        .add-btn:hover {
            background: #732d91;
        }

        .message {
            padding: 13px 16px;

            border-radius: 6px;

            margin-bottom: 20px;

            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .table-card {
            background: white;

            border-radius: 10px;

            padding: 20px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);

            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #8e44ad;
            color: white;

            padding: 13px;

            text-align: left;
        }

        td {
            padding: 13px;

            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #faf5ff;
        }

        .role {
            font-weight: bold;
            color: #4b176b;
        }

        .status {
            display: inline-block;

            padding: 6px 11px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;
        }

        .active {
            background: #d4edda;
            color: #155724;
        }

        .suspended {
            background: #f8d7da;
            color: #721c24;
        }

        .inactive {
            background: #fff3cd;
            color: #856404;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            border: none;

            padding: 7px 10px;

            border-radius: 5px;

            cursor: pointer;

            text-decoration: none;

            font-size: 13px;
        }

        .edit-btn {
            background: #3498db;
            color: white;
        }

        .edit-btn:hover {
            background: #2980b9;
        }

        .suspend-btn {
            background: #e74c3c;
            color: white;
        }

        .suspend-btn:hover {
            background: #c0392b;
        }

        .activate-btn {
            background: #27ae60;
            color: white;
        }

        .activate-btn:hover {
            background: #219150;
        }

        .empty {
            text-align: center;

            padding: 35px;

            color: #777;
        }

        @media (max-width: 700px) {

            .container {
                padding: 20px;
            }

            .page-header {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

        }

    </style>

</head>

<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<div class="navbar">

    <div class="logo">
        LMS
    </div>

    <a th:href="@{/admin}"
       class="home-link">

        <i class="fa-solid fa-house"></i>

        Home

    </a>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="container">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <h2 class="page-title">

            <i class="fa-solid fa-users"></i>

            User Management

        </h2>


        <a th:href="@{/admin/users/add}"
           class="add-btn">

            <i class="fa-solid fa-user-plus"></i>

            Add User

        </a>

    </div>


    <!-- SUCCESS -->

    <div th:if="${success}"
         class="message success">

        <i class="fa-solid fa-circle-check"></i>

        <span th:text="${success}">
            Success
        </span>

    </div>


    <!-- ERROR -->

    <div th:if="${error}"
         class="message error">

        <i class="fa-solid fa-circle-exclamation"></i>

        <span th:text="${error}">
            Error
        </span>

    </div>


    <!-- =====================================================
         TABLE
    ===================================================== -->

    <div class="table-card">

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Full Name</th>

                <th>Email</th>

                <th>Phone</th>

                <th>Role</th>

                <th>Status</th>

                <th>Actions</th>

            </tr>

            </thead>


            <tbody>


            <!-- USERS -->

            <tr th:each="user : ${users}">


                <td th:text="${user.user_id}">
                    1
                </td>


                <td th:text="${user.full_name}">
                    Aung Aung
                </td>


                <td th:text="${user.email}">
                    admin@gmail.com
                </td>


                <td th:text="${user.phone}">
                    09xxxxxxxx
                </td>


                <td class="role"
                    th:text="${user.role_name}">
                    ADMIN
                </td>


                <td>

                    <span class="status"
                          th:classappend="${user.status == 'ACTIVE'}
                              ? ' active'
                              : (${user.status == 'SUSPENDED'}
                                  ? ' suspended'
                                  : ' inactive')"
                          th:text="${user.status}">

                        ACTIVE

                    </span>

                </td>


                <td>

                    <div class="actions">


                        <!-- EDIT -->

                        <a th:href="@{/admin/users/edit/{id}(id=${user.user_id})}"
                           class="action-btn edit-btn"
                           title="Edit">

                            <i class="fa-solid fa-pen"></i>

                        </a>


                        <!-- SUSPEND -->

                        <form th:if="${user.status == 'ACTIVE'
                                      and user.roleName != 'ADMIN'}"
                              th:action="@{/admin/users/suspend/{id}(id=${user.user_id})}"
                              method="post">

                            <button type="submit"
                                    class="action-btn suspend-btn"
                                    title="Suspend"
                                    onclick="return confirm('Are you sure you want to suspend this user?');">

                                <i class="fa-solid fa-user-slash"></i>

                            </button>

                        </form>


                        <!-- ACTIVATE -->

                        <form th:if="${user.status == 'SUSPENDED'}"
                              th:action="@{/admin/users/activate/{id}(id=${user.user_id})}"
                              method="post">

                            <button type="submit"
                                    class="action-btn activate-btn"
                                    title="Activate"
                                    onclick="return confirm('Activate this user?');">

                                <i class="fa-solid fa-user-check"></i>

                            </button>

                        </form>


                    </div>

                </td>


            </tr>


            <!-- NO DATA -->

            <tr th:if="${#lists.isEmpty(users)}">

                <td colspan="7"
                    class="empty">

                    <i class="fa-solid fa-users-slash"></i>

                    <p>
                        No users found.
                    </p>

                </td>

            </tr>


            </tbody>

        </table>

    </div>

</div>

</body>

</html>
