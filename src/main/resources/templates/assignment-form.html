<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment Form - Teacher Portal</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.03); }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
</style>
</head>

            <!-- MAIN CONTENT AREA -->
            <main class="flex-1 min-w-0 px-6 py-6 bg-slate-50 overflow-y-auto">
                <div class="max-w-4xl mx-auto space-y-6">

                    <!-- Header -->
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
                        <h1 class="text-xl font-bold text-slate-900" th:text="${assignment.assignmentId == null ? 'Create Assignment' : 'Edit Assignment'}">Assignment Form</h1>
                        <p class="text-xs text-slate-600 mt-1">Manage assignment information and submission settings.</p>
                    </div>

                    <!-- Error Box -->
                    <div th:if="${errorMessage}" class="p-3 bg-rose-50 border border-rose-200 text-rose-800 text-xs font-bold rounded-xl" th:text="${errorMessage}"></div>

                    <!-- Form Card -->
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
                        <form th:object="${assignment}" th:action="${assignment.assignmentId == null ? '/teacher/assignments/save' : '/teacher/assignments/update'}" method="post" enctype="multipart/form-data" class="space-y-6">
                            
                            <input type="hidden" th:field="*{assignmentId}">

                            <!-- Basic Information -->
                            <div>
                                <h3 class="text-xs font-bold uppercase text-slate-700 mb-3 tracking-wider">Basic Information</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Batch</label>
                                        <select th:field="*{batchId}" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                                            <option value="">-- Select Batch --</option>
                                            <option th:each="batch : ${batches}" th:value="${batch['batch_id']}" th:text="${batch['title']}"></option>
                                        </select>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Lesson</label>
                                        <select th:field="*{lessonId}" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                                            <option value="">-- Select Lesson --</option>
                                            <option th:each="lesson : ${lessons}" th:value="${lesson.lessonId}" th:text="${lesson.title}"></option>
                                        </select>
                                    </div>

                                    <div class="sm:col-span-2">
                                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Assignment Title</label>
                                        <input type="text" th:field="*{title}" placeholder="Enter assignment title" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500">
                                    </div>

                                    <div class="sm:col-span-2">
                                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Description</label>
                                        <textarea th:field="*{description}" rows="4" placeholder="Enter assignment description" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium resize-none focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
                                    </div>

                                    <div class="sm:col-span-2">
                                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Attachment</label>
                                        <input type="file" name="attachmentFile" accept=".pdf,.zip,.doc,.docx" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer">
                                        <small class="text-slate-500 text-xs block mt-1">Allowed file types: PDF, ZIP, DOC, DOCX</small>
                                        <div th:if="${assignment.attachment != null and !assignment.attachment.isEmpty()}" class="mt-2 text-xs">
                                            <strong>Current File:</strong>
                                            <a th:href="@{${assignment.attachment}}" th:text="${assignment.attachment}" target="_blank" class="text-teal-600 hover:underline font-semibold ml-1"></a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Assignment Schedule -->
                            <div>
                                <h3 class="text-xs font-bold uppercase text-slate-700 mb-3 tracking-wider">Assignment Schedule</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Start At</label>
                                        <input type="datetime-local" th:field="*{startAt}" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500">
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Due At</label>
                                        <input type="datetime-local" th:field="*{dueAt}" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500">
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Late Deadline</label>
                                        <input type="datetime-local" name="lateDeadline" th:value="${assignment.lateDeadline}" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500">
                                    </div>

                                    <div class="flex items-center gap-2 pt-6">
                                        <input type="hidden" name="allowLateSubmit" value="false">
                                        <input type="checkbox" name="allowLateSubmit" value="true" th:checked="${assignment.allowLateSubmit}" class="w-4 h-4 text-teal-600 focus:ring-teal-500 rounded cursor-pointer">
                                        <label class="text-xs font-bold text-slate-700 cursor-pointer">Allow Late Submit</label>
                                    </div>
                                </div>
                            </div>

                            <!-- Marking & Status -->
                            <div>
                                <h3 class="text-xs font-bold uppercase text-slate-700 mb-3 tracking-wider">Marking &amp; Status</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Total Mark</label>
                                        <input type="number" step="0.01" min="0" th:field="*{totalMark}" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500">
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Pass Mark</label>
                                        <input type="number" step="0.01" min="0" th:field="*{passMark}" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500">
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Status</label>
                                        <select th:field="*{status}" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                                            <option value="DRAFT">DRAFT</option>
                                            <option value="PUBLISHED">PUBLISHED</option>
                                            <option value="CLOSED">CLOSED</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Created By</label>
                                        <input type="number" th:field="*{createdBy}" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500">
                                    </div>
                                </div>
                            </div>

                            <!-- Form Actions -->
                            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
                                <a th:href="@{/teacher/assignments}" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl text-xs font-bold transition">Cancel</a>
                                <button type="submit" class="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold transition shadow-xs" th:text="${assignment.assignmentId == null ? 'Save Assignment' : 'Update Assignment'}">Save Assignment</button>
                            </div>

                        </form>
                    </div>

                </div>
            </main>
        </div>
    </div>
</body>
</html>
