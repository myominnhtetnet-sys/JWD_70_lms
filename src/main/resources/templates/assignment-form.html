<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assignment Form - Teacher Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet"  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {box-sizing: border-box;}

        body {font-family: 'Inter', sans-serif;margin: 0;}

        *::-webkit-scrollbar {width: 5px; height: 5px;}

        *::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.03);}

        *::-webkit-scrollbar-thumb {background: rgba(0, 0, 0, 0.15);border-radius: 3px;}

        input,select,textarea, button {font-family: inherit;}
    </style>
</head>

<body class="bg-slate-50">

    <!-- MAIN CONTENT -->
    <main class="flex-1 min-w-0 px-2 py-2 bg-slate-50 overflow-y-auto">

        <div class="max-w-xl mx-auto space-y-2">

            <!-- Header -->
            <div class="bg-white border border-slate-200 rounded-lg p-2.5 shadow-sm">
                <h1 class="text-sm font-bold text-slate-900"
                    th:text="${assignment.assignmentId == null ? 'Create Assignment' : 'Edit Assignment'}">
                    Assignment Form
                </h1>

                <p class="text-[10px] text-slate-500 mt-1">Manage assignment information and submission settings.</p>
            </div>

            <!-- Error Message -->
            <div th:if="${errorMessage}" class="p-2 bg-rose-50 border border-rose-200 text-rose-800 text-[11px] font-semibold rounded-md"
                 th:text="${errorMessage}">
            </div>

            <!-- Form Card -->
            <div class="bg-white border border-slate-200 rounded-lg p-2.5 shadow-sm">

                <form th:object="${assignment}" th:action="${assignment.assignmentId == null ? '/teacher/assignments/save' : '/teacher/assignments/update'}"
                      method="post" enctype="multipart/form-data" class="space-y-2.5">

                    <input type="hidden" th:field="*{assignmentId}">

                    <section>
                        <h3 class="text-[10px] font-bold uppercase text-slate-700 mb-1.5 tracking-wide">
                            Basic Information
                        </h3>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">

                            <!-- Batch -->
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-600 mb-0.5">
                                    Batch
                                </label>

                                <select th:field="*{batchId}" required class="w-full border border-slate-300 rounded-md px-2 py-1 text-[11px] bg-white focus:outline-none focus:ring-1 focus:ring-teal-500">
                                    <option value="">-- Select Batch --</option>
                                    <option th:each="batch : ${batches}" th:value="${batch['batch_id']}" th:text="${batch['title']}"> </option>
                                </select>
                            </div>

                            <!-- Lesson -->
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-600 mb-0.5">
                                    Lesson </label>

                                <select th:field="*{lessonId}" required class="w-full border border-slate-300 rounded-md px-2 py-1 text-[11px] bg-white focus:outline-none focus:ring-1 focus:ring-teal-500">
                                    <option value="">-- Select Lesson --</option>

                                    <option th:each="lesson : ${lessons}" th:value="${lesson.lessonId}" th:text="${lesson.title}">
                                    </option>
                                </select>
                            </div>

                            <!-- Assignment Title -->
                            <div class="sm:col-span-2">
                                <label class="block text-[10px] font-semibold text-slate-600 mb-0.5">
                                    Assignment Title </label>

                                <input type="text" th:field="*{title}" placeholder="Enter assignment title" required
                                       class="w-full border border-slate-300 rounded-md px-2 py-1 text-[11px] focus:outline-none focus:ring-1 focus:ring-teal-500">
                            </div>

                            <!-- Description -->
                            <div class="sm:col-span-2">
                                <label class="block text-[10px] font-semibold text-slate-600 mb-0.5">
                                    Description
                                </label>

                                <textarea th:field="*{description}" rows="2" placeholder="Enter assignment description"
                                          class="w-full border border-slate-300 rounded-md px-2 py-1 text-[11px] resize-y focus:outline-none focus:ring-1 focus:ring-teal-500"></textarea>
                            </div>

                            <!-- Attachment -->
                            <div class="sm:col-span-2">
                                <label class="block text-[10px] font-semibold text-slate-600 mb-0.5">
                                    Attachment
                                </label>

                                <input type="file" name="attachmentFile" accept=".pdf,.zip,.doc,.docx"
                                       class="w-full text-[10px] text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-[10px] file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer">

                                <small class="text-slate-500 text-[9px] block mt-0.5">
                                    Allowed file types: PDF, ZIP, DOC, DOCX
                                </small>

                                <div th:if="${assignment.attachment != null and !assignment.attachment.isEmpty()}"
                                     class="mt-1 text-[10px]">
                                    <strong>Current File:</strong>

                                    <a th:href="@{${assignment.attachment}}"
                                       th:text="${assignment.attachment}"
                                       target="_blank"
                                       class="text-teal-600 hover:underline font-semibold ml-1">
                                    </a>
                                </div>
                            </div>

                        </div>
                    </section>

                    <!-- Assignment Schedule -->
                    <section>
                        <h3 class="text-[10px] font-bold uppercase text-slate-700 mb-1.5 tracking-wide">
                            Assignment Schedule
                        </h3>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">

                            <!-- Start At -->
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-600 mb-0.5">
                                    Start At
                                </label>

                                <input type="datetime-local"
                                       th:field="*{startAt}"
                                       required
                                       class="w-full border border-slate-300 rounded-md px-2 py-1 text-[10px] focus:outline-none focus:ring-1 focus:ring-teal-500">
                            </div>

                            <!-- Due At -->
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-600 mb-0.5">
                                    Due At
                                </label>

                                <input type="datetime-local"
                                       th:field="*{dueAt}"
                                       required
                                       class="w-full border border-slate-300 rounded-md px-2 py-1 text-[10px] focus:outline-none focus:ring-1 focus:ring-teal-500">
                            </div>

                            <!-- Late Deadline -->
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-600 mb-0.5">
                                    Late Deadline
                                </label>

                                <input type="datetime-local"
                                       name="lateDeadline"
                                       th:value="${assignment.lateDeadline}"
                                       class="w-full border border-slate-300 rounded-md px-2 py-1 text-[10px] focus:outline-none focus:ring-1 focus:ring-teal-500">
                            </div>

                            <!-- Allow Late Submit -->
                            <div class="flex items-center gap-1.5 sm:pt-3">
                                <input type="hidden"
                                       name="allowLateSubmit"
                                       value="false">

                                <input type="checkbox"
                                       id="allowLateSubmit"
                                       name="allowLateSubmit"
                                       value="true"
                                       th:checked="${assignment.allowLateSubmit}"
                                       class="w-3 h-3 text-teal-600 focus:ring-teal-500 rounded cursor-pointer">

                                <label for="allowLateSubmit"
                                       class="text-[10px] font-semibold text-slate-700 cursor-pointer">
                                    Allow Late Submit
                                </label>
                            </div>

                        </div>
                    </section>

                    <!-- Marking & Status -->
                    <section>
                        <h3 class="text-[10px] font-bold uppercase text-slate-700 mb-1.5 tracking-wide">
                            Marking &amp; Status
                        </h3>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">

                            <!-- Total Mark -->
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-600 mb-0.5">
                                    Total Mark
                                </label>

                                <input type="number"
                                       step="0.01"
                                       min="0"
                                       th:field="*{totalMark}"
                                       required
                                       class="w-full border border-slate-300 rounded-md px-2 py-1 text-[11px] focus:outline-none focus:ring-1 focus:ring-teal-500">
                            </div>

                            <!-- Pass Mark -->
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-600 mb-0.5">
                                    Pass Mark
                                </label>

                                <input type="number"
                                       step="0.01"
                                       min="0"
                                       th:field="*{passMark}"
                                       required
                                       class="w-full border border-slate-300 rounded-md px-2 py-1 text-[11px] focus:outline-none focus:ring-1 focus:ring-teal-500">
                            </div>

                            <!-- Status -->
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-600 mb-0.5">
                                    Status
                                </label>

                                <select th:field="*{status}"
                                        class="w-full border border-slate-300 rounded-md px-2 py-1 text-[11px] bg-white focus:outline-none focus:ring-1 focus:ring-teal-500">
                                    <option value="DRAFT">DRAFT</option>
                                    <option value="PUBLISHED">PUBLISHED</option>
                                    <option value="CLOSED">CLOSED</option>
                                </select>
                            </div>

                            <!-- Created By -->
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-600 mb-0.5">
                                    Created By
                                </label>

                                <input type="number"
                                       th:field="*{createdBy}"
                                       required
                                       class="w-full border border-slate-300 rounded-md px-2 py-1 text-[11px] focus:outline-none focus:ring-1 focus:ring-teal-500">
                            </div>

                        </div>
                    </section>

                    <!-- Form Actions -->
                    <div class="flex items-center justify-end gap-1.5 pt-2 border-t border-slate-200">

                        <a th:href="@{/teacher/assignments}"
                           class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-[10px] font-semibold transition">
                            Cancel
                        </a>

                        <button type="submit"
                                class="px-2.5 py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded-md text-[10px] font-semibold transition shadow-sm"
                                th:text="${assignment.assignmentId == null ? 'Save Assignment' : 'Update Assignment'}">
                            Save Assignment
                        </button>

                    </div>

                </form>
            </div>

        </div>
    </main>

</body>
</html>
