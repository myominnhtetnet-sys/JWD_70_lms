<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{head :: head}"></head>
<body class="bg-gray-100 text-gray-800 font-sans">

 <div id="app" class="min-h-screen flex flex-col">
        
        <!-- TOP HEADER BAR -->
        <div th:replace="~{header :: header}"></div>

        <!-- MAIN APP CONTENT AREA (Sidebar + Dynamic View) -->
        <div class="flex-1 flex overflow-hidden">
            
            <!-- DYNAMIC SIDEBAR -->
            <div th:replace="~{nav :: nav}"></div>

    <div class="max-w-7xl mx-auto p-6 w-full">
        
        <!-- Page Header & Batch Overview -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
            
            <!-- 🌟 Batch Dropdown Selection Bar -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-gray-100 pb-4 mb-4">
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <div>
                        <label for="batchSelector" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Select Batch</label>
                        <select id="batchSelector" onchange="changeBatch(this.value)" class="border border-gray-300 rounded-lg px-3 py-2 bg-white text-sm font-semibold text-gray-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                            <!-- Database မှလာသော batches စာရင်းကို loop ပတ်ပြသခြင်း -->
                            <th:block th:each="b : ${batches}">
                                <option th:value="${b.batchId}" 
                                        th:text="${b.batchCode + ' - ' + b.title}" 
                                        th:selected="${b.batchId == batchId}">
                                </option>
                            </th:block>
                        </select>
                    </div>
                </div>

                <div class="flex flex-wrap gap-2">
                    <button onclick="openModal('announcementModal')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition shadow-sm cursor-pointer">
                        <i class="fa-solid fa-bullhorn"></i> New Announcement
                    </button>
                    <button onclick="openModal('sessionModal')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition shadow-sm cursor-pointer">
                        <i class="fa-solid fa-calendar-plus"></i> Add Session
                    </button>
                </div>
            </div>

            <!-- Navigation Tabs with Thymeleaf dynamic active styles -->
            <div class="flex border-b border-gray-200 text-sm font-medium gap-1 overflow-x-auto">
                
                <!-- 1. Students Tab Link -->
                <a th:href="@{/admin/batches/{id}/students(id=${batchId})}"
                   th:classappend="${activeTab == 'students'} ? 'border-indigo-600 text-indigo-600 font-semibold' : 'border-transparent text-gray-500 hover:text-gray-700'"
                   class="tab-btn px-4 py-3 border-b-2 flex items-center gap-2 transition cursor-pointer whitespace-nowrap">
                    <i class="fa-solid fa-users text-sm"></i>
                    <span>Students</span>
                </a>

                <!-- 2. Class Sessions Tab Link -->
                <a th:href="@{/admin/batches/{id}/sessions(id=${batchId})}"
                   th:classappend="${activeTab == 'sessions'} ? 'border-indigo-600 text-indigo-600 font-semibold' : 'border-transparent text-gray-500 hover:text-gray-700'"
                   class="tab-btn px-4 py-3 border-b-2 flex items-center gap-2 transition cursor-pointer whitespace-nowrap">
                    <i class="fa-solid fa-chalkboard-user text-sm"></i>
                    <span>Class Sessions</span>
                </a>

                <!-- 3. Progress Tab Link -->
                <a th:href="@{/admin/batches/{id}/progress(id=${batchId})}"
                   th:classappend="${activeTab == 'progress'} ? 'border-indigo-600 text-indigo-600 font-semibold' : 'border-transparent text-gray-500 hover:text-gray-700'"
                   class="tab-btn px-4 py-3 border-b-2 flex items-center gap-2 transition cursor-pointer whitespace-nowrap">
                    <i class="fa-solid fa-chart-line text-sm"></i>
                    <span>Progress</span>
                </a>

                <!-- 4. Announcements Tab Link -->
                <a th:href="@{/admin/batches/{id}/announcements(id=${batchId})}"
                   th:classappend="${activeTab == 'announcements'} ? 'border-indigo-600 text-indigo-600 font-semibold' : 'border-transparent text-gray-500 hover:text-gray-700'"
                   class="tab-btn px-4 py-3 border-b-2 flex items-center gap-2 transition cursor-pointer whitespace-nowrap">
                    <i class="fa-solid fa-bullhorn text-sm"></i>
                    <span>Announcements</span>
                </a>

            </div>
        </div>

        <!-- Dynamic Content Body with Search & Export Toolbar -->
        <div class="bg-white rounded-lg shadow-sm p-6">
            
            <!-- 🌟 Search Bar & Export Report Button Toolbar -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                <div class="w-full sm:w-80 relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="tableSearchInput" onkeyup="filterTable()" placeholder="Search in table..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="w-full sm:w-auto flex justify-end">
                    <button onclick="exportTableToCSV()" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition shadow-sm cursor-pointer">
                        <i class="fa-solid fa-file-excel text-emerald-400"></i> Export Report (CSV)
                    </button>
                </div>
            </div>

            <div id="tabContentArea">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr id="dynamicTableHeader" class="bg-gray-50 border-b text-xs text-gray-500 uppercase tracking-wider">
                                <!-- Headers injected dynamically by JS -->
                            </tr>
                        </thead>
                        <tbody id="dynamicTableBody" class="divide-y text-sm">
                            <tr>
                                <td colspan="5" class="text-center p-6 text-gray-400">
                                    <i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading data from database...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <!-- Add Session Modal -->
    <div id="sessionModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg w-full max-w-md p-6 shadow-lg">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Add Class Session</h3>
            <form id="sessionForm" onsubmit="submitSession(event)">
                
                <div class="mb-3">
                    <label class="block text-xs font-semibold mb-1">Select Lesson</label>
                    <select id="sessionLessonId" required class="w-full border rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="">-- Choose Lesson --</option>
                        <th:block th:each="l : ${lessons}">
                            <option th:value="${l.lessonId}" th:text="${l.title}"></option>
                        </th:block>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="block text-xs font-semibold mb-1">Session Title</label>
                    <input type="text" id="sessionTitle" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-xs font-semibold mb-1">Start At</label>
                        <input type="datetime-local" id="sessionStart" required class="w-full border rounded-lg p-2 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">End At</label>
                        <input type="datetime-local" id="sessionEnd" required class="w-full border rounded-lg p-2 text-sm outline-none">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold mb-1">Meeting URL</label>
                    <input type="url" id="sessionUrl" placeholder="https://zoom.us/j/..." class="w-full border rounded-lg p-2 text-sm outline-none">
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeModal('sessionModal')" class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 cursor-pointer">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm text-white bg-emerald-600 rounded-lg hover:bg-emerald-700 cursor-pointer">Save Session</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Create Announcement Modal -->
    <div id="announcementModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg w-full max-w-md p-6 shadow-lg">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Post Announcement</h3>
            <form id="announcementForm" onsubmit="submitAnnouncement(event)">
                <div class="mb-3">
                    <label class="block text-xs font-semibold mb-1">Title</label>
                    <input type="text" id="announceTitle" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold mb-1">Message Body</label>
                    <textarea id="announceBody" rows="4" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeModal('announcementModal')" class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 cursor-pointer">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 cursor-pointer">Publish</button>
                </div>
            </form>
        </div>
    </div>
    </div>
</div>

    <!-- JavaScript Data Fetching & Utilities -->
    <script th:inline="javascript">
        /* Extract Thymeleaf Variables from Controller Model */
        const BATCH_ID = /*[[${batchId}]]*/ 1;
        const ACTIVE_TAB = /*[[${activeTab}]]*/ 'students';

        document.addEventListener('DOMContentLoaded', () => {
            loadTabData(ACTIVE_TAB);
        });

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        /**
         * Dropdown မှ Batch ပြောင်းလိုက်သောအခါ အလုပ်လုပ်မည့် Function
         */
        function changeBatch(selectedBatchId) {
            const currentPath = window.location.pathname; 
            const pathParts = currentPath.split('/');
            const currentTab = pathParts[pathParts.length - 1] || 'students'; 
            
            window.location.href = `/admin/batches/${selectedBatchId}/${currentTab}`;
        }

        /**
         * Safe Date Formatter
         */
        function safeFormatDate(dateVal) {
            if (!dateVal) return '-';

            if (Array.isArray(dateVal)) {
                const [year, month, day, hour = 0, minute = 0] = dateVal;
                const d = new Date(year, month - 1, day, hour, minute);
                return isNaN(d.getTime()) ? '-' : d.toLocaleString();
            }

            let d = new Date(dateVal);
            if (isNaN(d.getTime())) {
                d = new Date(String(dateVal).replace(' ', 'T'));
            }

            return isNaN(d.getTime()) ? '-' : d.toLocaleString();
        }

        /**
         * 🌟 Table Search / Filter Function
         */
        function filterTable() {
            const searchText = document.getElementById('tableSearchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#dynamicTableBody tr');

            rows.forEach(row => {
                const rowText = row.textContent.toLowerCase();
                if (rowText.includes(searchText)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        /**
         * 🌟 Export Report to CSV Function
         */
        function exportTableToCSV() {
            const rows = document.querySelectorAll('#tabContentArea table tr');
            let csv = [];

            rows.forEach(row => {
                let cols = row.querySelectorAll("td, th");
                let rowData = [];
                cols.forEach(col => {
                    let text = col.innerText.replace(/"/g, '""').trim();
                    rowData.push('"' + text + '"');
                });
                if (rowData.length > 0) {
                    csv.push(rowData.join(","));
                }
            });

            let csvFile = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
            let downloadLink = document.createElement("a");
            downloadLink.download = `Batch_${BATCH_ID}_${ACTIVE_TAB}_Report.csv`;
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        async function loadTabData(tab) {
            const thead = document.getElementById('dynamicTableHeader');
            const tbody = document.getElementById('dynamicTableBody');

            try {
                const response = await fetch(`/admin/batches/${BATCH_ID}/api/${tab}`);
                const data = await response.json();

                if (tab === 'students') {
                    thead.innerHTML = `
                        <th class="p-4">Student Name</th>
                        <th class="p-4">Email</th>
                        <th class="p-4">Enrolled Date</th>
                        <th class="p-4">Payment Status</th>
                        <th class="p-4">Status</th>`;
                    
                    tbody.innerHTML = data.length === 0 
                        ? '<tr><td colspan="5" class="p-6 text-center text-gray-400">No enrolled students found.</td></tr>' 
                        : data.map(s => `
                            <tr class="hover:bg-gray-50 transition">
                                <td class="p-4 font-semibold text-gray-900">${s.fullName || '-'}</td>
                                <td class="p-4 text-gray-600">${s.email || '-'}</td>
                                <td class="p-4 text-gray-500">${safeFormatDate(s.enrolledAt)}</td>
                                <td class="p-4"><span class="px-2.5 py-1 text-xs rounded-full font-semibold ${s.paymentStatus === 'PAID' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${s.paymentStatus || 'PENDING'}</span></td>
                                <td class="p-4"><span class="px-2.5 py-1 text-xs rounded-full bg-blue-100 text-blue-700 font-semibold">${s.enrollmentStatus || 'ACTIVE'}</span></td>
                            </tr>
                        `).join('');

                } else if (tab === 'sessions') {
                    thead.innerHTML = `
                        <th class="p-4">Session Title</th>
                        <th class="p-4">Start At</th>
                        <th class="p-4">End At</th>
                        <th class="p-4">Meeting Link</th>
                        <th class="p-4">Status</th>`;

                    tbody.innerHTML = data.length === 0 
                        ? '<tr><td colspan="5" class="p-6 text-center text-gray-400">No class sessions scheduled.</td></tr>' 
                        : data.map(s => `
                            <tr class="hover:bg-gray-50 transition">
                                <td class="p-4 font-semibold text-gray-900">${s.title || '-'}</td>
                                <td class="p-4 text-gray-600">${safeFormatDate(s.startAt)}</td>
                                <td class="p-4 text-gray-600">${safeFormatDate(s.endAt)}</td>
                                <td class="p-4">${s.meetingUrl ? `<a href="${s.meetingUrl}" target="_blank" class="text-indigo-600 hover:underline flex items-center gap-1 font-medium"><i class="fa-solid fa-video text-xs"></i> Join Link</a>` : '-'}</td>
                                <td class="p-4"><span class="px-2.5 py-1 text-xs rounded-full bg-gray-100 text-gray-700 font-semibold">${s.status || 'SCHEDULED'}</span></td>
                            </tr>
                        `).join('');

                } else if (tab === 'progress') {
                    thead.innerHTML = `
                        <th class="p-4">Student Name</th>
                        <th class="p-4">Completed Lessons</th>
                        <th class="p-4">Total Lessons</th>
                        <th class="p-4">Progress Rate</th>`;

                    tbody.innerHTML = data.length === 0 
                        ? '<tr><td colspan="4" class="p-6 text-center text-gray-400">No progress records found.</td></tr>' 
                        : data.map(p => {
                            const percent = p.overallProgressPercent || 0;
                            return `
                            <tr class="hover:bg-gray-50 transition">
                                <td class="p-4 font-semibold text-gray-900">${p.studentName || '-'}</td>
                                <td class="p-4 text-gray-600 font-medium">${p.completedLessons ?? 0}</td>
                                <td class="p-4 text-gray-600 font-medium">${p.totalLessons ?? 0}</td>
                                <td class="p-4">
                                    <div class="flex items-center gap-3">
                                        <div class="w-48 bg-gray-200 rounded-full h-2 overflow-hidden">
                                            <div class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: ${percent}%"></div>
                                        </div>
                                        <span class="text-xs font-bold text-indigo-600">${percent.toFixed(0)}%</span>
                                    </div>
                                </td>
                            </tr>
                        `}).join('');

                } else if (tab === 'announcements') {
                    thead.innerHTML = `<th class="p-4" colspan="2">Announcements List</th>`;

                    tbody.innerHTML = data.length === 0 
                        ? '<tr><td colspan="2" class="p-6 text-center text-gray-400">No announcements posted.</td></tr>' 
                        : data.map(a => `
                            <tr class="hover:bg-gray-50 transition">
                                <td class="p-5" colspan="2">
                                    <div class="flex justify-between items-start mb-2">
                                        <h4 class="font-bold text-gray-900 text-base">${a.title || '-'}</h4>
                                        <span class="text-xs text-gray-400 font-medium">${safeFormatDate(a.publishedAt)}</span>
                                    </div>
                                    <p class="text-sm text-gray-600 mb-3 leading-relaxed">${a.body || ''}</p>
                                    <div class="flex items-center gap-1 text-xs text-indigo-600 font-semibold">
                                        <i class="fa-solid fa-user-circle"></i>
                                        <span>Posted by: ${a.postedByName || 'Admin'}</span>
                                    </div>
                                </td>
                            </tr>
                        `).join('');
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-red-500">Failed to load data from server.</td></tr>';
                console.error("Error fetching tab data:", error);
            }
        }

        async function submitSession(e) {
            e.preventDefault();

            const rawStart = document.getElementById('sessionStart').value;
            const rawEnd = document.getElementById('sessionEnd').value;

            const formattedStart = rawStart ? (rawStart.length === 16 ? rawStart + ":00" : rawStart) : null;
            const formattedEnd = rawEnd ? (rawEnd.length === 16 ? rawEnd + ":00" : rawEnd) : null;

            const payload = {
                batchId: BATCH_ID,
                lessonId: document.getElementById('sessionLessonId').value ? Number(document.getElementById('sessionLessonId').value) : null,
                title: document.getElementById('sessionTitle').value,
                startAt: formattedStart,
                endAt: formattedEnd,
                meetingUrl: document.getElementById('sessionUrl').value,
                status: 'SCHEDULED'
            };

            try {
                const res = await fetch(`/admin/batches/${BATCH_ID}/api/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeModal('sessionModal');
                    document.getElementById('sessionForm').reset();
                    loadTabData(ACTIVE_TAB);
                } else {
                    alert('Failed to save session. Please check your inputs.');
                }
            } catch (err) {
                console.error("Error saving session:", err);
            }
        }

        async function submitAnnouncement(e) {
            e.preventDefault();
            const payload = {
                batchId: BATCH_ID,
                title: document.getElementById('announceTitle').value,
                body: document.getElementById('announceBody').value,
                postedBy: 1
            };

            try {
                const res = await fetch(`/api/announcements`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeModal('announcementModal');
                    document.getElementById('announcementForm').reset();
                    loadTabData(ACTIVE_TAB);
                }
            } catch (err) {
                console.error("Error posting announcement:", err);
            }
        }
    </script>
</body>
</html>
