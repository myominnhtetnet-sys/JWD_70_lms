<!DOCTYPE html>
<html>
<div th:replace="~{head :: head}"></div>
<body>

<div th:replace="~{header :: header}"></div>

<div class="flex-1 flex overflow-hidden">

<div th:replace="~{nav :: nav}"></div>
<div class="space-y-4">
    <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-5 shadow-lg backdrop-blur-sm">
        
        <!-- Header Section -->
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-700/50">
            <div>
                <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-indigo-400"></i> Course Management
                </h3>
                <p class="text-xs text-slate-400 mt-0.5">Manage and view all available courses in the system</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openAddModal()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5 shadow-md transition cursor-pointer">
                    <i class="fa-solid fa-plus text-xs"></i> Add Course
                </button>
                <span class="px-2.5 py-1 text-xs font-semibold bg-slate-700/60 text-slate-300 border border-slate-600/50 rounded-lg shadow-sm">
                    Total Courses: <span class="text-indigo-400 font-bold" id="totalCoursesBadge">0</span>
                </span>
            </div>
        </div>

        <!-- Alert Notification Section -->
        <div id="courseAlertContainer"></div>

        <!-- Table Responsive Wrapper -->
        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs border-collapse">
                <thead>
                    <tr class="border-b border-slate-700/60 text-slate-400 uppercase tracking-wider font-semibold">
                        <th class="py-3 px-3 w-12 text-center">#</th>
                        <th class="py-3 px-3 text-center">Thumbnail</th>
                        <th class="py-3 px-3">Course Title</th>
                        <th class="py-3 px-3">Category</th>
                        <th class="py-3 px-3">Level</th>
                        <th class="py-3 px-3">Duration</th>
                        <th class="py-3 px-3">Price</th>
                        <th class="py-3 px-3 text-center">Status</th>
                        <th class="py-3 px-3 text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="courseTableBody" class="divide-y divide-slate-700/40 text-slate-300">
                    <tr>
                        <td colspan="9" class="py-8 text-center text-slate-400">
                            <i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading courses...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Add Course Modal -->
    <div id="addCourseModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700 mb-4">
                <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-indigo-400"></i> Add New Course
                </h3>
                <button type="button" onclick="closeModal('addCourseModal')" class="text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <form id="addCourseForm" onsubmit="handleCourseCreate(event)" class="space-y-4" enctype="multipart/form-data">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Course Title</label>
                    <input type="text" id="add_title" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="e.g. Web Development Bootcamp">
                </div>

                <!-- 📸 Add Course Thumbnail File Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Course Thumbnail Image</label>
                    <input type="file" id="add_image" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-300 file:mr-3 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Category</label>
                        <select id="add_category_id" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Level</label>
                        <select id="add_level" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="BEGINNER">BEGINNER</option>
                            <option value="INTERMEDIATE">INTERMEDIATE</option>
                            <option value="ADVANCED">ADVANCED</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Language</label>
                        <select id="add_language" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="">-- Select Language --</option>
                            <option value="Java">Java</option>
                            <option value="Python">Python</option>
                            <option value="JavaScript">JavaScript / TypeScript</option>
                            <option value="C#">C# (.NET)</option>
                            <option value="C++">C++</option>
                            <option value="PHP">PHP</option>
                            <option value="Go">Go (Golang)</option>
                            <option value="Swift">Swift</option>
                            <option value="Rust">Rust</option>
                            <option value="Kotlin">Kotlin</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Status</label>
                        <select id="add_status" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="DRAFT">DRAFT</option>
                            <option value="PUBLISHED">PUBLISHED</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Duration (Weeks)</label>
                        <input type="number" id="add_duration" min="0" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="e.g. 12">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Price (MMK)</label>
                        <input type="number" id="add_price" min="0" step="any" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="e.g. 150000">
                    </div>
                </div>

                <div class="flex items-center gap-4 pt-1">
                    <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                        <input type="checkbox" id="add_allow_discount" class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-0"> Allow Discount
                    </label>
                    <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                        <input type="checkbox" id="add_allow_installment" class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-0"> Allow Installment
                    </label>
                    <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                        <input type="checkbox" id="add_allow_scholarship" class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-0"> Allow Scholarship
                    </label>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Short Description</label>
                    <textarea id="add_short_description" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="Brief summary of the course..."></textarea>
                </div>

                <div class="mt-6 flex justify-end gap-2 pt-3 border-t border-slate-700">
                    <button type="button" onclick="closeModal('addCourseModal')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow-lg shadow-indigo-600/20">Create Course</button>
                </div>
            </form>
        </div>
    </div>

    <!-- View Course Detail Modal -->
    <div id="viewCourseModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-lg shadow-2xl">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700 mb-4">
                <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-circle-info text-indigo-400"></i> Course Details
                </h3>
                <button onclick="closeModal('viewCourseModal')" class="text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            
            <div id="viewCourseModalBody"></div>

            <div class="mt-5 flex justify-end">
                <button onclick="closeModal('viewCourseModal')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-lg">Close</button>
            </div>
        </div>
    </div>

    <!-- Edit Course Modal -->
    <div id="editCourseModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700 mb-4">
                <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-emerald-400"></i> Edit Course
                </h3>
                <button type="button" onclick="closeModal('editCourseModal')" class="text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <form id="editCourseForm" onsubmit="handleCourseUpdate(event)" class="space-y-4" enctype="multipart/form-data">
                <input type="hidden" id="edit_course_id" name="course_id">

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Course Title</label>
                    <input type="text" id="edit_title" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- 📸 Edit Course Thumbnail File Input & Preview -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Change Thumbnail (Optional)</label>
                    <div class="flex items-center gap-3">
                        <img id="edit_thumbnail_preview" src="" alt="Thumbnail" class="w-12 h-12 object-cover rounded-lg border border-slate-700 hidden">
                        <input type="file" id="edit_image" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-300 file:mr-3 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Category</label>
                        <select id="edit_category_id" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Level</label>
                        <select id="edit_level" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="BEGINNER">BEGINNER</option>
                            <option value="INTERMEDIATE">INTERMEDIATE</option>
                            <option value="ADVANCED">ADVANCED</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Language</label>
                        <select id="edit_language" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="">-- Select Language --</option>
                            <option value="Java">Java</option>
                            <option value="Python">Python</option>
                            <option value="JavaScript">JavaScript / TypeScript</option>
                            <option value="C#">C# (.NET)</option>
                            <option value="C++">C++</option>
                            <option value="PHP">PHP</option>
                            <option value="Go">Go (Golang)</option>
                            <option value="Swift">Swift</option>
                            <option value="Rust">Rust</option>
                            <option value="Kotlin">Kotlin</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Status</label>
                        <select id="edit_status" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="DRAFT">DRAFT</option>
                            <option value="PUBLISHED">PUBLISHED</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Duration (Weeks)</label>
                        <input type="number" id="edit_duration" min="0" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Price (MMK)</label>
                        <input type="number" id="edit_price" min="0" step="any" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="flex items-center gap-4 pt-1">
                    <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                        <input type="checkbox" id="edit_allow_discount" class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-0"> Allow Discount
                    </label>
                    <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                        <input type="checkbox" id="edit_allow_installment" class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-0"> Allow Installment
                    </label>
                    <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                        <input type="checkbox" id="edit_allow_scholarship" class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-0"> Allow Scholarship
                    </label>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Short Description</label>
                    <textarea id="edit_short_description" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div class="mt-6 flex justify-end gap-2 pt-3 border-t border-slate-700">
                    <button type="button" onclick="closeModal('editCourseModal')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg shadow-lg shadow-emerald-600/20">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    loadCategoriesFromDB();
    loadCoursesFromDB();
});

// HTML Escaping for Security
function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function openModal(id) { 
    const modal = document.getElementById(id);
    if (modal) modal.classList.remove('hidden'); 
}

function closeModal(id) { 
    const modal = document.getElementById(id);
    if (modal) modal.classList.add('hidden'); 
}

function openAddModal() {
    const form = document.getElementById("addCourseForm");
    if (form) form.reset();
    openModal('addCourseModal');
}

function loadCoursesFromDB() {
    fetch('/admin/courses/api/list')
        .then(res => res.json())
        .then(courses => {
            const tbody = document.getElementById("courseTableBody");
            const countBadge = document.getElementById("totalCoursesBadge") || document.getElementById("totalCourseCount");
            
            if (!tbody) return;

            if (countBadge) countBadge.innerText = courses ? courses.length : 0;

            if (!courses || courses.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="py-8 text-center text-slate-500">No courses available.</td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = courses.map((course, index) => {
                const levelBadge = course.level === 'ADVANCED' 
                    ? 'bg-emerald-950/60 text-emerald-400 border-emerald-800/50' 
                    : course.level === 'INTERMEDIATE' 
                    ? 'bg-slate-700/60 text-slate-300 border-slate-600/50' 
                    : 'bg-slate-800 text-slate-400 border-slate-700';

                const statusBadge = course.status === 'PUBLISHED' 
                    ? 'bg-emerald-950/50 text-emerald-400 border-emerald-700/50' 
                    : 'bg-amber-950/50 text-amber-400 border-amber-700/50';

                const formattedPrice = (course.price !== null && course.price !== undefined && course.price > 0)
                    ? `${Number(course.price).toLocaleString()} MMK` 
                    : 'Free';

                const durationVal = course.duration_weeks || course.duration || '-';
                const durationDisplay = (typeof durationVal === 'number') ? `${durationVal} Weeks` : durationVal;

                const imgSrc = course.thumbnail ? `/uploads/courses/${encodeURIComponent(course.thumbnail)}` : '';
                const imgHtml = course.thumbnail 
                    ? `<img src="${imgSrc}" 
                            class="w-10 h-10 object-cover rounded-md mx-auto border border-slate-700" 
                            onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');" 
                            alt="thumbnail"/>
                       <div class="hidden w-10 h-10 bg-slate-700/50 border border-slate-600 rounded-md flex items-center justify-center mx-auto text-slate-400" title="Image unavailable">
                           <i class="fa-solid fa-image text-xs"></i>
                       </div>`
                    : `<div class="w-10 h-10 bg-slate-700/50 border border-slate-600 rounded-md flex items-center justify-center mx-auto text-slate-400">
                           <i class="fa-solid fa-image text-xs"></i>
                       </div>`;

                return `
                    <tr class="hover:bg-slate-700/20 transition-colors border-b border-slate-700/30">
                        <td class="py-3 px-3 text-center font-mono text-slate-400">${index + 1}</td>
                        <td class="py-3 px-3 text-center">${imgHtml}</td>
                        <td class="py-3 px-3 font-semibold text-slate-100">${escapeHtml(course.title)}</td>
                        <td class="py-3 px-3 text-slate-300">${escapeHtml(course.category_name || 'Uncategorized')}</td>
                        <td class="py-3 px-3">
                            <span class="px-2.5 py-1 text-[10px] font-semibold border rounded-md uppercase tracking-wider ${levelBadge}">
                                ${escapeHtml(course.level || 'BEGINNER')}
                            </span>
                        </td>
                        <td class="py-3 px-3 text-slate-300">${escapeHtml(durationDisplay)}</td>
                        <td class="py-3 px-3 font-medium text-emerald-400">${formattedPrice}</td>
                        <td class="py-3 px-3 text-center">
                            <span class="px-2.5 py-1 text-[10px] font-semibold border rounded-md uppercase tracking-wider ${statusBadge}">
                                ${escapeHtml(course.status || 'DRAFT')}
                            </span>
                        </td>
                        <td class="py-3 px-3 text-center">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="viewCourseDetail(${course.course_id})" title="View" class="p-1.5 text-indigo-400 hover:text-indigo-300 hover:bg-indigo-500/10 rounded transition">
                                    <i class="fa-solid fa-eye text-sm"></i>
                                </button>
                                <button onclick="editCourse(${course.course_id})" title="Edit" class="p-1.5 text-emerald-400 hover:text-emerald-300 hover:bg-emerald-500/10 rounded transition">
                                    <i class="fa-solid fa-pen-to-square text-sm"></i>
                                </button>
                                <button onclick="deleteCourse(${course.course_id})" title="Delete" class="p-1.5 text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 rounded transition">
                                    <i class="fa-solid fa-trash-can text-sm"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        })
        .catch(err => {
            console.error("Failed to load courses:", err);
            const tbody = document.getElementById("courseTableBody");
            if (tbody) {
                tbody.innerHTML = `<tr><td colspan="9" class="py-4 text-center text-rose-400">Failed to load courses data.</td></tr>`;
            }
        });
}

function loadCategoriesFromDB() {
    fetch('/admin/courses/api/categories')
        .then(res => res.json())
        .then(categories => {
            const editSelect = document.getElementById("edit_category_id");
            const addSelect = document.getElementById("add_category_id");

            let options = `<option value="">-- Select Category --</option>`;
            if (Array.isArray(categories)) {
                categories.forEach(cat => {
                    options += `<option value="${cat.category_id}">${escapeHtml(cat.name)}</option>`;
                });
            }

            if (editSelect) editSelect.innerHTML = options;
            if (addSelect) addSelect.innerHTML = options;
        })
        .catch(err => console.error("Failed to load categories:", err));
}

function viewCourseDetail(courseId) {
    fetch(`/admin/courses/api/${courseId}`)
        .then(res => {
            if (!res.ok) throw new Error("Course detail not found");
            return res.json();
        })
        .then(course => {
            const body = document.getElementById("viewCourseModalBody");
            if (!body) return;

            const formattedPrice = (course.price !== null && course.price !== undefined && course.price > 0) 
                ? `${Number(course.price).toLocaleString()} MMK` 
                : 'Free';
            const durationDisplay = course.duration_weeks ? `${course.duration_weeks} Weeks` : (course.duration || '-');
            
            const imgSrc = course.thumbnail ? `/uploads/courses/${encodeURIComponent(course.thumbnail)}` : '';
            const imgHtml = course.thumbnail 
                ? `<img src="${imgSrc}" 
                        class="w-full h-40 object-cover rounded-lg mb-4 border border-slate-700" 
                        onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');"

function editCourse(courseId) {
    fetch(`/admin/courses/api/${courseId}`)
        .then(res => {
            if (!res.ok) throw new Error("Could not fetch course data");
            return res.json();
        })
        .then(course => {
            const setVal = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.value = (val !== null && val !== undefined) ? val : '';
            };

            const setChecked = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.checked = !!val;
            };

            setVal("edit_course_id", course.course_id);
            setVal("edit_title", course.title);
            setVal("edit_category_id", course.category_id);
            setVal("edit_level", course.level || 'BEGINNER');
            setVal("edit_language", course.language || 'Java');
            setVal("edit_status", course.status || 'DRAFT');
            setVal("edit_price", course.price || 0);
            setVal("edit_short_description", course.short_description || '');

            const durationVal = course.duration_weeks !== undefined ? course.duration_weeks : (course.duration || 0);
            setVal("edit_duration", durationVal);

            setChecked("edit_allow_discount", course.allow_discount);
            setChecked("edit_allow_installment", course.allow_installment);
            setChecked("edit_allow_scholarship", course.allow_scholarship);

            const previewImg = document.getElementById("edit_thumbnail_preview");
            if (previewImg) {
                if (course.thumbnail) {
                    previewImg.src = `/uploads/courses/${encodeURIComponent(course.thumbnail)}`;
                    previewImg.onerror = () => previewImg.classList.add("hidden");
                    previewImg.classList.remove("hidden");
                } else {
                    previewImg.classList.add("hidden");
                }
            }

            openModal('editCourseModal');
        })
        .catch(err => alert("Error loading course for edit: " + err.message));
}

function handleCourseCreate(e) {
    e.preventDefault();
    
    const formData = new FormData();
    const durationVal = parseInt(document.getElementById("add_duration")?.value) || 0;

    const courseData = {
        title: document.getElementById("add_title")?.value || '',
        category_id: parseInt(document.getElementById("add_category_id")?.value) || null,
        level: document.getElementById("add_level")?.value || 'BEGINNER',
        language: document.getElementById("add_language")?.value || 'Java',
        status: document.getElementById("add_status")?.value || 'DRAFT',
        price: parseFloat(document.getElementById("add_price")?.value) || 0,
        duration_weeks: durationVal,
        allow_discount: document.getElementById("add_allow_discount")?.checked ? 1 : 0,
        allow_installment: document.getElementById("add_allow_installment")?.checked ? 1 : 0,
        allow_scholarship: document.getElementById("add_allow_scholarship")?.checked ? 1 : 0,
        short_description: document.getElementById("add_short_description")?.value || ''
    };

    formData.append("course", new Blob([JSON.stringify(courseData)], { type: "application/json" }));

    const imageInput = document.getElementById("add_image");
    if (imageInput && imageInput.files[0]) {
        formData.append("image", imageInput.files[0]);
    }

    fetch('/admin/courses/api/create', {
        method: 'POST',
        body: formData
    })
    .then(async res => {
        const resData = await res.json();
        if (!res.ok) throw new Error(resData.message || resData.error || "Failed to create course");
        return resData;
    })
    .then(() => {
        closeModal('addCourseModal');
        loadCoursesFromDB();
    })
    .catch(err => alert(err.message));
}

function deleteCourse(courseId) {
    if (!confirm("Are you sure you want to delete this course?")) return;

    fetch(`/admin/courses/api/delete/${courseId}`, { method: 'DELETE' })
        .then(async res => {
            if (!res.ok) throw new Error("Delete operation failed");
            return res.json();
        })
        .then(() => loadCoursesFromDB())
        .catch(err => alert(err.message));
}

document.addEventListener("DOMContentLoaded", () => {
    loadCategoriesFromDB();
    loadCoursesFromDB();

    // 🟢 Edit Modal မှာ ပုံအသစ်ရွေးလိုက်ရင် Preview ပုံအဖြစ် တန်းပြပေးရန်
    const editImageInput = document.getElementById("edit_image");
    const editPreviewImg = document.getElementById("edit_thumbnail_preview");

    if (editImageInput && editPreviewImg) {
        editImageInput.addEventListener("change", function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    editPreviewImg.src = e.target.result;
                    editPreviewImg.classList.remove("hidden");
                };
                reader.readAsDataURL(file);
            }
        });
    }

    // 🟢 Add Modal မှာလည်း အသစ်ရွေးရင် Preview ပြချင်ပါက (Optional)
    const addImageInput = document.getElementById("add_image");
    const addPreviewImg = document.getElementById("add_thumbnail_preview");

    if (addImageInput && addPreviewImg) {
        addImageInput.addEventListener("change", function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    addPreviewImg.src = e.target.result;
                    addPreviewImg.classList.remove("hidden");
                };
                reader.readAsDataURL(file);
            }
        });
    }
});
