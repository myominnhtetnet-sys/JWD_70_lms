<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{head :: head}"></head>

<body class="h-screen font-sans text-slate-800 dark:text-slate-100 dark:bg-slate-900 transition-colors duration-200 overflow-hidden flex flex-col">

    <div id="app" class="h-full flex flex-col overflow-hidden">
        
        <!-- TOP HEADER BAR -->
        <div th:replace="~{header :: header}"></div>

        <!-- MAIN APP CONTENT AREA -->
        <div class="flex-1 flex overflow-hidden h-full">
            
            <!-- SIDEBAR -->
            <aside class="w-64 flex-shrink-0 h-full overflow-y-auto bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 z-20">
                <div th:replace="~{nav :: nav}"></div>
            </aside>

            <!-- MAIN CONTENT AREA -->
            <main class="flex-1 h-full overflow-y-auto p-6 lg:p-8 max-w-7xl mx-auto w-full bg-slate-50 dark:bg-slate-900/50">
                
                <!-- Page Header & Action Button -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
                    <div>
                        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Course Builder</h1>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Create, manage, and organize your LMS courses and modules.</p>
                    </div>
                    <button onclick="openCreateModal()" class="inline-flex items-center justify-center px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-sm transition-all duration-150 gap-2 cursor-pointer">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Add New Course
                    </button>
                </div>

                <!-- Courses Grid Section -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                    <div th:each="c : ${courses}" class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden flex flex-col justify-between transition hover:shadow-md">
                        <div class="p-5">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs px-2.5 py-1 rounded-full font-semibold bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800" th:text="${c.status}">PUBLISHED</span>
                                <span class="text-xs text-slate-500 dark:text-slate-400 font-medium" th:text="${c.language}">Java</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-2" th:text="${c.title}">Course Title</h3>
                            <p class="text-sm text-slate-600 dark:text-slate-300 line-clamp-2 mb-4" th:text="${c.shortDescription}">Short description...</p>
                            
                            <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 border-t border-slate-100 dark:border-slate-700 pt-4">
                                <span class="font-semibold text-slate-900 dark:text-white" th:text="${c.price + ' MMK'}">150,000 MMK</span>
                                <span th:text="${c.durationWeeks + ' Weeks'}">12 Weeks</span>
                            </div>
                        </div>
                        
                        <div class="bg-slate-50 dark:bg-slate-800/50 px-5 py-3 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between">
                            <a th:href="@{'/admin/course-builder/' + ${c.courseId} + '/builder'}" class="text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1">
                                Manage Builder &rarr;
                            </a>
                            <div class="space-x-2">
                                <button th:onclick="'openEditModal(' + ${c.courseId} + ')'" class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold hover:underline cursor-pointer">Edit</button>
                                <button th:onclick="'deleteCourse(' + ${c.courseId} + ')'" class="text-xs text-rose-600 dark:text-rose-400 font-semibold hover:text-rose-700 cursor-pointer">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Empty State -->
                <div th:if="${courses == null or courses.empty}" class="text-center py-16 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 mb-8">
                    <p class="text-slate-500 dark:text-slate-400 text-sm">No courses found. Click "Add New Course" to get started.</p>
                </div>

            </main>
        </div>
    </div>

    <!-- 🌟 Create Course Modal -->
    <div id="createCourseModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-2xl p-6 shadow-xl overflow-y-auto max-h-[90vh] border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 dark:border-slate-700">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">Create New Course</h3>
                <button onclick="closeCreateModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form onsubmit="submitCreateCourse(event)">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Course Title</label>
                        <input type="text" id="title" required class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-transparent outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Slug (URL Name)</label>
                        <input type="text" id="slug" required class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-transparent outline-none" placeholder="e.g. java-spring-boot">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Category</label>
                        <select id="categoryId" required class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-white dark:bg-slate-900 outline-none">
                            <option value="">-- Choose Category --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Programming Language</label>
                        <select id="language" required class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-white dark:bg-slate-900 outline-none">
                            <option value="">-- Choose Language --</option>
                            <option value="Java">Java</option>
                            <option value="Python">Python</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="TypeScript">TypeScript</option>
                            <option value="C++">C++</option>
                            <option value="C#">C#</option>
                            <option value="PHP">PHP</option>
                            <option value="Go">Go</option>
                            <option value="SQL">SQL</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Short Description</label>
                    <textarea id="shortDescription" rows="2" class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-transparent outline-none"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Price (MMK)</label>
                        <input type="number" id="price" required class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-transparent outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Duration (Weeks)</label>
                        <input type="number" id="durationWeeks" required class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-transparent outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Level</label>
                        <select id="level" class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-white dark:bg-slate-900 outline-none">
                            <option value="BEGINNER">Beginner</option>
                            <option value="INTERMEDIATE">Intermediate</option>
                            <option value="ADVANCED">Advanced</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-700">
                    <button type="button" onclick="closeCreateModal()" class="px-4 py-2 text-sm text-slate-600 bg-slate-100 rounded-lg">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm text-white bg-indigo-600 rounded-lg font-semibold">Save Course</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 🌟 Edit Course Modal -->
    <div id="editCourseModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-2xl p-6 shadow-xl overflow-y-auto max-h-[90vh] border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 dark:border-slate-700">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">Edit Course</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form onsubmit="submitUpdateCourse(event)">
                <input type="hidden" id="editCourseId">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Course Title</label>
                        <input type="text" id="editTitle" required class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-transparent outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Slug (URL Name)</label>
                        <input type="text" id="editSlug" required class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-transparent outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Category</label>
                        <select id="editCategoryId" required class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-white dark:bg-slate-900 outline-none">
                            <option value="">-- Choose Category --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Programming Language</label>
                        <select id="editLanguage" required class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-white dark:bg-slate-900 outline-none">
                            <option value="">-- Choose Language --</option>
                            <option value="Java">Java</option>
                            <option value="Python">Python</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="TypeScript">TypeScript</option>
                            <option value="C++">C++</option>
                            <option value="C#">C#</option>
                            <option value="PHP">PHP</option>
                            <option value="Go">Go</option>
                            <option value="SQL">SQL</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Short Description</label>
                    <textarea id="editShortDescription" rows="2" class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-transparent outline-none"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Price (MMK)</label>
                        <input type="number" id="editPrice" required class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-transparent outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Duration (Weeks)</label>
                        <input type="number" id="editDurationWeeks" required class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-transparent outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Level</label>
                        <select id="editLevel" class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm bg-white dark:bg-slate-900 outline-none">
                            <option value="BEGINNER">Beginner</option>
                            <option value="INTERMEDIATE">Intermediate</option>
                            <option value="ADVANCED">Advanced</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-700">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 text-sm text-slate-600 bg-slate-100 rounded-lg">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm text-white bg-indigo-600 rounded-lg font-semibold">Update Course</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Scripts -->
    <script>
        function openCreateModal() {
            document.getElementById('createCourseModal').classList.remove('hidden');
            loadCategoriesForDropdown('categoryId');
        }
        function closeCreateModal() {
            document.getElementById('createCourseModal').classList.add('hidden');
        }

        async function openEditModal(courseId) {
            try {
                await loadCategoriesForDropdown('editCategoryId');
                const res = await fetch(`/admin/course-builder/api/single/${courseId}`);
                const course = await res.json();

                document.getElementById('editCourseId').value = course.courseId || course.COURSE_ID;
                document.getElementById('editTitle').value = course.title || course.TITLE;
                document.getElementById('editSlug').value = course.slug || course.SLUG;
                document.getElementById('editCategoryId').value = course.categoryId || course.CATEGORY_ID;
                document.getElementById('editLanguage').value = course.language || course.LANGUAGE;
                document.getElementById('editShortDescription').value = course.shortDescription || course.SHORT_DESCRIPTION;
                document.getElementById('editPrice').value = course.price || course.PRICE;
                document.getElementById('editDurationWeeks').value = course.durationWeeks || course.DURATION_WEEKS;
                document.getElementById('editLevel').value = course.level || course.LEVEL;

                document.getElementById('editCourseModal').classList.remove('hidden');
            } catch (err) {
                console.error('Failed to load course details', err);
                alert('Failed to load course data.');
            }
        }
        function closeEditModal() {
            document.getElementById('editCourseModal').classList.add('hidden');
        }

        async function loadCategoriesForDropdown(elementId) {
            try {
                const res = await fetch('/admin/course-builder/api/categories');
                const categories = await res.json();
                const select = document.getElementById(elementId);
                select.innerHTML = '<option value="">-- Choose Category --</option>' + 
                    categories.map(c => `<option value="${c.category_id || c.CATEGORY_ID}">${c.name || c.NAME}</option>`).join('');
            } catch (err) {
                console.error('Failed to load categories', err);
            }
        }

        async function submitCreateCourse(event) {
            event.preventDefault();
            const payload = {
                title: document.getElementById('title').value,
                slug: document.getElementById('slug').value,
                categoryId: Number(document.getElementById('categoryId').value),
                shortDescription: document.getElementById('shortDescription').value,
                price: Number(document.getElementById('price').value),
                durationWeeks: Number(document.getElementById('durationWeeks').value),
                level: document.getElementById('level').value,
                language: document.getElementById('language').value,
                status: 'DRAFT',
                allowDiscount: true, allowInstallment: true, allowScholarship: false
            };
            const response = await fetch('/admin/course-builder/api', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });
            if (response.ok) { alert('Course created successfully!'); location.reload(); }
            else { alert('Failed to create course.'); }
        }

        async function submitUpdateCourse(event) {
            event.preventDefault();
            const courseId = document.getElementById('editCourseId').value;
            const payload = {
                title: document.getElementById('editTitle').value,
                slug: document.getElementById('editSlug').value,
                categoryId: Number(document.getElementById('editCategoryId').value),
                shortDescription: document.getElementById('editShortDescription').value,
                price: Number(document.getElementById('editPrice').value),
                durationWeeks: Number(document.getElementById('editDurationWeeks').value),
                level: document.getElementById('editLevel').value,
                language: document.getElementById('editLanguage').value,
                status: 'PUBLISHED',
                allowDiscount: true, allowInstallment: true, allowScholarship: false
            };
            const response = await fetch(`/admin/course-builder/api/${courseId}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });
            if (response.ok) { alert('Course updated successfully!'); location.reload(); }
            else { alert('Failed to update course.'); }
        }

        function deleteCourse(id) {
            if (confirm('Are you sure you want to delete this course?')) {
                fetch('/admin/course-builder/api/' + id, { method: 'DELETE' }).then(res => {
                    if (res.ok) location.reload();
                    else res.text().then(msg => alert(msg));
                });
            }
        }
    </script>
</body>
</html>
