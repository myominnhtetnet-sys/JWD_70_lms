<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Details - LearnHub LMS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">

    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="max-w-xl w-full bg-white rounded-2xl border border-slate-200 shadow-sm p-8 space-y-6">
            
            <!-- Header -->
            <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-award text-indigo-600"></i> Certificate Details
                    </h2>
                    <p class="text-xs text-slate-400 mt-0.5">Verified authenticity and credential information</p>
                </div>
                <a th:href="@{/student/certificate}" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </a>
            </div>

            <!-- Details Content -->
            <div class="space-y-4" th:if="${cert != null}">
                <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 flex items-center gap-3 text-emerald-700 text-xs font-semibold">
                    <i class="fa-solid fa-circle-check text-base"></i>
                    <span>This certificate is officially verified and valid.</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                    <div class="bg-slate-50 p-4 rounded-xl space-y-1">
                        <span class="text-slate-400 font-medium uppercase tracking-wider block text-[10px]">Certificate Code</span>
                        <span class="font-bold text-slate-900 text-sm" th:text="${cert['certificate_code']}">-</span>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl space-y-1">
                        <span class="text-slate-400 font-medium uppercase tracking-wider block text-[10px]">Status</span>
                        <span class="inline-block px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-100 text-emerald-700" th:text="${cert['status']}">ISSUED</span>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl space-y-1">
                        <span class="text-slate-400 font-medium uppercase tracking-wider block text-[10px]">Student Name</span>
                        <span class="font-bold text-slate-800 text-sm" th:text="${cert['student_name']}">-</span>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl space-y-1">
                        <span class="text-slate-400 font-medium uppercase tracking-wider block text-[10px]">Course Title</span>
                        <span class="font-bold text-slate-800 text-sm" th:text="${cert['course_title']}">-</span>
                    </div>

                    <div class="col-span-2 bg-slate-50 p-4 rounded-xl space-y-1">
                        <span class="text-slate-400 font-medium uppercase tracking-wider block text-[10px]">Issued Date</span>
                        <span class="font-semibold text-slate-700 text-xs" th:text="${cert['issued_at']}">-</span>
                    </div>

                    <div class="col-span-2 bg-slate-50 p-4 rounded-xl space-y-1">
                        <span class="text-slate-400 font-medium uppercase tracking-wider block text-[10px]">Credential File</span>
                        <div class="flex items-center gap-2 mt-1">
                            <i class="fa-regular fa-file-pdf text-rose-500 text-base"></i>
                            <span class="text-indigo-600 font-semibold text-xs" th:text="${cert['file_path'] != null ? cert['file_path'] : 'certificate.pdf'}">certificate.pdf</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${cert == null}" class="text-center py-12 text-slate-400">
                <p class="font-semibold text-slate-700 text-sm">Certificate details not found.</p>
            </div>

        </div>
    </div>

</body>
</html>
