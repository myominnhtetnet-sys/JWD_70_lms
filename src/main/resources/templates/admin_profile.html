<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{head :: head}"></head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased font-sans h-screen overflow-hidden flex flex-col">

    <div id="app" class="h-full flex flex-col overflow-hidden">
        
        <!-- TOP HEADER BAR -->
        <div th:replace="~{header :: header}"></div>

        <!-- MAIN APP CONTENT AREA -->
        <div class="flex-1 flex overflow-hidden h-full">
            
            <!-- SIDEBAR NAVIGATION -->
            <div th:replace="~{nav :: nav}"></div>

            <!-- MAIN CONTENT -->
            <main class="flex-1 overflow-y-auto p-6 lg:p-8 space-y-6 w-full text-xs bg-slate-50 dark:bg-slate-900/50">
                
                <!-- Flash Alert Messages -->
                <div th:if="${success}" class="p-4 bg-emerald-100 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 rounded-xl text-xs font-semibold border border-emerald-200 dark:border-emerald-800">
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="p-4 bg-rose-100 dark:bg-rose-950/50 text-rose-700 dark:text-rose-300 rounded-xl text-xs font-semibold border border-rose-200 dark:border-rose-800">
                    <span th:text="${error}"></span>
                </div>

                <!-- Profile Header Card -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm flex flex-col sm:flex-row items-center gap-6">
                    <div class="w-24 h-24 rounded-full bg-indigo-600 text-white font-bold text-2xl flex items-center justify-center shadow-md">
                        <span th:text="${fullName != null ? #strings.substring(fullName,0,2).toUpperCase() : 'AD'}">AD</span>
                    </div>
                    <div class="text-center sm:text-left space-y-1">
                        <h1 class="text-xl font-bold text-slate-900 dark:text-white" th:text="${fullName != null ? fullName : 'Admin User'}">Admin Name</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400" th:text="${email}">admin@gmail.com</p>
                        <div class="pt-2 flex flex-wrap gap-2 justify-center sm:justify-start">
                            <span class="px-2.5 py-0.5 text-[11px] font-semibold bg-indigo-100 text-indigo-700 dark:bg-indigo-950/50 dark:text-indigo-300 rounded-full">System Administrator</span>
                        </div>
                    </div>
                </div>

                <!-- Personal Information Form -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm space-y-6">
                    <div class="border-b border-slate-100 dark:border-slate-700/60 pb-4">
                        <h3 class="text-base font-bold text-slate-800 dark:text-white">Personal Information</h3>
                        <p class="text-xs text-slate-400">Update your administrator details here.</p>
                    </div>

                    <form th:action="@{/admin/profile/update}" method="post" class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Full Name</label>
                                <input type="text" name="fullName" th:value="${fullName}" class="w-full bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl px-3.5 py-2 text-xs outline-none focus:border-indigo-500 dark:text-white transition" required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Email Address</label>
                                <input type="email" name="email" th:value="${email}" class="w-full bg-slate-100 dark:bg-slate-700/30 border border-slate-200 dark:border-slate-600 rounded-xl px-3.5 py-2 text-xs text-slate-500 dark:text-slate-400 outline-none" readonly>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Phone Number</label>
                                <input type="text" name="phone" th:value="${phone}" placeholder="09xxxxxxxxx" class="w-full bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl px-3.5 py-2 text-xs outline-none focus:border-indigo-500 dark:text-white transition">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Address</label>
                                <input type="text" name="address" th:value="${address}" placeholder="Yangon, Myanmar" class="w-full bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl px-3.5 py-2 text-xs outline-none focus:border-indigo-500 dark:text-white transition">
                            </div>
                        </div>

                        <div class="flex justify-end pt-2">
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2 rounded-xl text-xs transition shadow-sm">
                                Save Changes
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Security & Password Section -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm space-y-4">
                    <div class="border-b border-slate-100 dark:border-slate-700/60 pb-4">
                        <h3 class="text-base font-bold text-slate-800 dark:text-white">Security & Password</h3>
                        <p class="text-xs text-slate-400">Change your password to secure your admin account.</p>
                    </div>

                    <form th:action="@{/admin/profile/change-password}" method="post" class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300">Current Password</label>
                                    <a th:href="@{/forgot-password}" class="text-[11px] font-medium text-indigo-600 hover:underline">Forgot?</a>
                                </div>
                                <input type="password" name="currentPassword" class="w-full bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl px-3.5 py-2 text-xs outline-none focus:border-indigo-500 dark:text-white transition" required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">New Password</label>
                                <input type="password" name="newPassword" class="w-full bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl px-3.5 py-2 text-xs outline-none focus:border-indigo-500 dark:text-white transition" required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Confirm New Password</label>
                                <input type="password" name="confirmPassword" class="w-full bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl px-3.5 py-2 text-xs outline-none focus:border-indigo-500 dark:text-white transition" required>
                            </div>
                        </div>

                        <div class="flex justify-end pt-2">
                            <button type="submit" class="bg-slate-900 hover:bg-slate-800 dark:bg-slate-700 dark:hover:bg-slate-600 text-white font-semibold px-5 py-2 rounded-xl text-xs transition">
                                Update Password
                            </button>
                        </div>
                    </form>
                </div>

            </main>
        </div>
    </div>

</body>
</html>
