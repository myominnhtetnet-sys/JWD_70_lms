<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Workspace</title>
 <link rel="stylesheet" th:href="@{/css/style.css(v=1.0)}" href="/css/style.css">

    <!-- Premium Split Workspace Layout System (Zero-Whitespace Configuration) -->
    <style>
        body { margin: 0; background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .workspace-grid { display: grid; grid-template-columns: 1fr 300px; height: 100vh; overflow: hidden; }
        .content-pane { padding: 24px; overflow-y: auto; text-align: left; }
        .sidebar-pane { background: #ffffff; border-left: 1px solid #e2e8f0; overflow-y: auto; padding: 16px; text-align: left; }
        
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: #000; border: 1px solid #e2e8f0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .text-content-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px 24px; margin-top: 16px; line-height: 1.6; color: #334155; font-size: 15px; }
        .sidebar-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 8px; text-decoration: none; background: #ffffff; }
        .sidebar-item.active { border-color: #2563eb !important; background: #eff6ff !important; }
        .premium-btn { display: inline-flex; align-items: center; gap: 8px; background: #0f172a; color: #ffffff; text-decoration: none; padding: 10px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 600; border: 1px solid #0f172a; }
        .premium-btn:hover { background: #1e293b; }
    </style>
</head>
<body>

<div class="workspace-grid">

    <!-- 🟢 LEFT SIDE: CORE LESSON MEDIA CONTENT WORKSPACE PLAYER -->
    <div class="content-pane">
        <div style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
            <a th:href="@{/student/course/{id}(id=${course.courseId})}" style="color: #64748b; text-decoration: none; font-weight: 600; font-size: 14px;">← Exit Classroom</a>
            <span style="background: #eff6ff; color: #2563eb; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; text-transform: uppercase;" th:text="${lesson.moduleTitle}">Module</span>
        </div>

        <h1 style="color: #0f172a; font-size: 24px; font-weight: 800; margin: 0 0 4px 0;" th:text="${lesson.lessonTitle}">Lesson Title</h1>
        <p style="color: #64748b; font-size: 14px; margin: 0 0 20px 0;" th:text="${lesson.durationMin} + ' minutes duration module chapter'"></p>

        <!-- A. VIDEO CONTENT TYPE PLAYER CONTAINER -->
        <div th:if="${lesson.contentType == 'VIDEO' and lesson.videoUrl != null}" class="video-container">
            <iframe th:src="${lesson.videoUrl}" 
		        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
		        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
		        allowfullscreen>
			</iframe>
        </div>

        <!-- B. TEXT CONTENT TYPE DATA CONTAINER ENVELOPE -->
        <div th:if="${lesson.contentType == 'TEXT' and lesson.content != null}" class="text-content-box">
            <div th:text="${lesson.content}" style="white-space: pre-wrap;">Lesson content body text written by teacher goes here...</div>
        </div>

        <!-- C. DOWNLOADABLE LESSON MATERIALS ATTACHMENTS (Glued tightly below layout contents) -->
        <div th:if="${lesson.filePath != null}" style="margin-top: 20px;">
            <h4 style="font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: 700; margin-bottom: 8px;">Resource Material Files</h4>
            <a th:href="@{/{path}(path=${lesson.filePath})}" target="_blank" class="premium-btn">
                <svg style="width:16px; height:16px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                <span th:text="'Download ' + ${lesson.materialTitle}">Download Attached Attachment File</span>
            </a>
        </div>
    </div>

    <!-- 🟢 RIGHT SIDE: CURRICULUM SYLLABUS INDEX TIMELINE SIDEBAR -->
    <div class="sidebar-pane">
        <h3 style="font-size: 15px; font-weight: 700; color: #0f172a; margin: 0 0 14px 0;">Syllabus Modules</h3>
        
        <div style="display: block;">
		          <!-- 🟢 FIXED: Native expression mapping for sidebar sibling switching loops -->
		<a th:each="item : ${sidebarLessons}" 
		   th:href="@{/student/course/lesson/{id}(id=${item.lessonId}, courseId=${course.courseId})}" 
		   class="sidebar-item" 
		   th:classappend="${item.lessonId == lesson.lessonId} ? 'active' : ''">
		    
		    <div style="display: flex; flex-direction: column; gap: 1px;">
		        <span style="font-size: 13px; font-weight: 700; color: #1e293b;" th:text="${item.lessonTitle}">Lesson Sibling Title</span>
		        <span style="font-size: 11px; color: #64748b;" th:text="${item.contentType} + ' • ' + ${item.durationMin} + 'm'">VIDEO • 20m</span>
		    </div>
		    
		    <span th:if="${item.done}" style="color: #166534; font-size: 13px; font-weight: 700;">✓</span>
		</a>

        </div>
    </div>

</div>

</body>
</html>
