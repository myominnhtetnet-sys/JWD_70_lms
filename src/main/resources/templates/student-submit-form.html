<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submit Assignment</title>
    <!-- Links cleanly to your shared style sheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container" style="padding: 24px; max-width: 600px; margin: 0 auto; font-family: sans-serif;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: #0f172a; margin: 0;">Submit Assignment Workspace</h2>
            <a th:href="@{/student/assignments}" style="color: #64748b; font-size: 14px; text-decoration: none; font-weight: 600;">← Back to Dashboard</a>
        </div>

        <!-- 🟢 FIXED: Flash message alert boxes catch errors (like missing assignments or wrong file sizes) cleanly -->
        <div th:if="${successMessage}" class="alert alert-success" style="padding: 12px; background: #dcfce7; color: #15803d; border-radius: 6px; margin-bottom: 16px;" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" style="padding: 12px; background: #fee2e2; color: #b91c1c; border-radius: 6px; margin-bottom: 16px;" th:text="${errorMessage}"></div>

        <!-- Enctype multi-part mapping handles the uploaded files byte stream payload natively -->
        <form th:action="@{/student/assignments/submit}" th:object="${submission}" method="post" enctype="multipart/form-data" style="background: #ffffff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0;">

            <!-- Hidden field tracks the dynamic context assignmentId passed by the @PathVariable handler -->
            <input type="hidden" th:field="*{assignmentId}"> 

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 13px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 6px;">Your Written Answer:</label>
                <!-- 🟢 FIXED: Removed strict 'required' constraint so students can opt to ONLY submit a file file attachment instead -->
                <textarea th:field="*{answerText}" rows="6" placeholder="Type your assignment answers, text references, or student comments here..." style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; resize: vertical; font-family: inherit; font-size: 14px;"></textarea>
            </div>

            <div style="margin-bottom: 24px; background: #f8fafc; padding: 16px; border-radius: 6px; border: 1px dashed #cbd5e1;">
                <label style="display: block; font-size: 13px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 6px;">Upload File Attachment:</label>
                <!-- Input file binds directly to the MultipartFile parameter inside your controller -->
                <input type="file" name="file" accept=".pdf,.docx,.zip,.txt" style="font-size: 14px; color: #475569;">
                <p style="margin: 6px 0 0 0; font-size: 11px; color: #64748b;">Supported formats: <strong>PDF, DOCX, ZIP, TXT</strong> (Max file size: <strong>5MB</strong>)</p>
            </div>

            <div style="display: flex; justify-content: flex-end;">
                <button type="submit" style="background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);">🚀 Turn In Assignment</button>
            </div>
        </form>

    </div>

</body>
</html>
