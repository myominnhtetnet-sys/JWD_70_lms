<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- 🟢 This defines a reusable fragment named 'student-sidebar' -->
    <aside th:fragment="student-sidebar" class="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col justify-between shrink-0 sticky top-0 h-screen overflow-y-auto border-r border-slate-800">
        <div>
            <!-- Logo -->
            <div class="h-16 flex items-center px-6 border-b border-slate-800 gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-500 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-graduation-cap text-lg"></i>
                </div>
                <div>
                    <span class="text-base font-bold text-white tracking-wide block leading-none">LearnHub</span>
                    <small class="text-[11px] font-medium text-slate-400">Student Portal</small>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="p-4 space-y-6">
                <div>
                    <div class="px-3 text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2">Learning</div>
                    <div class="space-y-1">
                        <!-- 🟢 Dashboard Link Condition -->
                        <a th:href="@{/student}" 
                           class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition"
                           th:classappend="${activeLink == 'dashboard'} ? 'bg-indigo-600 text-white font-semibold shadow-sm' : ''">
                            <i class="fa-solid fa-border-all text-base"></i> Dashboard
                        </a>
                        
                        <!-- 🟢 My Courses / Catalog Link Condition -->
                        <a th:href="@{/student/courses}" 
                           class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition"
                           th:classappend="${activeLink == 'courses'} ? 'bg-indigo-600 text-white font-semibold shadow-sm' : ''">
                            <i class="fa-solid fa-book-open text-base"></i> My Courses
                        </a>
                        
                        <!-- 🟢 Schedule Link Condition (FIXED: Styles are now completely dynamic) -->
                        <a th:href="@{/student/schedule}" 
                           class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition"
                           th:classappend="${activeLink == 'schedule'} ? 'bg-indigo-600 text-white font-semibold shadow-sm' : ''">
                            <i class="fa-regular fa-calendar-check text-base"></i> Schedule
                        </a>
                        
                        <!-- 🟢 Assignments Link Condition -->
                        <a th:href="@{/student/assignments}" 
                           class="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition"
                           th:classappend="${activeLink == 'assignments'} ? 'bg-indigo-600 text-white font-semibold shadow-sm' : ''">
                            <div class="flex items-center gap-3">
                                <i class="fa-regular fa-file-lines text-base"></i> Assignments
                            </div>
                        </a>
                        
                        <!-- 🟢 Exams Link Condition -->
                        <a th:href="@{/student/exams}" 
                           class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition"
                           th:classappend="${activeLink == 'exams'} ? 'bg-indigo-600 text-white font-semibold shadow-sm' : ''">
                            <i class="fa-solid fa-square-check text-base"></i> Exams
                        </a>
                    </div>
                </div>

                <div>
                    <div class="px-3 text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2">Account</div>
                    <div class="space-y-1">
                        <!-- 🟢 Payments Link Condition -->
                        <a th:href="@{/student/checkout}" 
                           class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition"
                           th:classappend="${activeLink == 'payments'} ? 'bg-indigo-600 text-white font-semibold shadow-sm' : ''">
                            <i class="fa-regular fa-credit-card text-base"></i> Payments
                        </a>
                        
                        <!-- 🟢 Profile Link Condition -->
                        <a th:href="@{/student/profile}" 
                           class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition"
                           th:classappend="${activeLink == 'profile'} ? 'bg-indigo-600 text-white font-semibold shadow-sm' : ''">
                            <i class="fa-regular fa-user text-base"></i> My Profile
                        </a>
                    </div>
                </div>
            </nav>
        </div>

        <div class="p-4 border-t border-slate-800">
            <a th:href="@{/logout}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-rose-400 hover:bg-rose-500/10 transition">
                <i class="fa-solid fa-right-from-bracket text-base"></i> Logout
            </a>
        </div>
    </aside>

</body>
</html>
