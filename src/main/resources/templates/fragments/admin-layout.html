<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        /* =====================================================
           SHARED ADMIN LAYOUT & SIDEBAR STYLING (FIXED)
           ===================================================== */
        :root {
            --bg: #0f1118;
            --sidebar: #181d28;
            --card: #181d28;
            --border: #293142;
            --primary: #6c4ce5;
            --text: #f1f3f9;
            --muted: #929bb0;
            --input: #202634;
        }

        /* Sidebar Fixed Layout */
        .sidebar {
            width: 260px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            height: 100vh;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            padding: 25px 18px;
            z-index: 1000;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* Brand Styling */
        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            margin-bottom: 25px;
            padding: 0 5px;
        }
        .sidebar .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .sidebar .brand-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }
        .sidebar .brand-subtitle {
            font-size: 11px;
            color: var(--muted);
        }

        /* Menu Headings & Links */
        .sidebar .menu-heading {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 0.5px;
            margin: 20px 0 10px 5px;
            font-weight: 600;
        }
        .sidebar .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            color: var(--muted);
            text-decoration: none;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }
        .sidebar .nav-link:hover, 
        .sidebar .nav-link.active {
            background: rgba(108, 76, 229, 0.15);
            color: var(--text);
        }
        .sidebar .nav-link.active {
            color: #a894ff;
            font-weight: 600;
        }
        .sidebar .nav-link i {
            width: 18px;
            text-align: center;
            font-size: 15px;
        }

        /* Sidebar Bottom Links */
        .sidebar .sidebar-bottom {
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }
        .sidebar .logout-link:hover {
            background: rgba(255, 115, 115, 0.15);
            color: #ff7373;
        }

        /* Topbar Layout Styling */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            width: 100%;
        }
        .topbar .page-heading h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 3px;
        }
        .topbar .page-heading p {
            font-size: 13px;
            color: var(--muted);
        }
        .topbar .topbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .topbar .icon-btn {
            background: var(--input);
            border: 1px solid var(--border);
            color: var(--text);
            width: 38px;
            height: 38px;
            border-radius: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }
        .topbar .profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar .avatar {
            width: 40px;
            height: 40px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }
        .topbar .profile-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
        }
        .topbar .profile-role {
            font-size: 11px;
            color: var(--muted);
        }
    </style>
</head>
<body>

    <!-- SIDEBAR FRAGMENT -->
    <aside class="sidebar" th:fragment="sidebar(activePage)">
        <a th:href="@{/admin/dashboard}" class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="brand-text">
                <div class="brand-name">LearnHub</div>
                <div class="brand-subtitle">Admin Portal</div>
            </div>
        </a>

        <div class="menu-heading">Overview</div>
        <a th:href="@{/admin/dashboard}" class="nav-link" th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
            <i class="fa-solid fa-table-columns"></i>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/admin/dashboard#recent-users}" class="nav-link">
            <i class="fa-solid fa-chart-line"></i>
            <span>Reports</span>
        </a>

        <div class="menu-heading">Users</div>
        <a th:href="@{/admin/users}" class="nav-link" th:classappend="${activePage == 'users'} ? ' active' : ''">
            <i class="fa-solid fa-users"></i>
            <span>Users</span>
        </a>

        <div class="menu-heading">Catalog</div>
        <a href="#" class="nav-link">
            <i class="fa-solid fa-book-open"></i>
            <span>Courses</span>
        </a>
        <a href="#" class="nav-link">
            <i class="fa-regular fa-calendar"></i>
            <span>Batches</span>
        </a>

        <div class="menu-heading">Enrollment</div>
        <a th:href="@{/admin/enrollments}" class="nav-link" th:classappend="${activePage == 'enrollments'} ? ' active' : ''">
            <i class="fa-solid fa-user-check"></i>
            <span>Enrollments</span>
        </a>

        <div class="sidebar-bottom">
            <a th:href="@{/admin/notification}" class="nav-link">
                <i class="fa-regular fa-bell"></i>
                <span>Notifications</span>
            </a>
            <a th:href="@{/admin/profile}" class="nav-link">
                <i class="fa-regular fa-user"></i>
                <span>My Profile</span>
            </a>
            <a th:href="@{/admin/logout}" class="nav-link logout-link">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- TOPBAR FRAGMENT -->
    <header class="topbar" th:fragment="topbar(title, subtitle)">
        <div class="page-heading">
            <h1 th:text="${title}">Dashboard</h1>
            <p id="current-date" th:text="${subtitle}">Learning Management System</p>
        </div>

        <div class="topbar-right">
            <button type="button" class="icon-btn" id="themeToggle" title="Toggle light and dark mode">
                <i class="fa-regular fa-moon"></i>
            </button>
            <div class="profile">
                <div class="avatar" id="adminAvatar">AD</div>
                <div class="profile-info">
                    <div class="profile-name" id="adminName" th:text="${fullName != null ? fullName : 'Admin'}">Admin</div>
                    <div class="profile-role">Administrator</div>
                </div>
            </div>
        </div>
    </header>

</body>
</html>
