<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

:root {
	--bg: #0f1118;
	--sidebar: #181d28;
	--card: #181d28;
	--border: #293142;
	--primary: #6c4ce5;
	--text: #f1f3f9;
	--muted: #929bb0;
	--input: #202634;
	--green: #36c995;
	--yellow: #f4bd50;
	--red: #ff7373;
}

body.light-mode {
	--bg: #f4f6fb;
	--sidebar: #ffffff;
	--card: #ffffff;
	--border: #e2e6ef;
	--text: #242938;
	--muted: #727c91;
	--input: #f5f6fa;
}

body {
	font-family: Arial, Helvetica, sans-serif;
	background: var(--bg);
	color: var(--text);
	min-height: 100vh;
}
/* 
       SIDEBAR LAYOUT (Dashboard & Payments တွင် တူညီရန်) */
.app {
	display: flex;
	min-height: 100vh;
}

.sidebar {
	width: 260px;
	position: fixed;
	top: 0;
	left: 0;
	bottom: 0;
	height: 100vh;
	background: var(--sidebar);
	border-right: 1px solid var(--border);
	padding: 25px 18px;
	z-index: 1000;
	overflow-y: auto;
	display: flex;
	flex-direction: column;
}

.sidebar .brand {
	display: flex;
	align-items: center;
	gap: 12px;
	text-decoration: none;
	margin-bottom: 25px;
	padding: 0 5px;
}

.sidebar .brand-icon {
	width: 40px;
	height: 40px;
	background: var(--primary);
	color: white;
	border-radius: 10px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 18px;
}

.sidebar .brand-name {
	font-size: 16px;
	font-weight: 700;
	color: var(--text);
}

.sidebar .brand-subtitle {
	font-size: 11px;
	color: var(--muted);
}

.sidebar .menu-heading {
	font-size: 11px;
	text-transform: uppercase;
	color: var(--muted);
	letter-spacing: 0.5px;
	margin: 20px 0 10px 5px;
	font-weight: 600;
}

.sidebar .nav-link {
	display: flex;
	align-items: center;
	gap: 12px;
	padding: 11px 14px;
	color: var(--muted);
	text-decoration: none;
	border-radius: 9px;
	font-size: 13px;
	font-weight: 500;
	margin-bottom: 4px;
	transition: all 0.2s ease;
}

.sidebar .nav-link:hover, .sidebar .nav-link.active {
	background: rgba(108, 76, 229, 0.15);
	color: var(--text);
}

.sidebar .nav-link.active {
	color: #a894ff;
	font-weight: 600;
}

.sidebar .nav-link i {
	width: 18px;
	text-align: center;
	font-size: 15px;
}

.sidebar .sidebar-bottom {
	margin-top: auto;
	border-top: 1px solid var(--border);
	padding-top: 15px;
}

/* =====================================================
       TOPBAR LAYOUT
       ===================================================== */
.topbar {
	min-height: 88px;
	padding: 18px 30px;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 20px;
	border-bottom: 1px solid var(--border);
	background: var(--card);
	position: sticky;
	top: 0;
	z-index: 50;
}

.page-heading h1 {
	font-size: 20px;
	font-weight: 700;
	color: var(--text);
	margin-bottom: 3px;
}

.page-heading p {
	font-size: 13px;
	color: var(--muted);
}

.topbar-right {
	display: flex;
	align-items: center;
	gap: 15px;
}

.icon-btn {
	background: var(--input);
	border: 1px solid var(--border);
	color: var(--text);
	width: 38px;
	height: 38px;
	border-radius: 9px;
	cursor: pointer;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 15px;
}

.profile {
	display: flex;
	align-items: center;
	gap: 12px;
}

.avatar {
	width: 40px;
	height: 40px;
	background: var(--primary);
	color: white;
	border-radius: 50%;
	display: flex;
	align-items: center;
	justify-content: center;
	font-weight: bold;
	font-size: 14px;
}

.profile-name {
	font-weight: 600;
	font-size: 14px;
	color: var(--text);
}

.profile-role {
	font-size: 11px;
	color: var(--muted);
}
</style>
</head>
<body>

	<!-- SIDEBAR FRAGMENT -->
	<div class="sidebar" th:fragment="sidebar(activePage)">
		<a th:href="@{/admin/dashboard}" class="brand">
			<div class="brand-icon">
				<i class="fa-solid fa-graduation-cap"></i>
			</div>
			<div>
				<div class="brand-name">LearnHub</div>
				<div class="brand-subtitle">Admin Portal</div>
			</div>
		</a>

		<div class="menu-heading">Overview</div>
		<a th:href="@{/admin/dashboard}" class="nav-link"
			th:classappend="${activePage == 'dashboard'} ? ' active' : ''"> <i
			class="fa-solid fa-table-columns"></i> <span>Dashboard</span>
		</a> <a th:href="@{/admin/reports}" class="nav-link"
			th:classappend="${activePage == 'reports'} ? ' active' : ''"> <i
			class="fa-solid fa-chart-line"></i> <span>Reports</span>
		</a>

		<div class="menu-heading">Users</div>
		<a th:href="@{/admin/users}" class="nav-link"
			th:classappend="${activePage == 'users'} ? ' active' : ''"> <i
			class="fa-solid fa-users"></i> <span>User Management</span>
		</a>

		<div class="menu-heading">Catalog</div>
		<a th:href="@{/admin/courses}" class="nav-link"
			th:classappend="${activePage == 'courses'} ? ' active' : ''"> <i
			class="fa-solid fa-book-open"></i> <span>Courses</span>
		</a> <a th:href="@{/admin/batches}" class="nav-link"
			th:classappend="${activePage == 'batches'} ? ' active' : ''"> <i
			class="fa-regular fa-calendar"></i> <span>Batches</span>
		</a>

		<div class="menu-heading">Enrollment</div>
		<a th:href="@{/admin/enrollments}" class="nav-link"
			th:classappend="${activePage == 'enrollments'} ? ' active' : ''">
			<i class="fa-solid fa-user-check"></i> <span>Enrollments</span>
		</a> <a th:href="@{/admin/payments-refunds}" class="nav-link"
			th:classappend="${activePage == 'payments-refunds'} ? ' active' : ''">
			<i class="fa-solid fa-file-invoice-dollar"></i> <span>Payments
				&amp; Refunds</span>
		</a> <a th:href="@{/admin/overdue-installments}" class="nav-link"
			th:classappend="${activePage == 'overdue'} ? ' active' : ''"> <i
			class="fa-solid fa-clock-rotate-left"></i> <span>Overdue
				Installments</span>
		</a>


		<div class="sidebar-bottom">
			<a th:href="@{/admin/notification}" class="nav-link"> <i
				class="fa-regular fa-bell"></i> <span>Notifications</span>
			</a> <a th:href="@{/admin/profile}" class="nav-link"> <i
				class="fa-regular fa-user"></i> <span>My Profile</span>
			</a> <a th:href="@{/admin/logout}" class="nav-link"> <i
				class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
			</a>
		</div>
	</div>

	<!-- TOPBAR FRAGMENT -->
	<header class="topbar" th:fragment="topbar(title, subtitle)">
		<div class="page-heading">
			<h1 th:text="${title}">Dashboard</h1>
			<p th:text="${subtitle}">Learning Management System</p>
		</div>
		<div class="topbar-right">
			<button type="button" class="icon-btn" id="themeToggle"
				title="Toggle light and dark mode">
				<i class="fa-regular fa-moon"></i>
			</button>
			<div class="profile">
				<div class="avatar">AD</div>
				<div>
					<div class="profile-name"
						th:text="${session.fullName != null ? session.fullName : 'Admin'}">Admin</div>
					<div class="profile-role">Administrator</div>
				</div>
			</div>
		</div>
	</header>
</body>
</html>
