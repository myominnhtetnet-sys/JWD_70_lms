<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen py-10 flex items-center justify-center p-4">

<div class="max-w-xl w-full bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm overflow-hidden">
    
    <!-- Header -->
    <div class="bg-indigo-600 px-6 py-6 text-white text-center">
        <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center mx-auto mb-3 text-white">
            <i class="fa-solid fa-user-plus text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Student Registration</h1>
        <p class="text-xs text-indigo-100 mt-1">Fill in your details to create your new student account</p>
    </div>

    <!-- Success Alert Box -->
    <div th:if="${param.success}" class="m-6 mb-0 p-4 bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 rounded-xl flex items-center gap-3 text-emerald-700 dark:text-emerald-300">
        <i class="fa-solid fa-circle-check text-lg"></i>
        <p class="text-xs font-semibold">Registration successful! Your account has been created.</p>
    </div>

    <!-- Form Content -->
    <div class="p-6 sm:p-8">
        <form th:action="@{/register}" th:object="${student}" method="post" class="space-y-4">
            
            <!-- Hidden field for Student Role ID (3) -->
            <input type="hidden" th:field="*{roleId}" value="3" />

            <!-- Full Name -->
            <div>
                <label for="fullName" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Full Name</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-regular fa-user text-sm"></i>
                    </span>
                    <input type="text" id="fullName" th:field="*{fullName}" placeholder="Enter full name" required
                        class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 dark:text-white transition">
                </div>
            </div>

            <!-- Email Address -->
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-regular fa-envelope text-sm"></i>
                    </span>
                    <input type="email" id="email" th:field="*{email}" placeholder="name@example.com" required
                        class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 dark:text-white transition">
                </div>
            </div>

            <!-- Phone Number -->
            <div>
                <label for="phone" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Phone Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-phone text-sm"></i>
                    </span>
                    <input type="text" id="phone" th:field="*{phone}" placeholder="09xxxxxxxxx" required
                        class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 dark:text-white transition">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label for="passwordHash" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="passwordHash" th:field="*{passwordHash}" placeholder="Enter password" required
                        class="w-full pl-10 pr-10 py-2.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 dark:text-white transition">
                    
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 focus:outline-none">
                        <i id="eyeIcon" class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Date of Birth & Gender -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="dob" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Date of Birth</label>
                    <input type="date" id="dob" th:field="*{dob}" required
                        class="w-full px-4 py-2.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 dark:text-white transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Gender</label>
                    <div class="flex items-center gap-4 pt-2">
                        <label class="flex items-center gap-1.5 cursor-pointer text-sm text-slate-700 dark:text-slate-300">
                            <input type="radio" th:field="*{gender}" id="male" value="MALE" required class="text-indigo-600">
                            <span>Male</span>
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer text-sm text-slate-700 dark:text-slate-300">
                            <input type="radio" th:field="*{gender}" id="female" value="FEMALE" required class="text-indigo-600">
                            <span>Female</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Address -->
            <div>
                <label for="address" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Address</label>
                <textarea id="address" th:field="*{address}" rows="2" placeholder="Enter address" required
                    class="w-full px-4 py-2.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 dark:text-white transition resize-none"></textarea>
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button type="submit" 
                    class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs transition shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-check"></i>
                    Register
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById("passwordHash");
        const eyeIcon = document.getElementById("eyeIcon");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.classList.remove("fa-eye");
            eyeIcon.classList.add("fa-eye-slash");
        } else {
            passwordInput.type = "password";
            eyeIcon.classList.remove("fa-eye-slash");
            eyeIcon.classList.add("fa-eye");
        }
    }
</script>

</body>
</html>
